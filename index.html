<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Eagle NEW</title>
<style>body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:12px}.card{background:#1e1e1e;border-radius:16px;padding:16px;margin:12px 0}.btn{padding:16px;border:none;border-radius:12px;font-weight:800;width:48%;margin:1%}.btn-gold{background:#facc15}.btn-green{background:#22c55e;color:#fff}.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:15px;z-index:9999}.modal.open{display:flex}.box{background:#1e1e1e;border-radius:16px;padding:20px;width:100%;max-width:350px;text-align:center}input{width:100%;padding:12px;background:#2a2a2a;border:none;border-radius:10px;color:#fff;margin:6px 0;text-align:center}</style></head><body>
<h2>🦅 NEW DASHBOARD v5 - CACHE KILLER</h2>
<div class="card"><b>Balance KES <span id="bal">0</span></b><br><br><button class="btn btn-gold" onclick="openDep()">💰 DEPOSIT STK</button><button class="btn btn-green" onclick="openWith()">💸 WITHDRAW</button></div>
<div class="card" id="list"></div>

<div class="modal" id="depM"><div class="box" id="d1"><h3>📲 STK Push</h3><input id="da" value="1000" type="number"><input id="dp" value="0115183029"><button class="btn btn-gold" style="width:100%" onclick="doDep()">SEND STK</button><button class="btn" style="width:100%;background:#333;color:#fff" onclick="closeAll()">Cancel</button></div><div class="box" id="d2" style="display:none"><h3>STK Sent to <span id="dpt" style="color:#facc15"></span></h3><div id="dc" style="font-size:40px;color:#facc15">15</div><div style="height:6px;background:#333"><div id="db" style="height:6px;background:#facc15;width:0%"></div></div><small>Awaiting Mpesa PIN</small></div><div class="box" id="d3" style="display:none"><h3 style="color:#0f0">✅ Confirmed</h3><div id="df"></div><button class="btn btn-gold" style="width:100%" onclick="closeAll()">DONE</button></div></div>

<div class="modal" id="withM"><div class="box" id="w1"><h3>💸 Withdraw</h3><div>Balance KES <span id="wb"></span></div><input id="wa" placeholder="Amount"><input id="wp" value="0115183029"><button class="btn btn-green" style="width:100%" onclick="doWith()">REQUEST</button><button class="btn" style="width:100%;background:#333;color:#fff" onclick="closeAll()">Cancel</button></div><div class="box" id="w2" style="display:none"><h3>⏳ Awaiting Admin Approval</h3><div id="wf"></div><button class="btn btn-gold" style="width:100%" onclick="closeAll()">DONE</button></div></div>

<script>
if(!localStorage.getItem('GE_BAL'))localStorage.setItem('GE_BAL','5800');if(!localStorage.getItem('GE_DEPOSITS'))localStorage.setItem('GE_DEPOSITS','[]');if(!localStorage.getItem('GE_REQS'))localStorage.setItem('GE_REQS','[]');
let t=null,p={};function getB(){return parseInt(localStorage.getItem('GE_BAL'))}
function openDep(){document.getElementById('depM').classList.add('open');document.getElementById('d1').style.display='block';document.getElementById('d2').style.display='none';document.getElementById('d3').style.display='none';}
function openWith(){document.getElementById('wb').innerText=getB();document.getElementById('withM').classList.add('open');document.getElementById('w1').style.display='block';document.getElementById('w2').style.display='none';}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'));clearInterval(t);render();}
function doDep(){let a=parseInt(document.getElementById('da').value),ph=document.getElementById('dp').value;p={a:a,ph:ph,id:'QGH'+Math.random().toString(36).substr(2,6).toUpperCase()};document.getElementById('dpt').innerText=ph;document.getElementById('d1').style.display='none';document.getElementById('d2').style.display='block';let s=15;document.getElementById('dc').innerText=s;document.getElementById('db').style.width='0%';clearInterval(t);t=setInterval(()=>{s--;document.getElementById('dc').innerText=s;document.getElementById('db').style.width=((15-s)/15*100)+'%';if(s<=0){clearInterval(t);let b=getB()+p.a;localStorage.setItem('GE_BAL',b);let d=JSON.parse(localStorage.getItem('GE_DEPOSITS'));d.unshift({amt:p.a,code:p.id,date:new Date().toLocaleString(),status:'approved'});localStorage.setItem('GE_DEPOSITS',JSON.stringify(d));document.getElementById('d2').style.display='none';document.getElementById('d3').style.display='block';document.getElementById('df').innerHTML='KES '+p.a+' Added<br>'+p.id;}},1000);}
function doWith(){let a=parseInt(document.getElementById('wa').value),ph=document.getElementById('wp').value;if(a<200){alert('Min 200');return}if(a>getB()){alert('Low bal');return}let r=JSON.parse(localStorage.getItem('GE_REQS'));let id='W'+Date.now();r.unshift({amt:a,phone:ph,id:id,date:new Date().toLocaleString(),status:'pending_approval'});localStorage.setItem('GE_REQS',JSON.stringify(r));document.getElementById('w1').style.display='none';document.getElementById('w2').style.display='block';document.getElementById('wf').innerHTML='KES '+a+' to '+ph+'<br>'+id+'<br><br>Admin will approve 5-30min';}
function render(){document.getElementById('bal').innerText=getB();let d=JSON.parse(localStorage.getItem('GE_DEPOSITS')),r=JSON.parse(localStorage.getItem('GE_REQS'));document.getElementById('list').innerHTML=[...d,...r].map(x=>`<div style="padding:8px;border-bottom:1px solid #222;display:flex;justify-content:space-between"><span>KES ${x.amt} ${x.code||x.id}</span><span style="color:${x.status=='approved'?'#0f0':'#facc15'}">${x.status}</span></div>`).join('')||'No activity';}
render();
</script></body></html>
