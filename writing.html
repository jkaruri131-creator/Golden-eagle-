<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Writing Jobs</title>
<style>
*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0}
body{background:#07070a;color:#fff;min-height:100vh}
.top{max-width:800px;margin:0 auto;padding:12px;display:flex;justify-content:space-between}
.back{padding:8px 14px;border-radius:99px;font-size:10px;font-weight:800;text-decoration:none;border:1px solid #333;background:rgba(255,255,255,0.06);color:#fff}
.header{max-width:800px;margin:12px auto;background:linear-gradient(135deg,#1a102a,#1e1e32);border:2px solid #a855f7;border-radius:18px;padding:16px;text-align:center}
.header h1{color:#a855f7;font-size:18px}
.tabs{max-width:800px;margin:12px auto;display:flex;gap:6px;overflow:auto;padding:0 12px}
.tab{padding:10px 14px;border-radius:99px;font-size:10px;font-weight:900;cursor:pointer;border:1px solid #333;background:#1a1a2e;color:#888;white-space:nowrap}
.tab.active{background:#a855f7;color:#fff}
.card{background:#1e1e32;border:1px solid #333;border-radius:16px;padding:14px;margin:10px auto;max-width:800px;position:relative}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#a855f7,#7c3aed)}
.badge{padding:4px 8px;border-radius:99px;font-size:8px;font-weight:800;border:1px solid rgba(168,85,247,0.3);background:rgba(168,85,247,0.15);color:#c084fc}
.btn{width:100%;padding:12px;border-radius:12px;border:none;font-weight:900;font-size:11px;cursor:pointer;margin-top:10px}
.btn-purple{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff}
.btn-green{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
.btn-dark{background:#222;color:#888;border:1px solid #333}
.page{display:none}.page.active{display:block}
textarea{width:100%;background:#0f0f1a;border:1px solid #333;border-radius:10px;color:#fff;padding:10px;font-size:12px}
#status{max-width:800px;margin:0 auto 10px;text-align:center;font-size:10px;padding:8px;border-radius:10px;background:#111;border:1px solid #333}
</style>
</head>
<body>
<div class="top"><a class="back" href="dashboard.html">← DASHBOARD</a><a class="back" href="wallet.html">💰 WALLET</a></div>
<div class="header"><h1>✍️ WRITING JOBS</h1><p id="status">⏳ Loading jobs from Firebase...</p></div>
<div class="tabs">
<button class="tab active" id="t-avail" onclick="switchTab('available')">📋 AVAILABLE (<span id="cA">0</span>)</button>
<button class="tab" id="t-my" onclick="switchTab('mytask')">📁 MY TASKS (<span id="cM">0</span>)</button>
<button class="tab" id="t-ap" onclick="switchTab('approved')">✅ APPROVED (<span id="cAp">0</span>)</button>
<button class="tab" id="t-rj" onclick="switchTab('rejected')">❌ REJECTED (<span id="cR">0</span>)</button>
</div>
<div style="max-width:800px;margin:0 auto;padding:0 12px">
<div id="page-available" class="page active"></div>
<div id="page-mytask" class="page"></div>
<div id="page-approved" class="page"></div>
<div id="page-rejected" class="page"></div>
</div>
<div id="submitModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:99;padding:20px">
<div style="max-width:600px;margin:30px auto;background:#1e1e32;border:2px solid #a855f7;border-radius:18px;padding:16px">
<h3 style="color:#a855f7">📤 Submit Article</h3><p id="sTitle" style="font-size:11px;color:#888"></p>
<textarea id="artBox" style="min-height:220px;margin-top:10px" placeholder="Paste article min 100 chars"></textarea>
<button class="btn btn-green" onclick="doSubmit()">✅ SUBMIT</button>
<button class="btn btn-dark" onclick="document.getElementById('submitModal').style.display='none'">CANCEL</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, deleteDoc, setDoc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB6QxzDFhIIHwt6TTZla6g4m-FaJdMol6M",authDomain:"diamines-agencies.firebaseapp.com",projectId:"diamines-agencies",storageBucket:"diamines-agencies.firebasestorage.app",messagingSenderId:"438413306857",appId:"1:438413306857:web:3c7f736794be6a49b0f978"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let email=''; try{ let u=JSON.parse(localStorage.getItem('DIAMINES_CURRENT')||'{}'); email=(u.email||localStorage.getItem('DIAMINES_USER_EMAIL')||'').toLowerCase(); }catch{}
let availJobs=[], myJobs=[];
const K_MY='DIAMONDS_MY_'+email;

function switchTab(n){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('t-'+(n==='available'?'avail':n==='mytask'?'my':n==='approved'?'ap':'rj')).classList.add('active');
  document.getElementById('page-'+n).classList.add('active');
  if(n==='available') rAvail(); if(n==='mytask') rMy(); if(n==='approved') rAp(); if(n==='rejected') rRj();
}
window.switchTab=switchTab;

function rAvail(){
  document.getElementById('cA').innerText=availJobs.length;
  let el=document.getElementById('page-available');
  if(!availJobs.length){ el.innerHTML=`<div style="text-align:center;padding:60px;color:#555">📭 No available jobs<br><small>Admin will post in adminmasterpanel</small></div>`; return;}
  el.innerHTML=availJobs.map(j=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>✍️ ${j.title}</b><span style="color:#4ade80;font-weight:900;background:rgba(34,197,94,0.15);padding:5px 12px;border-radius:99px">KES ${j.price}</span></div><div style="margin-top:8px;display:flex;gap:5px"><span class="badge">📝 ${j.words||'800'}</span><span class="badge">⏱️ ${j.h||24}h</span><span class="badge">${j.level||'Medium'}</span></div><p style="font-size:11px;color:#aaa;margin-top:8px">${j.desc||''}</p><div style="background:#000;border:1px solid #222;border-radius:10px;padding:8px;margin-top:8px"><small style="color:#666">BRIEF:</small><p style="font-size:10px;color:#888">${(j.topic||'').substring(0,220)}...</p></div><button class="btn btn-purple" onclick="accept('${j.id}')">🚀 ACCEPT - KES ${j.price}</button></div>`).join('');
}
function rMy(){
  let f=myJobs.filter(j=>j.status==='in_progress'||j.status==='submitted'); document.getElementById('cM').innerText=f.length;
  let el=document.getElementById('page-mytask'); if(!f.length){ el.innerHTML=`<div style="text-align:center;padding:60px;color:#555">📁 No tasks - Accept from AVAILABLE</div>`; return;}
  el.innerHTML=f.map(j=>`<div class="card" style="border-left:5px solid #22c55e"><div style="display:flex;justify-content:space-between"><b>📝 ${j.title}</b><b style="color:#4ade80">KES ${j.price}</b></div><small style="color:#888">${j.takenAt?new Date(j.takenAt).toLocaleString():''} • ${j.status}</small><div style="background:#000;border:1px solid #222;border-radius:10px;padding:8px;margin-top:8px"><p style="font-size:10px;color:#888">${(j.topic||'').substring(0,300)}</p></div><button class="btn btn-green" onclick="openSub('${j.jobId||j.id}')">📤 SUBMIT</button></div>`).join('');
}
function rAp(){ let f=myJobs.filter(j=>j.status==='approved'); document.getElementById('cAp').innerText=f.length; document.getElementById('page-approved').innerHTML=f.length?f.map(j=>`<div class="card" style="border-left:5px solid #22c55e"><b>✅ ${j.title}</b> <b style="color:#4ade80;float:right">+KES ${j.price}</b><br><small>${j.feedback||''}</small></div>`).join(''):`<div style="text-align:center;padding:60px;color:#555">✅ No approved</div>`; }
function rRj(){ let f=myJobs.filter(j=>j.status==='rejected'); document.getElementById('cR').innerText=f.length; document.getElementById('page-rejected').innerHTML=f.length?f.map(j=>`<div class="card" style="border-left:5px solid #ef4444"><b>❌ ${j.title}</b><br><small style="color:#f87171">${j.feedback||''}</small></div>`).join(''):`<div style="text-align:center;padding:60px;color:#555">❌ No rejected</div>`; }

// LIVE AVAILABLE JOBS - From writingJobs collection
onSnapshot(collection(db, "writingJobs"), (snap)=>{
  availJobs=[]; snap.forEach(d=>{ let v=d.data(); if(!v.status||v.status==='available') availJobs.push(v); });
  availJobs.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  document.getElementById('status').innerHTML = "✅ LIVE: "+availJobs.length+" jobs available - From adminmasterpanel";
  document.getElementById('status').style.color="#4ade80";
  rAvail();
}, (err)=>{
  document.getElementById('status').innerHTML = "❌ Firebase Error: "+err.message;
  document.getElementById('status').style.color="#f87171";
});

// LIVE MY JOBS - From writingTaken
onSnapshot(collection(db, "writingTaken"), (snap)=>{
  myJobs=[]; snap.forEach(d=>{ let v=d.data(); if((v.takenBy||'').toLowerCase()===email) myJobs.push(v); });
  let local=JSON.parse(localStorage.getItem(K_MY)||'[]');
  local.forEach(l=>{ if((l.status==='approved'||l.status==='rejected') &&!myJobs.find(m=>m.jobId===l.jobId && m.status===l.status)) myJobs.push(l); });
  localStorage.setItem(K_MY, JSON.stringify(myJobs));
  document.getElementById('cM').innerText=myJobs.filter(j=>j.status==='in_progress'||j.status==='submitted').length;
  document.getElementById('cAp').innerText=myJobs.filter(j=>j.status==='approved').length;
  document.getElementById('cR').innerText=myJobs.filter(j=>j.status==='rejected').length;
  rMy(); rAp(); rRj();
});

let cur=null;
window.accept=async function(id){
  let job=availJobs.find(j=>j.id===id); if(!job) return;
  if(!confirm('Accept '+job.title+'?')) return;
  let taken={...job, jobId:id, takenBy:email, takenAt:new Date().toISOString(), status:'in_progress', userEmail:email};
  try{
    await deleteDoc(doc(db, "writingJobs", id));
    await setDoc(doc(db, "writingTaken", id), taken);
    await setDoc(doc(db, "writingPending", String(Date.now())), {...taken, original:taken.topic});
    alert('✅ Accepted! Disappeared for ALL users!');
  }catch(e){ alert('Error: '+e.message); }
}
window.openSub=function(jobId){ let j=myJobs.find(x=>(x.jobId||x.id)===jobId); if(!j) return; cur=j; document.getElementById('sTitle').innerText=j.title; document.getElementById('artBox').value=''; document.getElementById('submitModal').style.display='block'; }
window.doSubmit=async function(){
  let txt=document.getElementById('artBox').value.trim(); if(txt.length<100) return alert('Min 100 chars');
  let idx=myJobs.findIndex(x=>(x.jobId||x.id)===(cur.jobId||cur.id)); if(idx==-1) return;
  myJobs[idx].status='submitted'; myJobs[idx].written=txt; myJobs[idx].submittedAt=new Date().toISOString();
  localStorage.setItem(K_MY, JSON.stringify(myJobs));
  try{ await setDoc(doc(db, "writingTaken", cur.jobId||cur.id), myJobs[idx]); await setDoc(doc(db, "writingPending", String(Date.now())), {...myJobs[idx], written:txt, userEmail:email, earn:myJobs[idx].price}); }catch(e){}
  document.getElementById('submitModal').style.display='none'; alert('✅ Submitted! Admin reviews in adminmasterpanel > Review Writing'); rMy();
}
</script>
</body>
</html>
