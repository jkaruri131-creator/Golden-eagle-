<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Writing Jobs</title>
<style>
*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0}
body{background:#07070a;color:#fff;padding:12px;min-height:100vh}
.card{background:#1e1e32;border:1px solid #333;border-radius:16px;padding:14px;margin-bottom:10px;position:relative}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#a855f7,#7c3aed)}
.btn{width:100%;padding:12px;border:none;border-radius:12px;font-weight:900;font-size:11px;cursor:pointer;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff}
</style>
</head>
<body>
<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {apiKey:"AIzaSyB6QxzDFhIIHwt6TTZla6g4m-FaJdMol6M",authDomain:"diamines-agencies.firebaseapp.com",projectId:"diamines-agencies",storageBucket:"diamines-agencies.firebasestorage.app",messagingSenderId:"438413306857",appId:"1:438413306857:web:3c7f736794be6a49b0f978"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const CACHE_KEY = 'DIAMINES_WRITING_CACHE_V2';

function getCache(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY)||'[]') }catch{return[]} }
function saveCache(jobs){ localStorage.setItem(CACHE_KEY, JSON.stringify(jobs)); }

function render(jobs){
  // Stable order - no changes on refresh
  jobs.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  if(!jobs.length){
    document.getElementById('list').innerHTML = `<div style="text-align:center;padding:60px;color:#666">No available jobs right now<br><small>Check again later</small></div>`;
    return;
  }
  document.getElementById('list').innerHTML = jobs.map(j=>`
    <div class="card" id="card_${j.id}">
      <div style="display:flex;justify-content:space-between"><b>✍️ ${j.title}</b><b style="color:#4ade80">KES ${j.price}</b></div>
      <small style="color:#888">${j.words||''} • ${j.h||24}h • ${j.level||'Medium'}</small>
      <p style="font-size:11px;color:#aaa;margin-top:6px">${j.desc||''}</p>
      <button class="btn" style="margin-top:10px" onclick="acceptJob('${j.id}')">✅ TAKE THIS JOB</button>
    </div>
  `).join('');
}

// 1. INSTANT LOAD - 0ms - No flicker
let cached = getCache();
if(cached.length){ render(cached); }

// 2. SYNC Firebase in background - Filter only available
async function sync(){
  try{
    let snap = await getDocs(collection(db, "writingJobs"));
    let all=[];
    snap.forEach(d=>all.push(d.data()));
    // ONLY available jobs show - taken/awarded disappears
    let available = all.filter(j=>!j.status || j.status==='available');
    saveCache(available);
    render(available);
  }catch(e){ if(!cached.length) render([]); }
}
sync();

// 3. ACCEPT - Disappears instantly from main website + Firebase for all
window.acceptJob = async function(jobId){
  if(!confirm('Take this job? It will be assigned to you and disappear for others.')) return;

  // Instant disappear for this user - no reload change
  let jobs = getCache().filter(j=>j.id!==jobId);
  saveCache(jobs);
  render(jobs);

  // Remove from Firebase so it disappears for ALL users globally
  try{
    // Option A: Delete from writingJobs (disappears forever from main)
    await deleteDoc(doc(db, "writingJobs", jobId));

    // Option B: Also save to taken collection for admin tracking
    let user = JSON.parse(localStorage.getItem('DIAMINES_CURRENT')||'{}');
    let email = (user.email||'unknown').toLowerCase();
    await setDoc(doc(db, "writingTaken", jobId), {
      jobId, takenBy: email, takenAt: new Date().toISOString()
    });

    // Save to user's pending list so adminwriting sees it
    let takenJob = cached.find(j=>j.id===jobId);
    if(takenJob){
      let pendingKey = 'DIAMINES_WRITING_PENDING_GLOBAL';
      let pending = JSON.parse(localStorage.getItem(pendingKey)||'[]');
      pending.unshift({...takenJob, userEmail: email, submittedAt: Date.now(), jobId: jobId, status:'in_progress'});
      localStorage.setItem(pendingKey, JSON.stringify(pending));
      try{ await setDoc(doc(db, "writingPending", String(Date.now())), pending[0]); }catch{}
    }
  }catch(e){ console.log(e); }

  alert('✅ Job assigned to you! Check My Tasks.');
  // window.location.href = 'my-writing-tasks.html';
}
</script>
</body>
</html>
