<style>

<body>
<div id="jobs">Loading...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6QxzDFhIIHwt6TTZla6g4m-FaJdMol6M",
  authDomain: "diamines-agencies.firebaseapp.com",
  projectId: "diamines-agencies",
  storageBucket: "diamines-agencies.firebasestorage.app",
  messagingSenderId: "438413306857",
  appId: "1:438413306857:web:3c7f736794be6a49b0f978"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const CACHE_KEY = 'DIAMINES_WRITING_CACHE';
const CACHE_TIME = 'DIAMINES_WRITING_CACHE_TIME';

// 1. INSTANT LOAD - Show cache in 0ms - No waiting!
function getCached(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY)||'[]') }catch{ return [] } }

function render(jobs, isCache=false){
  // 2. STABLE - No changes on refresh - Sort by createdAt fixed
  jobs = jobs.filter(j => !j.status || j.status==='available'); // 3. AWARDED DISAPPEARS - only available
  jobs.sort((a,b)=> new Date(b.createdAt||0) - new Date(a.createdAt||0));

  if(!jobs.length){
    if(isCache) document.getElementById('jobs').innerHTML = `<div style="text-align:center;padding:40px;color:#666">⏳ Syncing jobs...</div>`;
    else document.getElementById('jobs').innerHTML = `<div style="text-align:center;padding:40px;color:#666">No available jobs yet</div>`;
    return;
  }

  // YOUR SAME CARD UI - Paste your original card HTML here
  document.getElementById('jobs').innerHTML = jobs.map(j=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between"><b>✍️ ${j.title}</b><span style="color:#4ade80">KES ${j.price}</span></div>
      <small style="color:#888">${j.words||''} • ${j.h||24}h • ${j.level||'Medium'}</small>
      <p style="font-size:11px;color:#aaa;margin-top:6px">${j.desc||''}</p>
      <div style="display:flex;gap:6px;margin-top:10px">
        <button class="btn" style="background:#a855f7;color:#fff;flex:1" onclick="takeJob('${j.id}')">TAKE JOB</button>
      </div>
    </div>
  `).join('') + (isCache?`<div style="text-align:center;font-size:8px;color:#333;margin-top:10px">⚡ Showing cached - Updating...</div>`:'');
}

// INSTANT - Render cache immediately - 0ms load!
let cached = getCached();
if(cached.length){ render(cached, true); }

// BACKGROUND SYNC - Update cache silently
async function syncFirebase(){
  try{
    let snap = await getDocs(collection(db, "writingJobs"));
    let jobs = [];
    snap.forEach(d=>jobs.push(d.data()));
    // Only available jobs
    localStorage.setItem(CACHE_KEY, JSON.stringify(jobs));
    localStorage.setItem(CACHE_TIME, Date.now().toString());
    render(jobs, false);
  }catch(e){
    console.log("Firebase sync error", e);
    if(!cached.length) render([], false);
  }
}

syncFirebase();

// When user takes job - remove instantly + update Firebase status elsewhere
window.takeJob = function(id){
  // You have your existing take logic - After award, set status != available
  // For instant disappear:
  let all = getCached();
  let remaining = all.filter(j=>j.id!==id);
  localStorage.setItem(CACHE_KEY, JSON.stringify(remaining));
  render(remaining, false);
  // Then your existing code to save to pending...
  // e.g. window.location.href = 'apply.html?id='+id
  alert("Job taken! It will disappear from main list for all users once admin awards it.");
}

</script>
