<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Writing Jobs</title>
<style>
*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0}
body{background:#07070a;color:#fff;padding:12px;min-height:100vh}
.top{max-width:700px;margin:0 auto 12px;display:flex;justify-content:space-between;gap:6px}
.back{padding:8px 12px;background:rgba(255,255,255,0.08);border:1px solid #333;border-radius:10px;color:#fff;text-decoration:none;font-size:10px;font-weight:800}
.card{background:#1e1e32;border:1px solid #333;border-radius:16px;padding:14px;margin-bottom:10px;position:relative}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#a855f7,#7c3aed)}
.tabs{max-width:700px;margin:10px auto;display:flex;gap:6px;flex-wrap:wrap}
.tab{flex:1;padding:11px;border-radius:10px;border:1px solid #333;background:#111;color:#888;font-weight:800;font-size:10px;cursor:pointer;text-align:center;min-width:80px}
.tab.active{background:#a855f7;color:#fff;border-color:#a855f7}
.btn{padding:10px;border-radius:10px;border:none;font-weight:800;cursor:pointer;font-size:10px;flex:1;display:flex;justify-content:center}
.btn-e{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff}
.btn-v{background:rgba(255,255,255,0.08);color:#aaa;border:1px solid #333}
input,textarea{width:100%;background:#0f0f1a;border:1px solid #333;border-radius:10px;color:#fff;padding:10px;margin-top:6px;font-size:12px;outline:none}
textarea{height:120px}
label{font-size:8px;color:#888;font-weight:800;margin-top:8px;display:block;letter-spacing:1px}
.status-PENDING{color:#fbbf24}.status-APPROVED{color:#4ade80}.status-REJECTED{color:#f87171}
</style>
</head>
<body>
<div class="top"><a class="back" href="dashboard.html">← DASHBOARD</a><span style="font-size:10px;color:#a855f7;font-weight:800">✍️ WRITING JOBS</span></div>
<div id="fbStatus" style="max-width:700px;margin:0 auto;text-align:center;font-size:10px;padding:8px;border-radius:10px;background:#111;border:1px solid #333">⏳ Loading jobs...</div>

<div class="tabs">
<button class="tab active" id="tabAvailable" onclick="switchTab('available')">💼 AVAILABLE (<span id="cAvailable">0</span>)</button>
<button class="tab" id="tabPending" onclick="switchTab('pending')">⏳ MY PENDING (<span id="cPending">0</span>)</button>
<button class="tab" id="tabApproved" onclick="switchTab('approved')">✅ APPROVED (<span id="cApproved">0</span>)</button>
<button class="tab" id="tabRejected" onclick="switchTab('rejected')">❌ REJECTED (<span id="cRejected">0</span>)</button>
</div>

<div id="list" style="max-width:700px;margin:0 auto"></div>

<!-- SUBMIT MODAL -->
<div id="submitModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:99;padding:12px;overflow:auto">
<div class="card" style="max-width:600px;margin:20px auto">
<h4 id="modalTitle" style="color:#a855f7">Submit Work</h4>
<p id="modalDesc" style="font-size:11px;color:#888;margin-top:6px"></p>
<label>Your Full Article (Paste here)</label><textarea id="sContent" placeholder="Paste your full article following all instructions..."></textarea>
<div style="display:flex;gap:6px;margin-top:10px"><button class="btn btn-v" onclick="closeModal()">CANCEL</button><button class="btn btn-e" id="submitBtn" onclick="submitWork()">🚀 SUBMIT FOR REVIEW</button></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, setDoc, addDoc, query, where, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB6QxzDFhIIHwt6TTZla6g4m-FaJdMol6M",authDomain:"diamines-agencies.firebaseapp.com",projectId:"diamines-agencies",storageBucket:"diamines-agencies.firebasestorage.app",messagingSenderId:"438413306857",appId:"1:438413306857:web:3c7f736794be6a49b0f978"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let availableJobs=[], myPending=[], myApproved=[], myRejected=[];
let currentTab='available';
let selectedJob=null;
let userEmail = localStorage.getItem('userEmail') || localStorage.getItem('email') || '';
if(!userEmail){
  try{
    let keys=Object.keys(localStorage);
    for(let k of keys){ if(k.includes('firebase') && localStorage[k].includes('email')){ let d=JSON.parse(localStorage[k]); if(d.email) userEmail=d.email; } }
  }catch(e){}
}
if(!userEmail) userEmail = prompt('Enter your email to see your jobs:')||'guest';

window.switchTab = function(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active');
  render();
}

function render(){
  document.getElementById('cAvailable').innerText=availableJobs.length;
  document.getElementById('cPending').innerText=myPending.length;
  document.getElementById('cApproved').innerText=myApproved.length;
  document.getElementById('cRejected').innerText=myRejected.length;

  let data = currentTab==='available'?availableJobs:currentTab==='pending'?myPending:currentTab==='approved'?myApproved:myRejected;
  if(!data.length){
    document.getElementById('list').innerHTML=`<div style="text-align:center;padding:40px;color:#666">No ${currentTab} jobs<br><small>${currentTab==='available'?'Jobs posted by admin will appear here':currentTab==='pending'?'You have no pending submissions - they move here instantly after you submit':currentTab==='approved'?'When admin approves, it moves here INSTANTLY ✅':'When admin rejects, it moves here instantly ❌'}</small></div>`; return;
  }

  let h=data.map(j=>{
    if(currentTab==='available'){
      return `<div class="card"><div style="display:flex;justify-content:space-between"><b>✍️ ${j.title}</b><span style="color:#4ade80">KES ${j.price}</span></div><small style="color:#888">${j.words||'800 words'} • ${j.h||24}h • ${j.level||'Medium'} • ${j.id}</small><p style="font-size:11px;color:#aaa;margin-top:6px">${j.desc||''}</p><div style="background:#0f0f1a;padding:8px;border-radius:8px;margin-top:8px;font-size:10px;color:#ccc;max-height:100px;overflow:auto"><b style="color:#a855f7">Full Topic:</b> ${j.topic||j.brief||''}</div><div style="display:flex;gap:6px;margin-top:10px"><button class="btn btn-e" onclick="openSubmit('${j.id}')">✍️ TAKE & SUBMIT</button></div></div>`;
    } else {
      let st = (j.status||currentTab).toUpperCase();
      return `<div class="card"><div style="display:flex;justify-content:space-between"><b>${j.jobTitle||j.title||'Writing Job'}</b><span class="status-${st}">${st}</span></div><small style="color:#888">${j.jobId||j.id} • KES ${j.price||j.jobPrice||0} • ${j.words||''}</small><p style="font-size:11px;color:#aaa;margin-top:8px;background:#0f0f1a;padding:8px;border-radius:8px;max-height:120px;overflow:auto">${(j.content||j.submission||j.written||j.proof||'').substring(0,800)}</p>${j.feedback?`<div style="margin-top:8px;padding:8px;background:rgba(168,85,247,0.1);border-radius:8px;font-size:10px;color:#c084fc"><b>Feedback:</b> ${j.feedback}</div>`:''}${j.rejectReason?`<div style="margin-top:8px;padding:8px;background:rgba(239,68,68,0.1);border-radius:8px;font-size:10px;color:#f87171"><b>Reason:</b> ${j.rejectReason}</div>`:''}${st==='APPROVED'?`<div style="margin-top:8px;padding:8px;background:rgba(34,197,94,0.1);border-radius:8px;font-size:10px;color:#4ade80">✅ Paid! Check wallet - KES ${j.earn||j.price||j.jobPrice||0}</div>`:''}<small style="color:#666;margin-top:6px;display:block">${j.reviewedAt?new Date(j.reviewedAt).toLocaleString():j.createdAt?.seconds?new Date(j.createdAt.seconds*1000).toLocaleString():j.createdAt||j.submittedAt?new Date(j.submittedAt).toLocaleString():''}</small></div>`;
    }
  }).join('');
  document.getElementById('list').innerHTML=h;
}

// ===== FIXED LISTENERS - 100% INSTANT MOVE =====
onSnapshot(collection(db, "writingJobs"), (snap)=>{
  availableJobs=[]; snap.forEach(d=>availableJobs.push(d.data()));
  availableJobs.sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  if(currentTab==='available') render();
  updateStatus();
});

// PENDING: writingSubmissions + writingPending + writingTaken(submitted)
function refreshPending(){
  if(currentTab==='pending') render();
  updateStatus();
}
onSnapshot(query(collection(db, "writingSubmissions"), where("userEmail","==",userEmail)), (snap)=>{
  snap.forEach(d=>{
    let data={id:d.id,...d.data()};
    if(data.status!=='approved' && data.status!=='rejected'){
      if(!myPending.find(x=>x.id===data.id)) myPending.push(data);
    } else {
      myPending=myPending.filter(x=>x.id!==data.id);
    }
  });
  // remove those that moved to approved/rejected
  myPending=myPending.filter(x=>!myApproved.find(a=>a.id===x.id||a.jobId===x.jobId||String(a.submittedAt)===String(x.submittedAt)) &&!myRejected.find(r=>r.id===x.id||r.jobId===x.jobId||String(r.submittedAt)===String(x.submittedAt)));
  refreshPending();
});
onSnapshot(query(collection(db, "writingSubmissions"), where("email","==",userEmail)), (snap)=>{
  snap.forEach(d=>{
    let data={id:d.id,...d.data()};
    if((data.status||'pending')==='pending' &&!myPending.find(x=>x.id===data.id)) myPending.push(data);
  });
  refreshPending();
});
// Also listen to writingPending (your admin's collection)
onSnapshot(query(collection(db, "writingPending"), where("userEmail","==",userEmail)), (snap)=>{
  snap.forEach(d=>{
    let data={id:d.id,...d.data(), _src:'pending'};
    if(!myPending.find(x=>String(x.submittedAt)===String(data.submittedAt)||x.id===data.id)) myPending.push(data);
  });
  refreshPending();
});
onSnapshot(query(collection(db, "writingPending"), where("takenBy","==",userEmail)), (snap)=>{
  snap.forEach(d=>{
    let data={id:d.id,...d.data(), _src:'pending'};
    if(!myPending.find(x=>String(x.submittedAt)===String(data.submittedAt)||x.id===data.id)) myPending.push(data);
  });
  refreshPending();
});
// writingTaken where status=submitted = pending
onSnapshot(query(collection(db, "writingTaken"), where("userEmail","==",userEmail)), (snap)=>{
  myPending=[]; // rebuild from taken submitted to avoid duplicates
  snap.forEach(d=>{
    let v=d.data();
    if(v.status==='submitted'){
      myPending.push({id:d.id,...v});
    } else if(v.status==='approved'){
      if(!myApproved.find(x=>x.id===d.id)) myApproved.push({id:d.id,...v});
    } else if(v.status==='rejected'){
      if(!myRejected.find(x=>x.id===d.id)) myRejected.push({id:d.id,...v});
    }
  });
  // also keep submissions pending that are not in taken
  getDocs(query(collection(db, "writingSubmissions"), where("userEmail","==",userEmail))).then(()=>{});
  if(currentTab==='pending'||currentTab==='approved'||currentTab==='rejected') render();
  updateStatus();
});
onSnapshot(query(collection(db, "writingTaken"), where("takenBy","==",userEmail)), (snap)=>{
  snap.forEach(d=>{
    let v=d.data();
    if(v.status==='submitted' &&!myPending.find(x=>x.id===d.id)) myPending.push({id:d.id,...v});
    if(v.status==='approved' &&!myApproved.find(x=>x.id===d.id)) myApproved.push({id:d.id,...v});
    if(v.status==='rejected' &&!myRejected.find(x=>x.id===d.id)) myRejected.push({id:d.id,...v});
  });
  render(); updateStatus();
});

// APPROVED + REJECTED listeners
onSnapshot(query(collection(db, "writingApproved"), where("userEmail","==",userEmail)), (snap)=>{
  snap.forEach(d=>{
    let data={id:d.id,...d.data(), status:'approved'};
    if(!myApproved.find(x=>x.id===data.id)) myApproved.push(data);
    myPending=myPending.filter(x=>x.id!==data.id && String(x.submittedAt)!==String(data.submittedAt));
  });
  if(currentTab==='approved'||currentTab==='pending') render();
  updateStatus();
});
onSnapshot(query(collection(db, "writingApproved"), where("email","==",userEmail)), (snap)=>{
  snap.forEach(d=>{
    let data={id:d.id,...d.data(), status:'approved'};
    if(!myApproved.find(x=>x.id===data.id)) myApproved.push(data);
    myPending=myPending.filter(x=>x.id!==data.id);
  });
  if(currentTab==='approved'||currentTab==='pending') render();
  updateStatus();
});
onSnapshot(query(collection(db, "writingRejected"), where("userEmail","==",userEmail)), (snap)=>{
  snap.forEach(d=>{
    let data={id:d.id,...d.data(), status:'rejected'};
    if(!myRejected.find(x=>x.id===data.id)) myRejected.push(data);
    myPending=myPending.filter(x=>x.id!==data.id && String(x.submittedAt)!==String(data.submittedAt));
  });
  if(currentTab==='rejected'||currentTab==='pending') render();
  updateStatus();
});
onSnapshot(query(collection(db, "writingRejected"), where("email","==",userEmail)), (snap)=>{
  snap.forEach(d=>{
    let data={id:d.id,...d.data(), status:'rejected'};
    if(!myRejected.find(x=>x.id===data.id)) myRejected.push(data);
    myPending=myPending.filter(x=>x.id!==data.id);
  });
  if(currentTab==='rejected'||currentTab==='pending') render();
  updateStatus();
});

function updateStatus(){
  document.getElementById('fbStatus').innerHTML=`✅ LIVE as ${userEmail} • ${availableJobs.length} Available | ${myPending.length} Pending | ${myApproved.length} Approved | ${myRejected.length} Rejected - Instant ON`;
  document.getElementById('fbStatus').style.background="rgba(34,197,94,0.15)";
  document.getElementById('fbStatus').style.color="#4ade80";
}

window.openSubmit = function(jobId){
  selectedJob = availableJobs.find(x=>x.id===jobId);
  if(!selectedJob) return;
  document.getElementById('modalTitle').innerText=selectedJob.title;
  document.getElementById('modalDesc').innerText=(selectedJob.desc||'')+' | '+ (selectedJob.topic||'').substring(0,200);
  document.getElementById('submitModal').style.display='block';
}
window.closeModal = function(){ document.getElementById('submitModal').style.display='none'; selectedJob=null; }

window.submitWork = async function(){
  let content=document.getElementById('sContent').value.trim();
  if(!content || content.length<50){ alert('Write at least 50 characters'); return; }
  if(!selectedJob) return;
  let btn=document.getElementById('submitBtn'); btn.innerText='⏳ Submitting...'; btn.disabled=true;
  let tempId='SUB'+Date.now();
  let submission = {
    id: tempId,
    jobId: selectedJob.id,
    jobTitle: selectedJob.title,
    jobPrice: selectedJob.price,
    price: selectedJob.price,
    words: selectedJob.words,
    userEmail: userEmail,
    email: userEmail,
    content: content,
    submission: content,
    written: content,
    proof: content,
    title: selectedJob.title,
    original: selectedJob.topic||selectedJob.desc,
    topic: selectedJob.topic,
    status: 'pending',
    submittedAt: new Date().toISOString(),
    createdAt: new Date().toISOString()
  };
  myPending.unshift(submission);
  switchTab('pending');
  closeModal();
  document.getElementById('sContent').value='';
  btn.innerText='🚀 SUBMIT FOR REVIEW'; btn.disabled=false;
  try{
    await setDoc(doc(db, "writingSubmissions", tempId), {...submission, createdAt: serverTimestamp()});
    await setDoc(doc(db, "writingPending", tempId), {...submission, createdAt: serverTimestamp()});
    await setDoc(doc(db, "writingTaken", selectedJob.id+"_"+userEmail), {...submission, status:'submitted', jobId:selectedJob.id, takenBy:userEmail, userEmail:userEmail, earn:selectedJob.price, price:selectedJob.price});
  }catch(e){
    alert('Submit failed: '+e.message);
    myPending = myPending.filter(x=>x.id!==tempId);
    render();
  }
}
</script>
</body>
  </html>
