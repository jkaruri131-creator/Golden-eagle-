<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIAMINES - Reset Password</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#070711;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.box{width:100%;max-width:380px;background:#111126;border:1px solid #222;border-radius:16px;padding:22px}
.input{width:100%;background:#1a1a35;border:1px solid #333;border-radius:10px;padding:13px 12px;color:#fff;margin-bottom:12px;outline:none;font-size:14px}
.btn{width:100%;padding:14px;border-radius:10px;border:none;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#facc15,#ffb700);color:#000;font-size:15px}
.msg{padding:10px;border-radius:8px;font-size:11px;margin-bottom:12px;text-align:center;display:none}
.msg.err{background:rgba(255,23,68,0.15);border:1px solid #ff1744;color:#ff8da1;display:block}
.msg.ok{background:rgba(0,230,118,0.15);border:1px solid #00e676;color:#86efac;display:block}
</style>
</head><body>
<div class="box">
<h2 style="color:#facc15;text-align:center;margin-bottom:12px">Reset Password</h2>
<div id="msg" class="msg"></div>
<input id="newPass" type="password" class="input" placeholder="Enter new password">
<input id="confirmPass" type="password" class="input" placeholder="Confirm new password">
<button class="btn" id="resetBtn">UPDATE PASSWORD</button>
<p style="text-align:center;margin-top:14px;font-size:11px"><a href="login.html" style="color:#facc15;text-decoration:none">Back to Login</a></p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyB6QxzDFhIIHwt6TTZla6g4m-FaJdMol6M",
  authDomain: "diamines-agencies.firebaseapp.com",
  projectId: "diamines-agencies"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
function show(t,ok){let m=document.getElementById('msg'); m.innerText=t; m.className=ok?'msg ok':'msg err'; m.style.display='block';}
const urlParams = new URLSearchParams(window.location.search);
const oobCode = urlParams.get('oobCode');
if(!oobCode){ show('❌ Invalid or expired reset link. Request again from login.',false); document.getElementById('resetBtn').disabled=true; }

document.getElementById('resetBtn').onclick = async ()=>{
  let np = document.getElementById('newPass').value;
  let cp = document.getElementById('confirmPass').value;
  if(np.length < 6) return show('Password must be at least 6 characters',false);
  if(np !== cp) return show('Passwords do not match',false);
  document.getElementById('resetBtn').disabled=true;
  document.getElementById('resetBtn').innerText="Updating...";
  try{
    await verifyPasswordResetCode(auth, oobCode);
    await confirmPasswordReset(auth, oobCode, np);
    show('✅ Password updated! Redirecting to login...',true);
    setTimeout(()=>location.href='login.html',1500);
  }catch(e){
    show('❌ Link expired or already used. Request new link from login.',false);
    document.getElementById('resetBtn').disabled=false;
    document.getElementById('resetBtn').innerText="UPDATE PASSWORD";
  }
};
</script>
</body></html>
