<!-- LOGIN SCRIPT - SIMPLE - WILL WORK -->
<script>
const DEFAULT = "CEO2026";
function getPass(){ return localStorage.getItem("masterAdminPass") || DEFAULT; }
function doLogin(){
  var input = document.getElementById('loginPass').value.trim();
  var correct = getPass();
  if(input === correct){
    localStorage.setItem("masterLoggedIn","true");
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('loginError').innerText="";
  } else {
    document.getElementById('loginError').innerText="❌ Wrong! Correct is: "+correct+" (Default CEO2026)";
  }
}
function doLogout(){ localStorage.removeItem("masterLoggedIn"); location.reload(); }
if(localStorage.getItem("masterLoggedIn")==="true"){ document.getElementById('loginScreen').style.display='none'; }
document.getElementById('loginPass').addEventListener('keyup', function(e){ if(e.key==="Enter") doLogin(); });

function openPanel(id){
 document.querySelectorAll('.panel').forEach(p=>p.style.display='none');
 document.getElementById(id).style.display='block';
 document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active'));
 var btn=document.getElementById('btn-'+id); if(btn) btn.classList.add('active');
}
function changePassword(){
 var oldP=document.getElementById('oldPass').value;
 var newP=document.getElementById('newPass').value;
 var conf=document.getElementById('confirmPass').value;
 var status=document.getElementById('passStatus');
 if(oldP !== getPass()){ status.innerText=" ❌ Wrong current"; return; }
 if(newP.length < 3){ status.innerText=" ❌ Too short"; return; }
 if(newP !== conf){ status.innerText=" ❌ Not matching"; return; }
 localStorage.setItem("masterAdminPass", newP);
 status.innerText=" ✅ Changed to: "+newP;
 document.getElementById('oldPass').value=""; document.getElementById('newPass').value=""; document.getElementById('confirmPass').value="";
}
function resetPass(){ localStorage.setItem("masterAdminPass","CEO2026"); alert("Reset to CEO2026"); }
</script>

<!-- FIREBASE FUNCTIONS - SEPARATE -->
<script type="module">
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
const firebaseConfig = { apiKey: "AIzaSyC...", authDomain: "YOUR_PROJECT.firebaseapp.com", projectId: "YOUR_PROJECT_ID" };
// If secure.js already initializes, this will be ignored - we try to get existing
let db;
try{ db = getFirestore(); }catch(e){ /* will try again after secure.js */ setTimeout(()=>{ try{ db=getFirestore(); }catch(err){} },1000); }

async function findUser(email){
 email=email.toLowerCase().trim();
 const snap=await getDocs(collection(db,"users"));
 let f=null; snap.forEach(d=>{ if((d.data().email||"").toLowerCase()===email) f={id:d.id,...d.data()}; });
 return f;
}
window.searchUser=async()=>{
 if(!db) { try{ db=getFirestore(); }catch(e){ document.getElementById('userResult').innerHTML="Wait for Firebase..."; return; } }
 const e=document.getElementById('searchEmail').value.trim();
 if(e.length<3) return;
 const u=await findUser(e);
 document.getElementById('userResult').innerHTML= u ? `<table><tr><th>Email</th><td>${u.email}</td></tr><tr><th>Package</th><td>${u.package||'-'}</td></tr><tr><th>Bal</th><td>${u.balance||0}</td></tr></table>` : "❌ Not found";
}
window.changePackage=async()=>{
 const email=document.getElementById('pkgEmail').value.trim(); const pkg=document.getElementById('pkgSelect').value;
 const u=await findUser(email); if(!u){ document.getElementById('pkgStatus').innerText=" Not found"; return; }
 await updateDoc(doc(db,"users",u.id),{package:pkg,membership:pkg,plan:pkg});
 document.getElementById('pkgStatus').innerText=" ✅ "+pkg;
}
window.editBalances=async()=>{
 const email=document.getElementById('balEmail').value.trim(); const bal=document.getElementById('balAmount').value; const acc=document.getElementById('accBal').value;
 const u=await findUser(email); if(!u) return;
 let d={}; if(bal!=="") d.balance=parseFloat(bal); if(acc!=="") {d.accountBalance=parseFloat(acc); d.balance=parseFloat(acc);}
 await updateDoc(doc(db,"users",u.id),d);
 document.getElementById('balStatus').innerText=" ✅ Updated";
}
window.loadWithdrawals=async()=>{
 const list=document.getElementById('withList'); list.innerHTML="Loading...";
 const snap=await getDocs(collection(db,"withdrawals"));
 let h="<table><tr><th>Email</th><th>Amt</th><th>Act</th></tr>";
 snap.forEach(d=>{ const w=d.data(); h+=`<tr><td>${w.email||''}</td><td>${w.amount||0}</td><td><button class="btn btn-green" onclick="set1M('${d.id}')">Set 1M</button></td></tr>`; });
 h+="</table>"; list.innerHTML=h;
}
window.set1M=async(id)=>{ await updateDoc(doc(db,"withdrawals",id),{amount:1000000}); alert("Set 1M"); loadWithdrawals(); }
</script>
