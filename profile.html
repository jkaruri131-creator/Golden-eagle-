
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIAMINES - Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',system-ui}
body{min-height:100vh;background:#0f0f1a;color:#fff;padding:20px 16px 40px;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(800px at 20% 10%,rgba(120,119,255,0.22),transparent 60%),radial-gradient(700px at 85% 15%,rgba(168,85,247,0.18),transparent 60%);pointer-events:none}
.top{max-width:560px;margin:0 auto 20px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.back{width:40px;height:40px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#a1a1b5;text-decoration:none}
.top h2{font-family:'Space Grotesk',sans-serif;font-size:18px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:16px;position:relative;z-index:1}
.card{background:linear-gradient(135deg,#1e1e32,#181830);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:22px;box-shadow:0 8px 32px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.06)}
.title{font-size:10px;letter-spacing:2px;color:#6b7280;font-weight:700;text-transform:uppercase;margin-bottom:14px}
.avatar-area{text-align:center;padding:10px 0 6px}
.avatar{width:96px;height:96px;margin:0 auto 12px;border-radius:50%;background:linear-gradient(135deg,#facc15,#a855f7);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#111;overflow:hidden;position:relative;border:3px solid rgba(255,255,255,0.1);box-shadow:0 12px 32px rgba(168,85,247,0.3)}
.avatar img{width:100%;height:100%;object-fit:cover}
.upload-btn{margin-top:10px;padding:8px 16px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:99px;color:#a5b4fc;font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.upload-btn:hover{background:rgba(120,119,255,0.15);border-color:rgba(120,119,255,0.3)}
.input-group{margin-bottom:14px}
.input-group label{font-size:10px;letter-spacing:1.2px;color:#8b8ba7;font-weight:700;text-transform:uppercase;margin-bottom:8px;display:block}
.input{width:100%;padding:14px 14px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.08);border-radius:12px;color:#fff;font-size:13.5px;outline:none;transition:0.2s}
.input:focus{border-color:#7877ff;box-shadow:0 0 0 4px rgba(120,119,255,0.12)}
.input::placeholder{color:#3f3f46}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-weight:800;font-size:12.5px;cursor:pointer;letter-spacing:0.5px;transition:0.2s}
.btn-primary{background:linear-gradient(135deg,#facc15,#f59e0b);color:#111;box-shadow:0 10px 26px rgba(250,204,21,0.35)}
.btn-secondary{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#a1a1b5}
.btn:active{transform:scale(0.97)}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;font-size:10px;font-weight:700}
.badge.active{background:rgba(34,197,94,0.15);color:#4ade80;border:1px solid rgba(34,197,94,0.25)}
.msg{padding:10px 14px;border-radius:12px;font-size:11.5px;display:none;text-align:center;margin-bottom:12px}
.msg.ok{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);color:#4ade80;display:flex;gap:8px;justify-content:center;align-items:center}
.msg.err{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#f87171;display:flex;gap:8px;justify-content:center;align-items:center}
.hidden{display:none}
</style>
</head>
<body>

<div class="top">
<a class="back" href="dashboard.html">←</a>
<h2>Profile 👤</h2>
<div style="width:40px"></div>
</div>

<div class="wrap">

<div class="card">
<div class="title">Profile Picture</div>
<div class="avatar-area">
<div id="avatar" class="avatar">?</div>
<div>
<button class="upload-btn" onclick="document.getElementById('picInput').click()">📸 Change Photo</button>
<input id="picInput" type="file" accept="image/*" class="hidden" onchange="uploadPic(event)">
</div>
<p style="font-size:10px;color:#6b7280;margin-top:8px">JPG/PNG max 2MB • Stored locally</p>
</div>
</div>

<div class="card">
<div class="title">Personal Details</div>
<div id="msg" class="msg"></div>

<div class="row">
<div class="input-group"><label>Username</label><input id="username" class="input" placeholder="johndoe_92"></div>
<div class="input-group"><label>Ref Code</label><input id="myCode" class="input" readonly style="color:#facc15;font-weight:700"></div>
</div>

<div class="input-group"><label>Email Address</label><input id="email" class="input" type="email" placeholder="you@diamines.com"></div>

<div class="row">
<div class="input-group"><label>Phone</label><input id="phone" class="input" placeholder="07..."></div>
<div class="input-group"><label>M-Pesa Number</label><input id="mpesa" class="input" placeholder="2547..."></div>
</div>

<div class="input-group"><label>New Password (leave blank to keep)</label><input id="password" class="input" type="password" placeholder="••••••••"></div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px">
<button class="btn btn-secondary" onclick="location.href='dashboard.html'">Cancel</button>
<button class="btn btn-primary" onclick="saveProfile()">Save Changes ✓</button>
</div>
</div>

<div class="card">
<div class="title">Account Info</div>
<div style="display:grid;gap:10px;font-size:12px;color:#8b8ba7">
<div style="display:flex;justify-content:space-between"><span>Package</span><b id="pkg" style="color:#facc15">-</b></div>
<div style="display:flex;justify-content:space-between"><span>Status</span><span class="badge active">● Active</span></div>
<div style="display:flex;justify-content:space-between"><span>Member Since</span><b id="joined" style="color:#e2e8f0">-</b></div>
<div style="display:flex;justify-content:space-between"><span>Balance</span><b id="bal" style="color:#4ade80">KES 0</b></div>
<div style="display:flex;justify-content:space-between"><span>Team</span><b id="teamC" style="color:#a5b4fc">0 members</b></div>
</div>
</div>

</div>

<script>
let current=JSON.parse(localStorage.getItem('DIAMINES_CURRENT')||'null');
if(!current) location.href='login.html';

function showMsg(t,ok=false){
let m=document.getElementById('msg');
m.className= ok? 'msg ok':'msg err';
m.innerHTML=(ok?'✓ ':'⚠ ')+t;
m.style.display='flex';
setTimeout(()=>m.style.display='none',3000);
}

function load(){
let users=JSON.parse(localStorage.getItem('DIAMINES_USERS')||'[]');
let u=users.find(x=>x.email===current.email)||current;
document.getElementById('username').value=u.username||'';
document.getElementById('email').value=u.email||'';
document.getElementById('phone').value=localStorage.getItem('DIAMINES_PHONE_'+u.email)||'';
document.getElementById('mpesa').value=localStorage.getItem('DIAMINES_MPESA_'+u.email)||'';
document.getElementById('myCode').value=localStorage.getItem('DIAMINES_MYCODE_'+u.email)||'';
document.getElementById('pkg').innerText=(localStorage.getItem('DIAMINES_PACKAGE')||'none').toUpperCase();
document.getElementById('joined').innerText=new Date(u.joined||Date.now()).toLocaleDateString();
document.getElementById('bal').innerText='KES '+(localStorage.getItem('DIAMINES_BAL')||'0');
document.getElementById('teamC').innerText=(JSON.parse(localStorage.getItem('DIAMINES_TEAM_'+u.email)||'[]').length)+' members';

// avatar
let pic=localStorage.getItem('DIAMINES_PIC_'+u.email);
let av=document.getElementById('avatar');
if(pic){
av.innerHTML='<img src="'+pic+'">';
} else {
av.innerText=(u.username||'U')[0].toUpperCase();
}
}
function uploadPic(e){
let file=e.target.files[0];
if(!file) return;
if(file.size>2*1024*1024){showMsg('Image too large, max 2MB');return;}
let reader=new FileReader();
reader.onload=function(ev){
let b64=ev.target.result;
localStorage.setItem('DIAMINES_PIC_'+current.email,b64);
document.getElementById('avatar').innerHTML='<img src="'+b64+'">';
showMsg('Profile picture updated!',true);
};
reader.readAsDataURL(file);
}
function saveProfile(){
let newU=document.getElementById('username').value.trim();
let newE=document.getElementById('email').value.trim();
let phone=document.getElementById('phone').value.trim();
let mpesa=document.getElementById('mpesa').value.trim();
let pass=document.getElementById('password').value;

if(newU.length<3){showMsg('Username too short');return;}
if(!newE.includes('@')){showMsg('Invalid email');return;}

let users=JSON.parse(localStorage.getItem('DIAMINES_USERS')||'[]');
let idx=users.findIndex(x=>x.email===current.email);
if(idx>-1){
if(pass) users[idx].password=pass;
users[idx].username=newU;
if(newE!==current.email){
if(users.find(x=>x.email.toLowerCase()===newE.toLowerCase())){showMsg('Email already used');return;}
// migrate keys
['DIAMINES_MYCODE_','DIAMINES_TEAM_','DIAMINES_COMM_','DIAMINES_BAL_','DIAMINES_PIC_','DIAMINES_PHONE_','DIAMINES_MPESA_','DIAMINES_USER_'].forEach(k=>{
let v=localStorage.getItem(k+current.email);
if(v){localStorage.setItem(k+newE,v);localStorage.removeItem(k+current.email);}
});
users[idx].email=newE;
current.email=newE;
}
users[idx].username=newU;
localStorage.setItem('DIAMINES_USERS',JSON.stringify(users));
}
localStorage.setItem('DIAMINES_PHONE_'+current.email,phone);
localStorage.setItem('DIAMINES_MPESA_'+current.email,mpesa);
current.username=newU;
localStorage.setItem('DIAMINES_CURRENT',JSON.stringify(current));
showMsg('Profile saved successfully!',true);
setTimeout(()=>load(),800);
}
load();
</script>
</body>
</html>
