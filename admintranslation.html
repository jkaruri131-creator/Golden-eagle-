<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Translation Review - EXACT PAY FIXED</title>
<style>
*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0}
body{background:#07070a;color:#fff;padding:12px;min-height:100vh}
.header{background:#0f172a;border:2px solid #22d3ee;padding:12px;border-radius:16px;position:sticky;top:6px;z-index:10;overflow:hidden}
.badge{background:rgba(34,211,238,0.15);color:#22d3ee;border:1px solid rgba(34,211,238,0.3);padding:4px 8px;border-radius:99px;font-size:9px;font-weight:900}
.job{background:linear-gradient(135deg,#1a1a2e,#151528);border-left:5px solid #22d3ee;border-radius:14px;padding:12px;margin-bottom:12px;position:relative;overflow:hidden}
.job::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#22d3ee,#0ea5e9,#22c55e,#22d3ee);background-size:200% 100%;animation:line 3s linear infinite}
@keyframes line{0%{background-position:0%}100%{background-position:200%}}
.btn{width:100%;padding:12px;border:none;border-radius:12px;font-weight:900;font-size:11px;margin-top:8px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px;transition:0.15s}
.btn:active{transform:scale(0.97)}
.btn-g{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 6px 18px rgba(34,197,94,0.3)}
.btn-g2{background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid #22c55e}
.btn-r{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn-r2{background:rgba(239,68,68,0.12);color:#f87171;border:1px solid #ef4444}
.btn-y{background:linear-gradient(135deg,#22d3ee,#0ea5e9);color:#000;box-shadow:0 6px 18px rgba(34,211,238,0.3)}
.btn-b{background:#222;color:#fff;border:1px solid #444}
.box{background:#000;padding:10px;border-radius:10px;margin-top:8px;font-size:11px;white-space:pre-wrap;display:none;max-height:260px;overflow:auto;border:1px solid #333}
.box.show{display:block}
textarea{width:100%;background:#0a0a14;color:#fff;border:2px solid #22d3ee;border-radius:12px;padding:10px;min-height:90px;outline:none}
.page{display:none}.page.active{display:block}
.confetti{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#22d3ee,#22c55e,#60a5fa,#a855f7,#22d3ee);background-size:300% 100%;animation:move 2s linear infinite}
@keyframes move{0%{background-position:0%}100%{background-position:300%}}
.top-btn{padding:8px 14px;border-radius:99px;font-weight:900;font-size:10px;text-decoration:none;border:none;cursor:pointer}
</style>
</head>
<body>
<div id="pageList" class="page active">
<div class="header">
<div style="display:flex;justify-content:space-between;align-items:center"><b style="color:#22d3ee">🌐 PENDING TRANSLATIONS - EXACT PAY FIXED</b><span style="background:#000;border:1px solid #22d3ee;color:#22d3ee;padding:5px 12px;border-radius:99px">⏳ <b id="cnt">0</b></span></div>
<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
<button onclick="loadList()" class="top-btn" style="background:#22c55e;color:#fff">🔄 SYNC</button>
<a href="translation-jobs.html" class="top-btn" style="background:#22d3ee;color:#000">📋 JOBS MANAGER</a>
<a href="dashboard.html" class="top-btn" style="background:#222;color:#fff;border:1px solid #444">🏠 DASHBOARD</a>
<a href="translation.html" class="top-btn" style="background:rgba(255,255,255,0.08);color:#fff;border:1px solid #333">👁️ USER VIEW</a>
</div>
<div class="confetti"></div>
</div>
<div id="list" style="margin-top:14px"></div>
</div>

<div id="pageReview" class="page">
<div class="header">
<div style="display:flex;align-items:center;gap:8px">
<button onclick="showPage('pageList')" style="padding:6px 12px;background:#222;color:#fff;border-radius:99px;border:1px solid #444;cursor:pointer">⬅️ Back</button>
<b style="color:#22d3ee">REVIEW & PAY EXACT AMOUNT</b>
</div>
<div class="confetti"></div>
</div>
<div id="reviewDetails" style="margin-top:12px"></div>
<div style="background:#1e1e32;padding:14px;border-radius:16px;border:2px solid #22d3ee;margin-top:12px;position:relative;overflow:hidden">
<div class="confetti"></div>
<label style="color:#22d3ee;font-size:11px;font-weight:800;letter-spacing:0.5px">💬 FEEDBACK (Optional - Leave empty for WITHOUT feedback)</label>
<textarea id="fbBox" placeholder="Type feedback or leave empty to approve without feedback..."></textarea>
<button class="btn btn-g" onclick="approve(true)">✅ APPROVE + FEEDBACK - PAY EXACT KES TO DASHBOARD</button>
<button class="btn btn-g2" onclick="approve(false)">✅ APPROVE WITHOUT FEEDBACK - PAY EXACT KES</button>
<button class="btn btn-r" onclick="reject(true)">❌ REJECT + FEEDBACK</button>
<button class="btn btn-r2" onclick="reject(false)">❌ REJECT WITHOUT FEEDBACK</button>
<button class="btn btn-y" onclick="feedbackOnly()">💬 FEEDBACK ONLY (Keep Pending)</button>
<button class="btn btn-b" onclick="showPage('pageList')">CANCEL</button>
</div>
</div>

<script>
let pending=[],cur=null;
const KEY_GLOBAL='DIAMINES_TRANSLATION_PENDING_GLOBAL';

function getPending(){try{return JSON.parse(localStorage.getItem(KEY_GLOBAL)||'[]')}catch{return []}}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='pageList')loadList()}
function toggleBox(id){document.getElementById(id).classList.toggle('show')}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function loadList(){
 pending=getPending();
 document.getElementById('cnt').innerText=pending.length;
 let html='';
 pending.forEach((j,i)=>{
  html+=`<div class="job">
  <div style="display:flex;justify-content:space-between;align-items:start;gap:8px"><b style="font-size:13px">🌐 ${j.title}</b><b style="color:#4ade80;background:rgba(34,197,94,0.15);border:1px solid #22c55e;padding:4px 10px;border-radius:99px;font-size:11px">KES ${j.earn||j.price}</b></div>
  <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><span class="badge">👤 ${j.userEmail}</span><span class="badge" style="background:rgba(34,211,238,0.08)">ID:${j.submittedAt}</span><span class="badge" style="background:rgba(255,255,255,0.06)">${j.fromLang||'EN'}→${j.toLang||'SW'}</span></div>
  <small style="color:#666;font-size:9px">${new Date(j.submittedAt).toLocaleString()}</small>
  <div style="margin-top:8px;display:flex;gap:6px">
  <button class="btn" style="width:48%;background:#001a2a;color:#7dd3fc;border:1px solid #22d3ee;padding:9px" onclick="toggleBox('o_${i}')">📄 SOURCE</button>
  <button class="btn" style="width:48%;background:#001a0a;color:#7bffa3;border:1px solid #22c55e;padding:9px" onclick="toggleBox('e_${i}')">🌐 TRANSLATED</button>
  </div>
  <div id="o_${i}" class="box">${esc(j.original||j.sourceText||'')}</div>
  <div id="e_${i}" class="box">${esc(j.proof||j.translated||j.content||'')}</div>
  <button class="btn btn-y" onclick="openReview(${i})">✍️ REVIEW → PAY EXACT KES ${j.earn||j.price} TO DASHBOARD</button>
  </div>`;
 });
 if(!html) html=`<div style="text-align:center;padding:60px 20px;color:#4b5563"><div style="font-size:50px">🎉</div><b>No pending translation jobs</b><br><small style="margin-top:6px;display:block">All translations reviewed!</small></div>`;
 document.getElementById('list').innerHTML=html;
}

function openReview(i){
 cur=pending[i];
 document.getElementById('reviewDetails').innerHTML=`<div class="job">
 <div style="display:flex;justify-content:space-between"><b>🌐 ${cur.title}</b><b style="color:#4ade80">EXACT KES ${cur.earn||cur.price}</b></div>
 <div style="margin-top:6px"><span class="badge">👤 ${cur.userEmail}</span> <small style="color:#666">ID:${cur.submittedAt}</small></div>
 <div style="margin-top:4px"><span class="badge" style="background:rgba(34,211,238,0.1)">${cur.fromLang}→${cur.toLang} • ${cur.words||''}</span></div>
 <div style="margin-top:8px;display:flex;gap:6px">
 <button class="btn" style="width:48%;background:#001a2a;color:#7dd3fc;border:1px solid #22d3ee;padding:9px" onclick="toggleBox('ro')">📄 SOURCE</button>
 <button class="btn" style="width:48%;background:#001a0a;color:#7bffa3;border:1px solid #22c55e;padding:9px" onclick="toggleBox('re')">🌐 TRANSLATED</button>
 </div>
 <div id="ro" class="box">${esc(cur.original||cur.sourceText||'')}</div>
 <div id="re" class="box show" style="border-color:#22c55e">${esc(cur.proof||cur.translated||cur.content||'')}</div>
 <div style="background:rgba(34,211,238,0.08);border:1px dashed rgba(34,211,238,0.3);border-radius:12px;padding:10px;margin-top:10px;text-align:center">
 <small style="color:#22d3ee;font-weight:800;letter-spacing:1px">💰 EXACT PAYMENT FOR THIS JOB</small><br><b style="font-size:22px;color:#4ade80">KES ${cur.earn||cur.price}</b><br><small style="color:#9ca3af">Will add EXACTLY this amount to dashboard - no more, no less</small>
 </div>
 </div>`;
 document.getElementById('fbBox').value=cur.adminFeedback||'';
 showPage('pageReview');
}

function removeCur(){
 let all=getPending().filter(x=>String(x.submittedAt)!==String(cur.submittedAt));
 localStorage.setItem(KEY_GLOBAL, JSON.stringify(all));
 let userKey='DIAMINES_TRANSLATION_PD_'+cur.userEmail;
 try{let arr=JSON.parse(localStorage.getItem(userKey)||'[]');localStorage.setItem(userKey, JSON.stringify(arr.filter(x=>String(x.submittedAt)!==String(cur.submittedAt))));}catch{}
}

// ===== EXACT PAY FIX - SAME AS TRANSCRIPTION - NO DEDUCT =====
function payExact(email, earn, submittedAt){
 email=email.toLowerCase().trim();
 earn=parseFloat(earn)||0;
 submittedAt=String(submittedAt);

 const BAL_KEY='DIAMINES_BAL_'+email;
 const PAID_KEY='DIAMINES_PAID_TRANSLATION_'+email;

 let paidList=JSON.parse(localStorage.getItem(PAID_KEY)||'[]');
 if(paidList.includes(submittedAt)){
  alert('⚠️ This translation job ID '+submittedAt+' was ALREADY PAID!\nBlocked to prevent double add or deduct.');
  return null;
 }

 let currentBal=parseFloat(localStorage.getItem(BAL_KEY)||'0');
 if(isNaN(currentBal)) currentBal=0;

 let newBal=currentBal+earn; // EXACT: old + this job ONLY

 // Update ALL dashboard keys with SAME newBal
 localStorage.setItem(BAL_KEY, newBal.toString());
 localStorage.setItem('BAL_'+email, newBal.toString());
 localStorage.setItem('DIAMINES_BAL', newBal.toString());
 localStorage.setItem('BAL', newBal.toString());
 localStorage.setItem('DIAMINES_WALLET_'+email, newBal.toString());
 localStorage.setItem('TOTAL_EARNED_'+email, newBal.toString());

 try{
  let sess=JSON.parse(localStorage.getItem('DIAMINES_CURRENT')||'null');
  if(sess && sess.email && sess.email.toLowerCase()===email){
   sess.balance=newBal;
   sess.wallet=newBal;
   localStorage.setItem('DIAMINES_CURRENT', JSON.stringify(sess));
  }
 }catch(e){}

 paidList.push(submittedAt);
 localStorage.setItem(PAID_KEY, JSON.stringify(paidList));
 localStorage.setItem('DIAMINES_LAST_PAYMENT', JSON.stringify({email, earn, newBal, type:'translation', time:Date.now()}));

 return newBal;
}

function approve(withFb){
 let fb=document.getElementById('fbBox').value.trim();
 if(withFb &&!fb) fb='Excellent translation! Approved KES '+(cur.earn||cur.price)+' - Paid exact to dashboard 🎉';
 if(!withFb) fb='Approved by admin. Great work! 🌐 Payment added exact.';

 let email=cur.userEmail.toLowerCase();
 let earn=parseFloat(cur.earn||cur.price||0);
 let submittedAt=cur.submittedAt;

 let newBal=payExact(email, earn, submittedAt);
 if(newBal===null){showPage('pageList');return;}

 let histKey='DIAMINES_TRANSLATION_HISTORY_'+email;
 let hist=JSON.parse(localStorage.getItem(histKey)||'[]');
 hist.unshift({...cur, status:'approved', feedback:fb, reviewedAt:new Date().toISOString(), price:earn, earn:earn});
 localStorage.setItem(histKey, JSON.stringify(hist));

 removeCur();
 alert('✅ TRANSLATION APPROVED - EXACT PAY\n\n💰 Paid: KES '+earn+' (exact amount of this job - no deduct)\n👤 User: '+email+'\n💳 Old Balance + '+earn+' = New: KES '+newBal+'\n\n✅ Dashboard updated INSTANTLY! Check dashboard.html');
 showPage('pageList');
}

function reject(withFb){
 let fb=document.getElementById('fbBox').value.trim();
 if(withFb &&!fb){alert('Please type feedback for REJECT + FEEDBACK');return;}
 if(!withFb) fb='Rejected by admin. Please improve translation.';
 let email=cur.userEmail.toLowerCase();
 let histKey='DIAMINES_TRANSLATION_HISTORY_'+email;
 let hist=JSON.parse(localStorage.getItem(histKey)||'[]');
 hist.unshift({...cur, status:'rejected', feedback:fb, reviewedAt:new Date().toISOString()});
 localStorage.setItem(histKey, JSON.stringify(hist));
 removeCur();
 alert('❌ REJECTED - No payment added');
 showPage('pageList');
}

function feedbackOnly(){
 let fb=document.getElementById('fbBox').value.trim();
 if(!fb){alert('Type feedback first');return;}
 let all=getPending();
 let idx=all.findIndex(x=>String(x.submittedAt)===String(cur.submittedAt));
 if(idx>-1){all[idx].adminFeedback=fb;localStorage.setItem(KEY_GLOBAL, JSON.stringify(all));}
 alert('💬 Feedback saved - job still PENDING');
 showPage('pageList');
}

loadList();
</script>
</body>
</html>
