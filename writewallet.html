<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Write Wallet - Admin FIXED</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0}
body{background:#07070a;color:#e5e7eb;min-height:100vh;padding:20px}
.top{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.back{padding:10px 18px;border-radius:99px;font-size:11px;font-weight:800;text-decoration:none;border:1px solid rgba(168,85,247,0.3);background:#1a102a;color:#c084fc}
.header{max-width:900px;margin:16px auto;background:linear-gradient(135deg,#1a102a,#151528);border:1px solid rgba(168,85,247,0.3);border-radius:20px;padding:20px;text-align:center}
.header h1{font-size:22px;font-weight:900;color:#fff}
.header span{display:block;font-size:10px;color:#a855f7;letter-spacing:2px;margin-top:4px}
.search-box{max-width:900px;margin:14px auto;background:#12122a;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px;display:flex;gap:10px;flex-wrap:wrap}
.input{flex:1;min-width:200px;background:#0a0a14;border:1px solid rgba(168,85,247,0.3);border-radius:12px;padding:12px;color:#fff;outline:none}
.btn{padding:12px 18px;border-radius:12px;border:none;font-weight:900;font-size:11px;cursor:pointer}
.btn-purple{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff}
.btn-green{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
.btn-dark{background:rgba(255,255,255,0.06);color:#9ca3af;border:1px solid rgba(255,255,255,0.1)}
.grid{max-width:900px;margin:16px auto;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:14px}
.card.full{grid-column:span 2}
.card label{font-size:9px;color:#9ca3af;font-weight:900;letter-spacing:1px;display:block;margin-bottom:6px}
.card input{width:100%;background:#0a0a14;border:1px solid rgba(168,85,247,0.25);border-radius:10px;padding:12px;color:#fff;font-size:14px;font-weight:800;outline:none}
.users-list{max-width:900px;margin:14px auto;background:#12122a;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px;max-height:400px;overflow:auto}
.user-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid rgba(255,255,255,0.06);cursor:pointer}
.user-item:hover{background:rgba(168,85,247,0.08)}
.status{padding:14px;text-align:center;font-size:12px;border-radius:12px;margin:12px auto;max-width:900px;display:none}
.status.show{display:block}
.status.ok{background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3);color:#4ade80}
.status.err{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);color:#f87171}
</style>
</head>
<body>
<div class="top"><a class="back" href="dashboard.html">← Dashboard</a><a class="back" href="writing.html">✍️ Writing Studio</a></div>
<div class="header"><h1>💎 WRITE WALLET - ADMIN</h1><span>EDIT ANY USER WALLET • REAL-TIME SYNC • FIXED</span></div>

<div class="search-box">
<input id="emailInput" class="input" type="email" placeholder="Enter user email e.g jkaruri131@gmail.com" value="jkaruri131@gmail.com">
<button class="btn btn-purple" onclick="loadWallet()">🔍 LOAD WALLET</button>
<button class="btn btn-dark" onclick="loadUsers()">👥 LIST USERS</button>
</div>

<div id="status" class="status"></div>

<div id="editArea" style="display:none">
<div class="grid">
<div class="card"><label>💎 AVAILABLE BALANCE (KES)</label><input id="f_balance" type="number"></div>
<div class="card"><label>📈 TOTAL EARNED (KES)</label><input id="f_earned" type="number"></div>
<div class="card"><label>💳 TOTAL WITHDRAWN (KES)</label><input id="f_withdrawn" type="number"></div>
<div class="card"><label>📚 TOTAL TASKS DONE</label><input id="f_done" type="number"></div>
<div class="card"><label>⚡ AWAITING / IN PROGRESS</label><input id="f_progress" type="number"></div>
<div class="card"><label>✅ APPROVED COUNT</label><input id="f_approved" type="number"></div>
<div class="card full"><label>📝 ADMIN NOTE</label><input id="f_note" type="text" placeholder="e.g Bonus added"></div>
</div>
<div style="max-width:900px;margin:14px auto;display:flex;gap:10px">
<button class="btn btn-green" style="flex:1;padding:16px;font-size:13px" onclick="saveWallet()">💾 SAVE & SYNC →</button>
<button class="btn btn-dark" style="flex:1" onclick="clearOverride()">🗑️ RESET TO AUTO</button>
</div>
</div>

<div id="usersList" class="users-list" style="display:none"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, deleteDoc, addDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB6QxzDFhIIHwt6TTZla6g4m-FaJdMol6M",authDomain:"diamines-agencies.firebaseapp.com",projectId:"diamines-agencies",storageBucket:"diamines-agencies.firebasestorage.app",messagingSenderId:"438413306857",appId:"1:438413306857:web:3c7f736794be6a49b0f978"};
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
let currentEmail='';
function showStatus(msg, ok=true){let s=document.getElementById('status');s.innerText=msg;s.className='status show '+(ok?'ok':'err');setTimeout(()=>s.className='status',5000);}

window.loadUsers=async()=>{
  let box=document.getElementById('usersList');box.style.display='block';box.innerHTML='⏳ Loading...';
  try{let snap=await getDocs(collection(db,'userBids'));let html='';snap.forEach(d=>{let em=d.id;html+=`<div class="user-item" onclick="document.getElementById('emailInput').value='${em}';loadWallet()"><b>${em}</b><span style="color:#a855f7">→</span></div>`;});box.innerHTML=html||'No users';}catch(e){box.innerHTML='Error: '+e.message}
}

window.loadWallet=async()=>{
  let email=document.getElementById('emailInput').value.trim().toLowerCase();if(!email){showStatus('Enter email',false);return;}
  currentEmail=email;showStatus('Loading '+email+'... fetching accurate Firebase data',true);
  try{
    let overSnap=await getDoc(doc(db,'walletOverrides',email));
    let over=overSnap.exists()?overSnap.data():{};

    // ✅ ACCURATE FETCH FROM FIREBASE - ALL COLLECTIONS
    let approvedSnap=await getDocs(query(collection(db,'writingApproved'),where('userEmail','==',email)));
    let pendingSnap=await getDocs(query(collection(db,'writingPending'),where('userEmail','==',email)));
    let rejectedSnap=await getDocs(query(collection(db,'writingRejected'),where('userEmail','==',email)));
    
    // writingTaken uses takenBy OR userEmail - fetch both
    let takenBySnap=await getDocs(query(collection(db,'writingTaken'),where('takenBy','==',email)));
    let takenEmailSnap=await getDocs(query(collection(db,'writingTaken'),where('userEmail','==',email)));
    
    // Merge taken docs to avoid duplicates
    let takenMap=new Map();
    takenBySnap.forEach(d=>{ takenMap.set(d.id, d.data()); });
    takenEmailSnap.forEach(d=>{ takenMap.set(d.id, d.data()); });
    
    let autoApproved=approvedSnap.size;
    let autoPending=pendingSnap.size;
    let autoRejected=rejectedSnap.size;
    let autoInProgress=0;
    takenMap.forEach(v=>{
      let s=(v.status||'').toLowerCase();
      if(s==='in_progress' || s==='in progress') autoInProgress++;
    });

    // Total Done = rejected + approved + pending + my tasks (in_progress)
    let autoDone=autoApproved + autoPending + autoRejected + autoInProgress;
    if(autoDone===0 && takenMap.size>0) autoDone=takenMap.size; // fallback

    let autoEarned=0;
    approvedSnap.forEach(d=>{autoEarned+=parseInt(d.data().price||0);});
    
    let withdrawSnap=await getDocs(query(collection(db,'withdrawals'),where('email','==',email)));
    let autoWithdrawn=0;withdrawSnap.forEach(d=>{if(d.data().status==='approved')autoWithdrawn+=parseInt(d.data().amount||0);});
    let autoBalance=autoEarned-autoWithdrawn;

    document.getElementById('f_balance').value=over.balance??autoBalance;
    document.getElementById('f_earned').value=over.earned??autoEarned;
    document.getElementById('f_withdrawn').value=over.withdrawn??autoWithdrawn;
    document.getElementById('f_done').value=over.done??autoDone;
    document.getElementById('f_progress').value=over.progress??autoInProgress;
    document.getElementById('f_approved').value=over.approved??autoApproved;
    document.getElementById('f_note').value=over.note??'';
    document.getElementById('editArea').style.display='block';
    showStatus(`✅ ACCURATE: Done=${autoDone} (Appr ${autoApproved}+Pend ${autoPending}+Rej ${autoRejected}+Prog ${autoInProgress}) | Balance KES ${autoBalance} | Override: ${overSnap.exists()?'YES':'NO'}`,true);
  }catch(e){showStatus('Error: '+e.message,false)}
}

window.saveWallet=async()=>{
  if(!currentEmail){showStatus('Load user first',false);return;}
  let payload={
    email:currentEmail,
    balance:parseInt(document.getElementById('f_balance').value)||0,
    earned:parseInt(document.getElementById('f_earned').value)||0,
    withdrawn:parseInt(document.getElementById('f_withdrawn').value)||0,
    done:parseInt(document.getElementById('f_done').value)||0,
    progress:parseInt(document.getElementById('f_progress').value)||0,
    approved:parseInt(document.getElementById('f_approved').value)||0,
    note:document.getElementById('f_note').value.trim(),
    updatedAt:new Date().toISOString(),
    timestamp:serverTimestamp(),
    isOverride:true
  };
  try{
    await setDoc(doc(db,'walletOverrides',currentEmail),payload,{merge:true});
    await addDoc(collection(db,'adminWalletLogs'),payload);
    showStatus('✅ SAVED! User '+currentEmail+' will see KES '+payload.balance+' instantly | Done='+payload.done+' Progress='+payload.progress+' Approved='+payload.approved,true);
  }catch(e){showStatus('Error: '+e.message,false)}
}

window.clearOverride=async()=>{
  if(!currentEmail)return;if(!confirm('Reset to AUTO for '+currentEmail+'?'))return;
  try{await deleteDoc(doc(db,'walletOverrides',currentEmail));showStatus('🗑️ Override removed - now showing accurate Firebase auto',true);loadWallet();}catch(e){showStatus('Error: '+e.message,false)}
}
</script>
</body>
                                                    </html>
