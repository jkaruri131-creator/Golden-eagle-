<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Approve Deposits</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',system-ui}
body{background:#070711;color:#fff;min-height:100vh;padding:14px;max-width:900px;margin:0 auto}
h2{margin:14px 0;font-size:22px;font-weight:800}
.card{background:#1a1a35;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:14px;margin-bottom:12px;transition:all 0.3s}
.card.updating{border-color:#facc15;opacity:0.7}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}
.pending{background:rgba(250,204,21,0.2);color:#facc15;border:1px solid rgba(250,204,21,0.4)}
.approved{background:rgba(0,230,118,0.2);color:#00e676;border:1px solid rgba(0,230,118,0.4)}
.rejected{background:rgba(255,82,82,0.2);color:#ff5252;border:1px solid rgba(255,82,82,0.4)}
.btn{padding:10px 16px;border-radius:10px;border:none;font-weight:800;font-size:13px;cursor:pointer;margin-right:6px;margin-top:8px}
.btn-approve{background:linear-gradient(135deg,#00e676,#00c853);color:#000}
.btn-reject{background:#000;border:1px solid #ff5252;color:#ff5252}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-refresh{background:#25254a;color:#fff;border:1px solid #444;margin-bottom:14px;width:100%}
.input{padding:10px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;width:100%;margin-bottom:10px}
.stats{display:flex;gap:10px;margin:12px 0}
.stat{flex:1;background:#1a1a35;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px;text-align:center}
.stat b{font-size:20px;display:block}
</style>
</head>
<body>
<h2>🔐 Admin - 0141416120 Deposits - FAST</h2>
<p style="font-size:11px;color:#888;margin-bottom:10px">Real-time - No refresh needed - Instant approve!</p>
<div class="stats">
<div class="stat"><b id="countPending">0</b><span style="font-size:10px;color:#facc15">PENDING</span></div>
<div class="stat"><b id="countApproved">0</b><span style="font-size:10px;color:#00e676">APPROVED</span></div>
<div class="stat"><b id="countTotal">0</b><span style="font-size:10px;color:#888">TOTAL</span></div>
</div>
<input id="search" class="input" placeholder="Search code / phone / email..." oninput="renderList()">
<div id="list"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, getDoc, updateDoc, query, where, getDocs, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyB6QxzDFhIIHwt6TTZla6g4m-FaJdMol6M", authDomain: "diamines-agencies.firebaseapp.com", projectId: "diamines-agencies", storageBucket: "diamines-agencies.firebasestorage.app", messagingSenderId: "438413306857", appId: "1:438413306857:web:3c7f736794be6a49b0f978" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);

let allDeposits = [];
let isListening = false;

function getCode(d){ return String(d.code || d.mpesaCode || "").toUpperCase().trim(); }
function getPhone(d){ return String(d.phonePaid || d.payerPhone || d.phone || "").trim(); }

// FAST REAL-TIME LISTENER - No getDocs delay!
function startListener(){
  if(isListening) return;
  isListening = true;
  // Listen deposits
  onSnapshot(collection(db,"deposits"), (snap)=>{
    let firebaseList = [];
    snap.forEach(d=> firebaseList.push({firestoreId: d.id, collectionName: "deposits", ...d.data()}));
    mergeDeposits(firebaseList, "deposits");
  });
  // Listen membership_deposits
  onSnapshot(collection(db,"membership_deposits"), (snap)=>{
    let firebaseList = [];
    snap.forEach(d=> firebaseList.push({firestoreId: d.id, collectionName: "membership_deposits", ...d.data()}));
    mergeDeposits(firebaseList, "membership_deposits");
  });
}

let depositsMap = new Map();

function mergeDeposits(newList, collName){
  newList.forEach(item=>{
    let code = getCode(item);
    if(!code) return;
    // Use code as key - removes duplicates UQDGGHVVHD flicker
    if(!depositsMap.has(code)){
      depositsMap.set(code, item);
    } else {
      let existing = depositsMap.get(code);
      // Keep the one with most recent status, or approved over pending
      if(item.status==="approved" || item.status==="rejected"){
        depositsMap.set(code, {...existing, ...item, firestoreId: item.firestoreId, status: item.status});
      } else if(existing.status==="pending"){
        depositsMap.set(code, {...existing, ...item});
      }
    }
  });
  allDeposits = Array.from(depositsMap.values()).sort((a,b)=> new Date(b.date||b.createdAt||0) - new Date(a.date||a.createdAt||0));
  renderList();
}

function renderList(){
  let q = document.getElementById("search").value.trim().toUpperCase();
  let filtered = allDeposits;
  if(q) filtered = allDeposits.filter(d=> getCode(d).includes(q) || getPhone(d).includes(q) || String(d.email||"").toUpperCase().includes(q));

  document.getElementById("countPending").innerText = allDeposits.filter(d=> (d.status||"pending")==="pending").length;
  document.getElementById("countApproved").innerText = allDeposits.filter(d=> d.status==="approved").length;
  document.getElementById("countTotal").innerText = allDeposits.length;

  let listDiv = document.getElementById("list");
  if(filtered.length===0){ listDiv.innerHTML="<div class='card' style='text-align:center;color:#888'>No deposits</div>"; return; }

  listDiv.innerHTML = filtered.map(d=>{
    let status = d.status||"pending";
    let badgeClass = status==="approved"?"approved":status==="rejected"?"rejected":"pending";
    let code = getCode(d);
    return `<div class="card" id="card-${code}"><div style="display:flex;justify-content:space-between"><div><div style="font-size:11px;color:#888">${d.date||""} • ${d.email||""}</div><b>KES ${(d.amount||0).toLocaleString()}</b> Code: <b style="color:#facc15">${code}</b><div style="font-size:12px">From: <b>${getPhone(d)}</b> → 0141416120</div></div><div><span class="badge ${badgeClass}">${status.toUpperCase()}</span></div></div>${status==="pending"?`<div><button class="btn btn-approve" id="btn-approve-${code}" onclick="approve('${code}','${d.email||""}',${d.amount||0},'${d.uid||""}')">✅ APPROVE</button><button class="btn btn-reject" id="btn-reject-${code}" onclick="reject('${code}')">❌ REJECT</button></div>`:`<div style="font-size:10px;color:#00e676;margin-top:6px">✅ ${status.toUpperCase()} - Updated in membership.html instantly</div>`}</div>`;
  }).join("");
}

// OPTIMISTIC APPROVE - Instant UI, then Firebase in background
window.approve = async function(code,email,amount,uid){
  if(!confirm("Approve KES "+amount+" Code "+code+"?")) return;
  let codeU = code.toUpperCase();
  
  // 1. INSTANT UI UPDATE - No waiting!
  let existing = depositsMap.get(codeU);
  if(existing){
    existing.status = "approved";
    depositsMap.set(codeU, existing);
    renderList();
    let card = document.getElementById("card-"+codeU);
    if(card) card.classList.add("updating");
  }
  document.getElementById("btn-approve-"+codeU).disabled = true;
  document.getElementById("btn-approve-"+codeU).innerText = "⏳ APPROVING...";

  // 2. Background Firebase update - Fast
  try{
    let promises = [];
    let q1 = query(collection(db,"deposits"), where("code","==",codeU));
    let s1 = await getDocs(q1);
    s1.forEach(d=> promises.push(updateDoc(doc(db,"deposits",d.id),{status:"approved"})));
    
    let q1b = query(collection(db,"deposits"), where("mpesaCode","==",codeU));
    let s1b = await getDocs(q1b);
    s1b.forEach(d=> promises.push(updateDoc(doc(db,"deposits",d.id),{status:"approved"})));

    let q2 = query(collection(db,"membership_deposits"), where("code","==",codeU));
    let s2 = await getDocs(q2);
    s2.forEach(d=> promises.push(updateDoc(doc(db,"membership_deposits",d.id),{status:"approved"})));

    let q2b = query(collection(db,"membership_deposits"), where("mpesaCode","==",codeU));
    let s2b = await getDocs(q2b);
    s2b.forEach(d=> promises.push(updateDoc(doc(db,"membership_deposits",d.id),{status:"approved"})));

    await Promise.all(promises);

    // Balance update
    if(email){
      let qUser = query(collection(db,"users"), where("email","==",email.toLowerCase()));
      let uSnap = await getDocs(qUser);
      let balPromises = [];
      uSnap.forEach(u=> balPromises.push(updateDoc(doc(db,"users",u.id),{balance:increment(amount), totalDeposit:increment(amount)})));
      await Promise.all(balPromises);
    } else if(uid){
      try{ await updateDoc(doc(db,"users",uid),{balance:increment(amount), totalDeposit:increment(amount)}); }catch(e){}
    }

    // LocalStorage
    ["DIAMINES_DEPOSITS_ALL","DIAMINES_MEMBERSHIP_DEPOSITS_ALL"].forEach(key=>{
      try{
        let arr = JSON.parse(localStorage.getItem(key)||"[]");
        arr.forEach(d=>{ if(getCode(d)===codeU) d.status="approved"; });
        localStorage.setItem(key, JSON.stringify(arr));
      }catch(e){}
    });

    if(email){
      let eLow = email.toLowerCase();
      localStorage.setItem("DIAMINES_BAL_"+eLow, String(Number(localStorage.getItem("DIAMINES_BAL_"+eLow)||0)+amount));
      localStorage.setItem("DIAMINES_TOTAL_DEPOSIT_"+eLow, String(Number(localStorage.getItem("DIAMINES_TOTAL_DEPOSIT_"+eLow)||0)+amount));
    }

  }catch(e){ console.log(e); alert("Error: "+e.message); }
  renderList();
}

window.reject = async function(code){
  if(!confirm("Reject "+code+"?")) return;
  let codeU = code.toUpperCase();
  let existing = depositsMap.get(codeU);
  if(existing){ existing.status="rejected"; depositsMap.set(codeU, existing); renderList(); }

  try{
    let q1 = query(collection(db,"deposits"), where("code","==",codeU));
    let s1 = await getDocs(q1);
    s1.forEach(d=> updateDoc(doc(db,"deposits",d.id),{status:"rejected"}));
    let q1b = query(collection(db,"deposits"), where("mpesaCode","==",codeU));
    let s1b = await getDocs(q1b);
    s1b.forEach(d=> updateDoc(doc(db,"deposits",d.id),{status:"rejected"}));
    let q2 = query(collection(db,"membership_deposits"), where("code","==",codeU));
    let s2 = await getDocs(q2);
    s2.forEach(d=> updateDoc(doc(db,"membership_deposits",d.id),{status:"rejected"}));
    let q2b = query(collection(db,"membership_deposits"), where("mpesaCode","==",codeU));
    let s2b = await getDocs(q2b);
    s2b.forEach(d=> updateDoc(doc(db,"membership_deposits",d.id),{status:"rejected"}));
  }catch(e){}

  ["DIAMINES_DEPOSITS_ALL","DIAMINES_MEMBERSHIP_DEPOSITS_ALL"].forEach(key=>{
    try{
      let arr = JSON.parse(localStorage.getItem(key)||"[]");
      arr.forEach(d=>{ if(getCode(d)===codeU) d.status="rejected"; });
      localStorage.setItem(key, JSON.stringify(arr));
    }catch(e){}
  });
  renderList();
}

window.renderList = renderList;
startListener();
</script>
</body>
</html>
