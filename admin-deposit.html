<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Approve Deposits</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',system-ui}
body{background:#070711;color:#fff;min-height:100vh;padding:14px;max-width:900px;margin:0 auto}
h2{margin:14px 0;font-size:22px;font-weight:800}
.card{background:#1a1a35;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:14px;margin-bottom:12px}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}
.pending{background:rgba(250,204,21,0.2);color:#facc15;border:1px solid rgba(250,204,21,0.4)}
.approved{background:rgba(0,230,118,0.2);color:#00e676;border:1px solid rgba(0,230,118,0.4)}
.rejected{background:rgba(255,82,82,0.2);color:#ff5252;border:1px solid rgba(255,82,82,0.4)}
.btn{padding:10px 16px;border-radius:10px;border:none;font-weight:800;font-size:13px;cursor:pointer;margin-right:6px;margin-top:8px}
.btn-approve{background:linear-gradient(135deg,#00e676,#00c853);color:#000}
.btn-reject{background:#000;border:1px solid #ff5252;color:#ff5252}
.btn-refresh{background:#25254a;color:#fff;border:1px solid #444;margin-bottom:14px;width:100%}
.input{padding:10px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;width:100%;margin-bottom:10px}
.stats{display:flex;gap:10px;margin:12px 0}
.stat{flex:1;background:#1a1a35;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px;text-align:center}
.stat b{font-size:20px;display:block}
</style>
</head>
<body>
<h2>🔐 Admin - 0141416120 Deposits FINAL</h2>
<p style="font-size:11px;color:#888;margin-bottom:10px">Finds from deposit.html + membership.html - Real-time</p>
<div class="stats">
<div class="stat"><b id="countPending">0</b><span style="font-size:10px;color:#facc15">PENDING</span></div>
<div class="stat"><b id="countApproved">0</b><span style="font-size:10px;color:#00e676">APPROVED</span></div>
<div class="stat"><b id="countTotal">0</b><span style="font-size:10px;color:#888">TOTAL</span></div>
</div>
<button class="btn btn-refresh" onclick="location.reload()">🔄 Refresh</button>
<input id="search" class="input" placeholder="Search code / phone / email..." oninput="render()">
<div id="list">Loading pending deposits from Firebase...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, updateDoc, query, where, getDocs, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyB6QxzDFhIIHwt6TTZla6g4m-FaJdMol6M", authDomain: "diamines-agencies.firebaseapp.com", projectId: "diamines-agencies", storageBucket: "diamines-agencies.firebasestorage.app", messagingSenderId: "438413306857", appId: "1:438413306857:web:3c7f736794be6a49b0f978" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function getCode(d){
  return String(d.code || d.mpesaCode || d.Code || "").toUpperCase().trim();
}
function getPhone(d){
  return String(d.phonePaid || d.payerPhone || d.phone || d.Phone || "").trim();
}

let allMap = new Map();

function addToMap(list){
  list.forEach(item=>{
    let code = getCode(item);
    if(!code) return;
    // If same code exists, keep the pending one or merge status
    if(!allMap.has(code)){
      allMap.set(code, item);
    } else {
      let old = allMap.get(code);
      // If new is approved/rejected, overwrite
      if(item.status==="approved" || item.status==="rejected"){
        allMap.set(code, {...old, ...item, status: item.status});
      }
      // If old is pending and new has more info, merge
      if(old.status==="pending" && item.status==="pending"){
        allMap.set(code, {...old, ...item});
      }
    }
  });
  render();
}

function render(){
  let q = document.getElementById("search").value.trim().toUpperCase();
  let all = Array.from(allMap.values());
  all.sort((a,b)=> new Date(b.createdAt||b.date||0) - new Date(a.createdAt||a.date||0));
  
  let filtered = all;
  if(q) filtered = all.filter(d=> getCode(d).includes(q) || getPhone(d).includes(q) || String(d.email||"").toUpperCase().includes(q));

  document.getElementById("countPending").innerText = all.filter(d=> (d.status||"pending")==="pending").length;
  document.getElementById("countApproved").innerText = all.filter(d=> d.status==="approved").length;
  document.getElementById("countTotal").innerText = all.length;

  let listDiv = document.getElementById("list");
  if(filtered.length===0){
    listDiv.innerHTML = `<div class='card' style='text-align:center;color:#888'>No pending found<br><small>Check: deposits + membership_deposits collections</small><br><br>Local fallback: ${JSON.parse(localStorage.getItem("DIAMINES_DEPOSITS_ALL")||"[]").length + JSON.parse(localStorage.getItem("DIAMINES_MEMBERSHIP_DEPOSITS_ALL")||"[]").length} local deposits found</div>`;
    return;
  }

  listDiv.innerHTML = filtered.map(d=>{
    let status = d.status||"pending";
    let badgeClass = status==="approved"?"approved":status==="rejected"?"rejected":"pending";
    let code = getCode(d);
    let phone = getPhone(d);
    return `<div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap"><div><div style="font-size:11px;color:#888">${d.date||""} • ${d.email||""}</div><b style="font-size:16px">KES ${(d.amount||0).toLocaleString()}</b> Code: <b style="color:#facc15">${code}</b><div style="font-size:12px">From: <b style="color:#fff">${phone}</b> → 0141416120</div><div style="font-size:10px;color:#666">Source: ${d._source||d.collection||"local"} | ${d.type||d.from||""}</div></div><div><span class="badge ${badgeClass}">${status.toUpperCase()}</span></div></div>${status==="pending"?`<div><button class="btn btn-approve" onclick="approve('${code}','${d.email||""}',${d.amount||0},'${d.uid||""}')">✅ APPROVE</button><button class="btn btn-reject" onclick="reject('${code}')">❌ REJECT</button></div><div style="font-size:10px;color:#eab308;margin-top:6px">⚠️ CHECK SMS on 0141416120: KES ${d.amount} Code ${code} from ${phone}?</div>`:`<div style="font-size:10px;color:#00e676;margin-top:6px">✅ ${status.toUpperCase()} - Visible in membership.html now</div>`}</div>`;
  }).join("");
}

// LISTEN BOTH COLLECTIONS REAL-TIME
onSnapshot(collection(db,"deposits"), (snap)=>{
  let list=[]; snap.forEach(docu=>{ list.push({firestoreId: docu.id, _source:"deposits", collection:"deposits", ...docu.data()}) });
  addToMap(list);
  console.log("deposits found:", list.length);
});
onSnapshot(collection(db,"membership_deposits"), (snap)=>{
  let list=[]; snap.forEach(docu=>{ list.push({firestoreId: docu.id, _source:"membership_deposits", collection:"membership_deposits", ...docu.data()}) });
  addToMap(list);
  console.log("membership_deposits found:", list.length);
});

// FALLBACK LOCALSTORAGE - If Firebase empty, show local
setTimeout(()=>{
  if(allMap.size===0){
    try{
      let local1 = JSON.parse(localStorage.getItem("DIAMINES_DEPOSITS_ALL")||"[]");
      let local2 = JSON.parse(localStorage.getItem("DIAMINES_MEMBERSHIP_DEPOSITS_ALL")||"[]");
      let combinedLocal = [...local1, ...local2].map(d=> ({...d, _source:"localStorage"}));
      if(combinedLocal.length>0){
        addToMap(combinedLocal);
        document.getElementById("list").innerHTML += `<div style="color:#facc15;font-size:10px;text-align:center;margin-top:10px">⚠️ Showing localStorage - Firebase rules may block - Check Firestore rules!</div>`;
      }
    }catch(e){}
  }
}, 2000);

window.approve = async function(code,email,amount,uid){
  if(!confirm("Approve KES "+amount+" Code "+code+" to "+email+"?")) return;
  let codeU = String(code).toUpperCase().trim();

  // Optimistic UI
  let cur = allMap.get(codeU);
  if(cur){ cur.status="approved"; allMap.set(codeU, cur); render(); }

  try{
    // Update BOTH collections, BOTH field names
    for(let colName of ["deposits","membership_deposits"]){
      for(let fieldName of ["code","mpesaCode"]){
        try{
          let q = query(collection(db,colName), where(fieldName,"==",codeU));
          let snap = await getDocs(q);
          snap.forEach(d=> updateDoc(doc(db,colName,d.id), {status:"approved"}));
        }catch(e){}
      }
    }

    // Update user balance
    if(email){
      try{
        let q = query(collection(db,"users"), where("email","==",email.toLowerCase()));
        let snap = await getDocs(q);
        snap.forEach(d=> updateDoc(doc(db,"users",d.id), {balance: increment(amount), totalDeposit: increment(amount)}));
      }catch(e){}
    }

    // Update localStorage
    ["DIAMINES_DEPOSITS_ALL","DIAMINES_MEMBERSHIP_DEPOSITS_ALL"].forEach(key=>{
      try{
        let arr = JSON.parse(localStorage.getItem(key)||"[]");
        arr.forEach(d=>{ if(getCode(d)===codeU) d.status="approved"; });
        localStorage.setItem(key, JSON.stringify(arr));
      }catch(e){}
    });

    if(email){
      let eLow = email.toLowerCase();
      try{
        localStorage.setItem("DIAMINES_BAL_"+eLow, String(Number(localStorage.getItem("DIAMINES_BAL_"+eLow)||0)+amount));
        localStorage.setItem("DIAMINES_TOTAL_DEPOSIT_"+eLow, String(Number(localStorage.getItem("DIAMINES_TOTAL_DEPOSIT_"+eLow)||0)+amount));
      }catch(e){}
    }

    alert("✅ APPROVED "+codeU+" KES "+amount);
  }catch(e){ alert("Error: "+e.message); }
};

window.reject = async function(code){
  if(!confirm("Reject "+code+" as fake?")) return;
  let codeU = String(code).toUpperCase().trim();
  let cur = allMap.get(codeU);
  if(cur){ cur.status="rejected"; allMap.set(codeU, cur); render(); }

  for(let colName of ["deposits","membership_deposits"]){
    for(let fieldName of ["code","mpesaCode"]){
      try{
        let q = query(collection(db,colName), where(fieldName,"==",codeU));
        let snap = await getDocs(q);
        snap.forEach(d=> updateDoc(doc(db,colName,d.id), {status:"rejected"}));
      }catch(e){}
    }
  }

  ["DIAMINES_DEPOSITS_ALL","DIAMINES_MEMBERSHIP_DEPOSITS_ALL"].forEach(key=>{
    try{
      let arr = JSON.parse(localStorage.getItem(key)||"[]");
      arr.forEach(d=>{ if(getCode(d)===codeU) d.status="rejected"; });
      localStorage.setItem(key, JSON.stringify(arr));
    }catch(e){}
  });
  alert("❌ Rejected "+codeU);
};

window.render = render;
</script>
</body>
</html>
