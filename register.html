<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIAMINES - Register</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#070711;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.box{width:100%;max-width:380px;background:#111126;border:1px solid #222;border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.logo{text-align:center;margin-bottom:16px}
.logo h1{font-size:28px;font-weight:900;letter-spacing:2px;color:#facc15;text-shadow:0 0 20px rgba(250,204,21,0.4)}
.logo p{font-size:10px;color:#8b8ba7;letter-spacing:3px;margin-top:2px}
.input{width:100%;background:#1a1a35;border:1px solid #333;border-radius:10px;padding:13px 12px;color:#fff;margin-bottom:12px;outline:none;font-size:14px}
.input:focus{border-color:#facc15;box-shadow:0 0 0 3px rgba(250,204,21,0.1)}
.btn{width:100%;padding:14px;border-radius:10px;border:none;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#facc15,#ffb700);color:#000;font-size:15px;box-shadow:0 6px 20px rgba(250,204,21,0.3);margin-top:6px}
.btn:active{transform:scale(0.98)}
.msg{display:none;padding:10px;border-radius:8px;font-size:11px;margin-bottom:12px;text-align:center}
.msg.err{background:rgba(255,23,68,0.15);border:1px solid #ff1744;color:#ff8da1;display:block}
.msg.ok{background:rgba(0,230,118,0.15);border:1px solid #00e676;color:#86efac;display:block}
.ref-tag{display:none;background:rgba(250,204,21,0.1);border:1px dashed #facc15;border-radius:8px;padding:8px 10px;font-size:10px;color:#facc15;margin-bottom:12px;text-align:center}
</style>
</head><body>
<div class="box">
<div class="logo"><h1>DIAMINES</h1><p>CREATE ACCOUNT</p></div>
<div id="refTag" class="ref-tag"></div>
<div id="msg" class="msg" style="display:none"></div>

<input id="username" class="input" placeholder="Username">
<input id="email" class="input" placeholder="Email" type="email">
<input id="password" class="input" placeholder="Password" type="password">
<input id="cpassword" class="input" placeholder="Confirm Password" type="password">

<button class="btn" id="regBtn">REGISTER</button>
<p style="text-align:center;margin-top:14px;font-size:11px;color:#8b8ba7">Already have account? <a href="login.html" style="color:#facc15;text-decoration:none;font-weight:700">Login</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6QxzDFhIIHwt6TTZla6g4m-FaJdMol6M",
  authDomain: "diamines-agencies.firebaseapp.com",
  projectId: "diamines-agencies",
  storageBucket: "diamines-agencies.firebasestorage.app",
  messagingSenderId: "438413306857",
  appId: "1:438413306857:web:3c7f736794be6a49b0f978",
  measurementId: "G-4PBTTCZ1YK"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let urlRef = new URLSearchParams(window.location.search).get("ref");
if(urlRef){
  let raw = urlRef.trim();
  localStorage.setItem("DIAMINES_PENDING_REF", raw);
  localStorage.setItem("DIAMINES_PENDING_REF_LOWER", raw.toLowerCase());
  document.getElementById("refTag").style.display="block";
  document.getElementById("refTag").innerText="🔗 Referred by: "+raw+" - You will appear in Level 1";
}
function showMsg(t,ok){
  let m=document.getElementById('msg');
  m.innerText=t;
  m.className= ok? 'msg ok' : 'msg err';
  m.style.display='block';
}

document.getElementById('regBtn').onclick = async ()=>{
  let u=document.getElementById('username').value.trim();
  let e=document.getElementById('email').value.trim().toLowerCase();
  let p=document.getElementById('password').value;
  let cp=document.getElementById('cpassword').value;
  let pendingRefRaw = localStorage.getItem("DIAMINES_PENDING_REF") || "";
  let pendingRef = pendingRefRaw.toLowerCase().trim();

  if(!u||!e||!p||!cp){ showMsg("Fill all fields"); return; }
  if(p!==cp){ showMsg("Passwords do not match"); return; }
  if(p.length<6){ showMsg("Password min 6 chars for Firebase"); return; }
  if(u.length<3){ showMsg("Username min 3 chars"); return; }

  document.getElementById('regBtn').disabled = true;
  document.getElementById('regBtn').innerText = "CHECKING...";
  showMsg("Checking username & email...", true);

  try{
    const usersRef = collection(db, "users");

    const emailQuery = query(usersRef, where("email", "==", e));
    const emailSnap = await getDocs(emailQuery);
    if(!emailSnap.empty){
      showMsg("❌ Email already exists! Please login.");
      document.getElementById('regBtn').disabled = false;
      document.getElementById('regBtn').innerText = "REGISTER";
      return;
    }

    const usernameQuery = query(usersRef, where("username", "==", u));
    const usernameSnap = await getDocs(usernameQuery);
    if(!usernameSnap.empty){
      showMsg("❌ Username '"+u+"' already taken! Choose another.");
      document.getElementById('regBtn').disabled = false;
      document.getElementById('regBtn').innerText = "REGISTER";
      return;
    }
    // Also check lowercase username to avoid john and John duplicate
    const usernameLowerQuery = query(usersRef, where("username", "==", u.toLowerCase()));
    const usernameLowerSnap = await getDocs(usernameLowerQuery);
    if(!usernameLowerSnap.empty){
      showMsg("❌ Username '"+u+"' already taken! Choose another.");
      document.getElementById('regBtn').disabled = false;
      document.getElementById('regBtn').innerText = "REGISTER";
      return;
    }

    let allUsersOld=JSON.parse(localStorage.getItem('DIAMINES_ALL_USERS')||'[]');
    if(allUsersOld.some(x => x.email.toLowerCase() === e)){
      showMsg("❌ Email already exists in local! Please login.");
      document.getElementById('regBtn').disabled = false;
      document.getElementById('regBtn').innerText = "REGISTER";
      return;
    }
    if(allUsersOld.some(x => x.username.toLowerCase() === u.toLowerCase())){
      showMsg("❌ Username already exists in local! Choose another.");
      document.getElementById('regBtn').disabled = false;
      document.getElementById('regBtn').innerText = "REGISTER";
      return;
    }

    showMsg("Creating account... please wait", true);
    document.getElementById('regBtn').innerText = "CREATING...";

    const cred = await createUserWithEmailAndPassword(auth, e, p);
    const uid = cred.user.uid;

    let myCode = (u.toUpperCase().replace(/[^A-Z0-9]/g,'').substring(0,5) || 'DIAM') + Math.floor(1000+Math.random()*9000);

    // ===== FIXED: RESOLVE PARENT BY USERNAME FIRST! =====
    let parentEmail = null;
    let parentUsername = null;
    if(pendingRef){
      // 1. Check localStorage map
      parentEmail = localStorage.getItem('DIAMINES_REF_MAP_'+pendingRef.toUpperCase());
      if(!parentEmail) parentEmail = localStorage.getItem('DIAMINES_REF_MAP_'+pendingRef);
      if(!parentEmail) parentEmail = localStorage.getItem('DIAMINES_REF_MAP_'+pendingRef.toLowerCase());

      // 2. If ref itself is email
      if(!parentEmail && pendingRef.includes('@')){
        parentEmail = pendingRef;
        parentUsername = pendingRef.split('@')[0];
      }

      // 3. Firebase: Search by username (MOST IMPORTANT FOR YOUR NEW LINK)
      if(!parentEmail){
        try{
          // Try exact username
          let q1 = query(usersRef, where("username", "==", pendingRefRaw));
          let s1 = await getDocs(q1);
          if(!s1.empty){
            parentEmail = s1.docs[0].data().email;
            parentUsername = s1.docs[0].data().username;
          } else {
            // Try lowercased username
            let q2 = query(usersRef, where("username", "==", pendingRef));
            let s2 = await getDocs(q2);
            if(!s2.empty){
              parentEmail = s2.docs[0].data().email;
              parentUsername = s2.docs[0].data().username;
            } else {
              // Try refCode
              let q3 = query(usersRef, where("refCode", "==", pendingRef.toUpperCase()));
              let s3 = await getDocs(q3);
              if(!s3.empty){
                parentEmail = s3.docs[0].data().email;
                parentUsername = s3.docs[0].data().username;
              } else {
                // Try email
                let q4 = query(usersRef, where("email", "==", pendingRef));
                let s4 = await getDocs(q4);
                if(!s4.empty){
                  parentEmail = s4.docs[0].data().email;
                  parentUsername = s4.docs[0].data().username;
                }
              }
            }
          }
        }catch(e){ console.log("parent lookup error", e); }
      }
    }

    const userData = {
      uid: uid,
      username: u,
      usernameLower: u.toLowerCase(), // For easy search
      email: e,
      refCode: myCode,
      myCode: myCode,
      parent: parentEmail? parentEmail.toLowerCase() : null,
      parentUsername: parentUsername? parentUsername : (pendingRefRaw||null),
      upline: parentEmail? parentEmail.toLowerCase() : 'Official',
      referrer: parentEmail? parentEmail.toLowerCase() : null,
      referrerUsername: parentUsername? parentUsername : null,
      activated: false,
      commissionPaid: false,
      joined: new Date().toISOString(),
      balance: 0,
      totalDeposit: 0,
      refCommission: 0,
      totalRefEarnings: 0,
      package: 'none'
    };

    await setDoc(doc(db, "users", uid), userData);

    // === SAVE TO REFERRALS COLLECTION (My Team uses this) ===
    if(parentEmail && parentEmail.toLowerCase()!== e){
      try{
        await setDoc(doc(db, "referrals", uid), {
          parent: parentEmail.toLowerCase(),
          parentUsername: parentUsername || pendingRefRaw,
          child: e.toLowerCase(),
          childUsername: u,
          childUid: uid,
          parentCode: pendingRefRaw,
          date: new Date(),
          createdAt: new Date().toISOString(),
          package: "none"
        });
        let rels = JSON.parse(localStorage.getItem("DIAMINES_REF_RELATIONS")||"[]");
        rels.push({parent: parentEmail.toLowerCase(), parentUsername: parentUsername||pendingRefRaw, child: e.toLowerCase(), childUsername: u, date: new Date().toISOString()});
        localStorage.setItem("DIAMINES_REF_RELATIONS", JSON.stringify(rels));
      }catch(eRef){ console.log("referral save error", eRef); }
    }

    localStorage.removeItem('DIAMINES_CURRENT_USER');
    localStorage.removeItem('username');
    localStorage.removeItem('DIAMINES_USER');

    localStorage.setItem('DIAMINES_CURRENT', JSON.stringify(userData));
    localStorage.setItem('DIAMINES_CURRENT_USER', JSON.stringify(userData));
    localStorage.setItem('DIAMINES_USER', JSON.stringify(userData));
    localStorage.setItem('username', u);
    localStorage.setItem('email', e);
    localStorage.setItem('DIAMINES_USERNAME_'+e, u.toLowerCase());
    localStorage.setItem('DIAMINES_REF_MAP_'+myCode, e);
    localStorage.setItem('DIAMINES_REF_MAP_'+myCode.toLowerCase(), e);
    localStorage.setItem('DIAMINES_REF_MAP_'+u.toLowerCase(), e);

    let allUsers=JSON.parse(localStorage.getItem('DIAMINES_ALL_USERS')||'[]');
    allUsers.push({...userData, id: Date.now()});
    localStorage.setItem('DIAMINES_ALL_USERS',JSON.stringify(allUsers));

    localStorage.removeItem("DIAMINES_PENDING_REF");
    localStorage.removeItem("DIAMINES_PENDING_REF_LOWER");

    showMsg("✅ Account created! Referred by "+(parentUsername||parentEmail||"Official")+" - Redirecting...", true);
    setTimeout(()=>{ location.href='login.html'; },1200);

  }catch(err){
    console.error(err);
    if(err.code === 'auth/email-already-in-use'){
      showMsg("❌ Email already registered in Firebase! Please login.");
    } else {
      showMsg("❌ "+err.message);
    }
    document.getElementById('regBtn').disabled = false;
    document.getElementById('regBtn').innerText = "REGISTER";
  }
};
</script>
</body></html>
