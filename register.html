<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIAMINES - Register</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#070711;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.box{width:100%;max-width:380px;background:#111126;border:1px solid #222;border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.logo{text-align:center;margin-bottom:16px}
.logo h1{font-size:28px;font-weight:900;letter-spacing:2px;color:#facc15;text-shadow:0 0 20px rgba(250,204,21,0.4)}
.logo p{font-size:10px;color:#8b8ba7;letter-spacing:3px;margin-top:2px}
.input{width:100%;background:#1a1a35;border:1px solid #333;border-radius:10px;padding:13px 12px;color:#fff;margin-bottom:12px;outline:none;font-size:14px}
.input:focus{border-color:#facc15;box-shadow:0 0 0 3px rgba(250,204,21,0.1)}
.btn{width:100%;padding:14px;border-radius:10px;border:none;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#facc15,#ffb700);color:#000;font-size:15px;box-shadow:0 6px 20px rgba(250,204,21,0.3);margin-top:6px}
.btn:active{transform:scale(0.98)}
.msg{display:none;padding:10px;border-radius:8px;font-size:11px;margin-bottom:12px;text-align:center}
.msg.err{background:rgba(255,23,68,0.15);border:1px solid #ff1744;color:#ff8da1;display:block}
.msg.ok{background:rgba(0,230,118,0.15);border:1px solid #00e676;color:#86efac;display:block}
.ref-tag{display:none;background:rgba(250,204,21,0.1);border:1px dashed #facc15;border-radius:8px;padding:8px 10px;font-size:10px;color:#facc15;margin-bottom:12px;text-align:center}
</style>
</head><body>
<div class="box">
<div class="logo"><h1>DIAMINES</h1><p>CREATE ACCOUNT</p></div>
<div id="refTag" class="ref-tag"></div>
<div id="msg" class="msg" style="display:none"></div>

<input id="username" class="input" placeholder="Username">
<input id="email" class="input" placeholder="Email" type="email">
<input id="password" class="input" placeholder="Password" type="password">
<input id="cpassword" class="input" placeholder="Confirm Password" type="password">

<button class="btn" onclick="doRegister()">REGISTER</button>
<p style="text-align:center;margin-top:14px;font-size:11px;color:#8b8ba7">Already have account? <a href="login.html" style="color:#facc15;text-decoration:none;font-weight:700">Login</a></p>
</div>

<script>
// ===== CAPTURE REF FROM LINK - NO INPUT BOX NEEDED =====
let urlRef = new URLSearchParams(window.location.search).get("ref");
if(urlRef){
  urlRef = urlRef.toUpperCase().trim();
  localStorage.setItem("DIAMINES_PENDING_REF", urlRef);
  document.getElementById("refTag").style.display="block";
  document.getElementById("refTag").innerText="🔗 Referred by: "+urlRef+" - You will appear in Level 1";
}

function showMsg(t,ok){
  let m=document.getElementById('msg');
  m.innerText=t;
  m.className= ok? 'msg ok' : 'msg err';
  m.style.display='block';
}

function doRegister(){
  let u=document.getElementById('username').value.trim();
  let e=document.getElementById('email').value.trim().toLowerCase();
  let p=document.getElementById('password').value;
  let cp=document.getElementById('cpassword').value;
  let pendingRef = localStorage.getItem("DIAMINES_PENDING_REF") || "";

  if(!u||!e||!p||!cp){ showMsg("Fill all fields - Username, Email, Password, Confirm Password"); return; }
  if(!e.includes('@') || !e.includes('.')){ showMsg("Enter valid email"); return; }
  if(p.length<4){ showMsg("Password too short (min 4)"); return; }
  if(p!==cp){ showMsg("Passwords do not match"); return; }

  // Check banned/deleted
  let deleted=(JSON.parse(localStorage.getItem('DIAMINES_DELETED_BLACKLIST')||'[]')).map(x=>String(x).toLowerCase());
  let banned=(JSON.parse(localStorage.getItem('DIAMINES_BANNED')||'[]')).map(x=>String(x).toLowerCase());
  if(deleted.includes(e)){ showMsg("⛔ This email was deleted by admin - cannot register"); return; }
  if(banned.includes(e)){ showMsg("⚠️ Account on hold - contact admin"); return; }

  let allUsers=JSON.parse(localStorage.getItem('DIAMINES_ALL_USERS')||'[]');
  let users=JSON.parse(localStorage.getItem('DIAMINES_USERS')||'[]');
  if(allUsers.find(x=>String(x.email).toLowerCase()===e) || users.find(x=>String(x.email).toLowerCase()===e)){ showMsg("Email already exists - Login"); return; }

  // ===== FIND PARENT FROM REF LINK =====
  let parentEmail=null;
  if(pendingRef){
    parentEmail = localStorage.getItem('DIAMINES_REF_MAP_'+pendingRef);
    if(!parentEmail){
      // Try find via MYCODE
      let keys=Object.keys(localStorage);
      for(let k of keys){
        if(k.startsWith('DIAMINES_MYCODE_') && localStorage.getItem(k)===pendingRef){
          parentEmail = k.replace('DIAMINES_MYCODE_','').toLowerCase();
          break;
        }
        if(k.startsWith('DIAMINES_REF_CODE_') && localStorage.getItem(k)===pendingRef){
          parentEmail = k.replace('DIAMINES_REF_CODE_','').toLowerCase();
          break;
        }
      }
    }
  }

  // My ref code
  let myCode = (u.toUpperCase().replace(/[^A-Z0-9]/g,'').substring(0,5) || 'DIAM') + Math.floor(1000+Math.random()*9000);

  let newUser={
    id:Date.now(),
    username:u,
    email:e,
    password:p,
    refCode:myCode,
    myCode:myCode,
    parent: parentEmail? String(parentEmail).toLowerCase() : null,
    upline: parentEmail? String(parentEmail).toLowerCase() : 'Official',
    activated:false,
    commissionPaid:false,
    joined:new Date().toISOString(),
    joinDate:new Date().toLocaleDateString(),
    banned:false,
    package:'none',
    balance:'0'
  };

  allUsers.push(newUser);
  users.push(newUser);
  localStorage.setItem('DIAMINES_ALL_USERS',JSON.stringify(allUsers));
  localStorage.setItem('DIAMINES_USERS',JSON.stringify(users));
  localStorage.setItem('users',JSON.stringify(allUsers));

  // REF MAPS - THIS MAKES TEAM SHOW LEVEL 1
  localStorage.setItem('DIAMINES_REF_CODE_'+e, myCode);
  localStorage.setItem('DIAMINES_MYCODE_'+e, myCode);
  localStorage.setItem('DIAMINES_REF_MAP_'+myCode, e.toLowerCase());

  if(parentEmail){
    let rel=JSON.parse(localStorage.getItem('DIAMINES_REF_RELATIONS')||'[]');
    rel.push({child:e.toLowerCase(), parent:String(parentEmail).toLowerCase(), date:new Date().toLocaleString()});
    localStorage.setItem('DIAMINES_REF_RELATIONS', JSON.stringify(rel));
    localStorage.setItem('DIAMINES_UPLINE_'+e, String(parentEmail).toLowerCase());
  }

  // BALANCES
  localStorage.setItem('DIAMINES_BAL_'+e,'0');
  localStorage.setItem('DIAMINES_TOTAL_DEPOSIT_'+e,'0');
  localStorage.setItem('DIAMINES_PACKAGE_'+e,'none');
  localStorage.setItem('DIAMINES_REF_BAL_'+e,'0');

  // LOGIN
  localStorage.setItem('DIAMINES_CURRENT',JSON.stringify({email:e, username:u, upline: parentEmail||'Official'}));
  localStorage.setItem('DIAMINES_CURRENT_EMAIL',e.toLowerCase());

  showMsg("✅ Account created! Redirecting to login... You will appear in Level 1 of "+(parentEmail||"Official"), true);
  
  setTimeout(()=>{ 
    localStorage.removeItem('DIAMINES_PENDING_REF');
    location.href='login.html'; 
  },1000);
}
</script>
</body></html>
