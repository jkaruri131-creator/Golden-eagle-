<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publish Transcription Jobs - Admin</title>
<style>*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0}body{background:#07070a;color:#e5e7eb;padding:16px}.header{max-width:800px;margin:0 auto;background:linear-gradient(135deg,#1a1a2e,#151528);border:2px solid #22c55e;border-radius:18px;padding:18px}.card{max-width:800px;margin:14px auto;background:#1a1a2e;border:1px solid rgba(34,197,94,0.2);border-radius:16px;padding:18px}input,textarea,select{width:100%;background:#0a0a14;border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:11px;color:#fff;margin-top:6px}label{font-size:10px;color:#9ca3af;font-weight:800;margin-top:10px;display:block}.btn{padding:12px 16px;border:none;border-radius:12px;font-weight:900;cursor:pointer}.btn-green{background:#22c55e;color:#fff;width:100%}.btn-dark{background:rgba(255,255,255,0.08);color:#9ca3af}.job{border:1px solid #333;border-radius:14px;padding:12px;margin-bottom:10px;background:#111}</style>
</head><body>
<div class="header"><b style="color:#4ade80">🎙️ PUBLISH TRANSCRIPTION JOBS - Firebase Live</b><br><small style="color:#9ca3af">Jobs published here appear instantly in transcription.html on all phones - Firebase</small><br><small id="syncNote" style="color:#4ade80">Loading...</small></div>
<div class="card">
<h3 style="color:#4ade80">➕ Create New Transcription Job</h3>
<label>JOB TITLE</label><input id="title" placeholder="e.g. Medical Interview Transcription - Doctor Patient">
<label>DESCRIPTION</label><textarea id="desc" placeholder="Describe task... e.g. Transcribe 10 min medical interview, speaker labels required" style="min-height:80px"></textarea>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
<div><label>PRICE KES</label><input id="price" type="number" placeholder="e.g. 350"></div>
<div><label>DURATION e.g. 10 min</label><input id="duration" placeholder="e.g. 10 min"></div>
<div><label>DEADLINE HOURS</label><input id="hours" type="number" placeholder="e.g. 24"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div><label>LEVEL</label><select id="level"><option>Easy</option><option>Medium</option><option>Hard</option></select></div>
<div><label>MINUTES NEEDED TO BID</label><input id="minutesNeed" type="number" placeholder="e.g. 10"></div>
</div>
<label>AUDIO URL (or upload below) - User can PLAY & DOWNLOAD this</label><input id="audioUrl" placeholder="https://...mp3 or leave empty and upload">
<label>UPLOAD AUDIO FILE (MP3, WAV, M4A) - Will upload to Firebase Storage</label><input id="audioFile" type="file" accept="audio/*">
<div style="margin-top:12px"><button class="btn btn-green" onclick="publishJob()">🚀 PUBLISH JOB - Shows instantly in transcription.html on all phones</button></div>
<div id="uploadStatus" style="margin-top:10px;font-size:11px;color:#4ade80"></div>
</div>
<div class="card"><h3 style="color:#facc15">📋 Published Jobs (<span id="cJobs">0</span>) - Live from Firebase</h3><div id="jobsList"></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
const firebaseConfig={apiKey:"AIzaSyB6QxzDFhIIHwt6TTZla6g4m-FaJdMol6M",authDomain:"diamines-agencies.firebaseapp.com",projectId:"diamines-agencies",storageBucket:"diamines-agencies.firebasestorage.app",messagingSenderId:"438413306857",appId:"1:438413306857:web:3c7f736794be6a49b0f978"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app); const storage=getStorage(app);
let jobs=[];
onSnapshot(collection(db,'transcriptionJobs'),snap=>{jobs=[];snap.forEach(s=>{jobs.push({id:s.id,...s.data()});});jobs.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));document.getElementById('cJobs').innerText=jobs.length;document.getElementById('syncNote').innerText=`🟢 Firebase LIVE - ${jobs.length} jobs - All phones see instantly`;document.getElementById('jobsList').innerHTML=jobs.map(j=>`<div class="job"><div style="display:flex;justify-content:space-between"><b>🎙️ ${j.title}</b><span style="color:#facc15;font-weight:800">KES ${j.price}</span></div><div style="font-size:11px;color:#9ca3af;margin-top:4px">${j.desc||''}</div><div style="display:flex;gap:6px;margin-top:6px"><span style="font-size:9px;background:rgba(250,204,21,0.12);padding:4px 8px;border-radius:99px">🎧 ${j.duration}</span><span style="font-size:9px;background:rgba(255,255,255,0.06);padding:4px 8px;border-radius:99px">⏰ ${j.h}h</span><span style="font-size:9px;background:rgba(168,85,247,0.12);padding:4px 8px;border-radius:99px">⏱️ ${j.minutesNeed||10} MIN</span></div>${j.audioUrl?`<audio controls src="${j.audioUrl}" style="width:100%;margin-top:8px"></audio><div style="font-size:9px;color:#4ade80;margin-top:4px">🔊 Audio URL: ${j.audioUrl.substring(0,60)}...</div>`:''}<div style="margin-top:8px;display:flex;gap:8px"><button class="btn btn-dark" style="padding:6px 10px;font-size:10px" onclick="deleteJob('${j.id}')">🗑️ Delete</button></div></div>`).join('')||'<div style="text-align:center;color:#6b7280">No jobs yet - Publish first job</div>';});
window.deleteJob=async(id)=>{if(confirm('Delete this job? It will disappear from transcription.html on all phones')){await deleteDoc(doc(db,'transcriptionJobs',id));}};
window.publishJob=async()=>{
 let title=document.getElementById('title').value.trim(); let desc=document.getElementById('desc').value.trim(); let price=parseInt(document.getElementById('price').value)||350; let duration=document.getElementById('duration').value.trim()||'10 min'; let h=parseInt(document.getElementById('hours').value)||24; let level=document.getElementById('level').value; let minutesNeed=parseInt(document.getElementById('minutesNeed').value)||10; let audioUrl=document.getElementById('audioUrl').value.trim();
 if(!title){alert('Enter title');return;}
 document.getElementById('uploadStatus').innerText='⏳ Publishing...';
 let file=document.getElementById('audioFile').files[0];
 if(file){
  document.getElementById('uploadStatus').innerText='⏳ Uploading audio to Firebase Storage...';
  try{
   let storageRef=ref(storage,'transcription_audios/'+Date.now()+'_'+file.name);
   await uploadBytes(storageRef,file);
   audioUrl=await getDownloadURL(storageRef);
   document.getElementById('uploadStatus').innerText='✅ Audio uploaded: '+audioUrl;
  }catch(e){document.getElementById('uploadStatus').innerText='❌ Upload failed: '+e.message+' - Using URL if provided';}
 }
 await addDoc(collection(db,'transcriptionJobs'),{title:title,desc:desc,description:desc,price:price,duration:duration,h:h,deadline:h,level:level,minutesNeed:minutesNeed,audioUrl:audioUrl,createdAt:Date.now()});
 document.getElementById('uploadStatus').innerText='✅ Published! Job shows instantly in transcription.html on all phones - Firebase LIVE';
 document.getElementById('title').value='';document.getElementById('desc').value='';document.getElementById('price').value='';document.getElementById('duration').value='';document.getElementById('audioUrl').value='';document.getElementById('audioFile').value='';
 alert('✅ Published!\n\n'+title+'\nKES '+price+' | '+duration+' | '+h+'h | '+minutesNeed+' min to bid\n\nJob appears instantly in transcription.html on all phones - Firebase live - User can PLAY & DOWNLOAD audio');
};
</script>
</body></html>
