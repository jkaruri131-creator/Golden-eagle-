<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Audio - Minutes Only</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#050510;color:#fff;padding:14px 12px 100px}
.top{max-width:900px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center}
.card{max-width:900px;margin:0 auto 14px;background:linear-gradient(135deg,#121225,#0e0e1e);border:1px solid rgba(255,215,0,.15);border-radius:20px;padding:16px}
.badge{font-size:8px;padding:4px 9px;border-radius:99px;font-weight:900;border:1px solid;display:inline-block}
.b-yellow{background:rgba(250,204,21,.12);color:#facc15;border-color:rgba(250,204,21,.25)}
.b-green{background:rgba(34,197,94,.12);color:#4ade80;border-color:rgba(34,197,94,.25)}
.b-red{background:rgba(239,68,68,.12);color:#f87171;border-color:rgba(239,68,68,.25)}
.b-purple{background:rgba(168,85,247,.12);color:#a78bfa;border-color:rgba(168,85,247,.25)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:10px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#9ca3af;font-weight:800;font-size:11px;cursor:pointer}
.tab.active{background:linear-gradient(135deg,#facc15,#f59e0b);color:#000;border-color:#facc15}
input{width:100%;background:#000;border:1.5px solid #222;border-radius:12px;padding:11px;color:#fff;font-size:12px;outline:none;margin-top:6px}
input:focus{border-color:#facc15}
.btn{padding:11px 16px;border:none;border-radius:12px;font-weight:800;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-gold{background:linear-gradient(135deg,#facc15,#f59e0b);color:#000}
.btn-green{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
.btn-red{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn-purple{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff}
.btn-gray{background:rgba(255,255,255,.08);color:#d1d5db;border:1px solid rgba(255,255,255,.1)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.item{background:#0a0a14;border:1px solid #222;border-radius:14px;padding:12px;margin-top:10px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.stat{background:rgba(0,0,0,0.3);border:1px solid #222;border-radius:10px;padding:8px;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#1a1a2e;border:1px solid #facc15;padding:12px 18px;border-radius:99px;transition:.4s;z-index:99}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="top">
<h1 style="font-family:'Space Grotesk';font-size:20px">🎧 <span style="color:#facc15">ADMIN MINUTES</span></h1>
<a href="dashboard.html" style="color:#9ca3af;text-decoration:none;font-size:12px">← Dashboard</a>
</div>

<div class="card">
<div class="tabs">
<button class="tab active" id="tab1" onclick="setTab('minutes')">⏱️ MINUTES REQUESTS <b id="cMin">0</b></button>
<button class="tab" id="tab2" onclick="setTab('users')">👤 EDIT USER MINUTES</button>
</div>

<div id="view-minutes">
<h3 style="font-size:13px;color:#a78bfa">⏱️ Minutes Purchase Requests</h3>
<p style="font-size:9px;color:#6b7280;margin-top:4px" id="syncStatus">Local Mode - Add Supabase to sync all gadgets</p>
<div id="minutesList"></div>
</div>

<div id="view-users" style="display:none">
<h3 style="font-size:13px;color:#facc15">👤 Edit User Minutes Distribution</h3>
<p style="font-size:9px;color:#6b7280;margin-top:4px">Edit TOTAL / AVAILABLE / USED - All auto-calculate</p>

<div style="margin-top:12px">
<label style="font-size:9px;color:#888">USER EMAIL</label>
<input id="editEmail" placeholder="user@gmail.com">
</div>

<div class="row" style="margin-top:8px">
<div>
<label style="font-size:9px;color:#facc15">TOTAL MINUTES</label>
<input id="editTotal" type="number" placeholder="60" oninput="onTotalChange()">
</div>
<div>
<label style="font-size:9px;color:#4ade80">AVAILABLE MINUTES</label>
<input id="editAvailable" type="number" placeholder="50" oninput="onAvailableChange()">
</div>
<div>
<label style="font-size:9px;color:#f87171">USED MINUTES</label>
<input id="editUsed" type="number" placeholder="10" oninput="onUsedChange()">
</div>
</div>

<div id="userBalanceInfo" style="margin-top:12px;background:#000;border:1px solid #222;border-radius:12px;padding:12px;font-size:11px;color:#9ca3af">
Enter email to see distribution
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<button class="btn btn-gold" onclick="setUserMinutes()">💾 SAVE TO ALL GADGETS</button>
<button class="btn btn-gray" onclick="loadUserMinutes()">🔍 VIEW DISTRIBUTION</button>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px">
<button class="btn btn-purple" onclick="addMinutesToUser(16)">+16 min</button>
<button class="btn btn-purple" onclick="addMinutesToUser(60)">+60 min</button>
<button class="btn btn-purple" onclick="addMinutesToUser(120)">+120 min</button>
</div>

<hr style="margin:14px 0;border:none;border-top:1px solid #222">
<h4 style="font-size:11px;color:#888">ALL USERS MINUTES DISTRIBUTION</h4>
<div id="allUsersList"></div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==== CONFIGURE SUPABASE HERE FOR ALL-GADGET SYNC ====
const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
const SUPABASE_KEY = "YOUR_ANON_KEY";
let supabaseClient = null;
try{
 if(SUPABASE_URL.includes("supabase.co") &&!SUPABASE_URL.includes("YOUR_PROJECT")){
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  document.getElementById('syncStatus').innerHTML = "🟢 Cloud Sync ON - All gadgets synced";
  document.getElementById('syncStatus').style.color = "#4ade80";
 }
}catch(e){ console.log("Supabase not configured, using local"); }

const KEY_MINUTES_PENDING_GLOBAL='DIAMINES_MINUTES_PENDING_GLOBAL';
const KEY_TOTAL_PREFIX='DIAMINES_TRANS_TOTAL_MINUTES_';
const KEY_USED_PREFIX='DIAMINES_TRANS_USED_MINUTES_';
const KEY_LEGACY_PREFIX='DIAMINES_TRANS_MINUTES_';

function getMinPending(){ try{return JSON.parse(localStorage.getItem(KEY_MINUTES_PENDING_GLOBAL)||'[]')}catch{return []} }
function setMinPending(v){ localStorage.setItem(KEY_MINUTES_PENDING_GLOBAL, JSON.stringify(v)); }

function getUserTotal(email){
 let v=parseInt(localStorage.getItem(KEY_TOTAL_PREFIX+email)||'0');
 if(v===0){ let leg=parseInt(localStorage.getItem(KEY_LEGACY_PREFIX+email)||'0'); if(leg>0) v=leg; }
 return isNaN(v)?0:v;
}
function getUserUsed(email){ let v=parseInt(localStorage.getItem(KEY_USED_PREFIX+email)||'0'); return isNaN(v)?0:v; }
function getUserAvail(email){ return Math.max(0, getUserTotal(email)-getUserUsed(email)); }

let tab='minutes';
function setTab(t){
 tab=t;
 document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
 document.getElementById('tab'+(t==='minutes'?1:2)).classList.add('active');
 document.getElementById('view-minutes').style.display=t==='minutes'?'block':'none';
 document.getElementById('view-users').style.display=t==='users'?'block':'none';
 render();
}
function toast(msg){ let el=document.getElementById('toast'); el.innerText=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),3000); }

// ==== NEW: 3-WAY AUTO CALCULATION ====
function onTotalChange(){
 let total = parseInt(document.getElementById('editTotal').value)||0;
 let used = parseInt(document.getElementById('editUsed').value)||0;
 document.getElementById('editAvailable').value = Math.max(0, total - used);
}
function onUsedChange(){
 let total = parseInt(document.getElementById('editTotal').value)||0;
 let used = parseInt(document.getElementById('editUsed').value)||0;
 document.getElementById('editAvailable').value = Math.max(0, total - used);
}
function onAvailableChange(){
 let total = parseInt(document.getElementById('editTotal').value)||0;
 let avail = parseInt(document.getElementById('editAvailable').value)||0;
 document.getElementById('editUsed').value = Math.max(0, total - avail);
}

async function renderMinutes(){
 let list = [];
 // Try Supabase first
 if(supabaseClient){
  try{
   let {data, error} = await supabaseClient.from('minutes_requests').select('*').eq('status','pending').order('created_at',{ascending:false});
   if(!error && data) list = data.map(r=>({email:r.email, minutes:r.minutes, amount:r.amount, mpesaCode:r.mpesa_code, mpesaName:r.mpesa_name, createdAt:r.created_at, id:r.id, fromSupabase:true}));
  }catch(e){}
 }
 if(list.length===0) list = getMinPending();

 document.getElementById('cMin').innerText=list.length;
 let html='';
 if(!list.length) html='<div style="color:#666;font-size:11px;padding:20px;text-align:center">No pending minutes requests</div>';
 else list.forEach((r,i)=>{
  let email=r.email.toLowerCase().trim();
  let total=getUserTotal(email);
  let used=getUserUsed(email);
  let avail=getUserAvail(email);
  html+=`<div class="item">
   <div style="display:flex;justify-content:space-between"><b style="font-size:12px">${r.email}</b><span class="badge b-purple">${r.minutes} min • KES ${r.amount||''}</span></div>
   <div style="font-size:10px;color:#9ca3af;margin-top:6px">Code: <b style="color:#facc15">${r.mpesaCode||r.mpesa_code}</b> | Name: ${r.mpesaName||r.mpesa_name}<br>${new Date(r.createdAt||r.created_at).toLocaleString()}</div>
   <div class="stat-grid">
    <div class="stat"><small style="font-size:7px;color:#888">TOTAL NOW</small><b style="font-size:12px;display:block">${total}</b></div>
    <div class="stat"><small style="font-size:7px;color:#4ade80">AVAILABLE</small><b style="font-size:12px;display:block;color:#4ade80">${avail}</b></div>
    <div class="stat"><small style="font-size:7px;color:#f87171">USED</small><b style="font-size:12px;display:block;color:#f87171">${used}</b></div>
   </div>
   <div style="font-size:9px;color:#86efac;margin-top:6px">After approve: TOTAL ${total}→${total+parseInt(r.minutes)} | AVAIL ${avail}→${avail+parseInt(r.minutes)}</div>
   <div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn btn-green" onclick="approveMinutes(${i}, '${r.id||''}', '${r.email}', ${r.minutes})">✅ APPROVE</button>
    <button class="btn btn-red" onclick="rejectMinutes(${i}, '${r.id||''}')">❌ REJECT</button>
   </div>
  </div>`;
 });
 document.getElementById('minutesList').innerHTML=html;
}

async function approveMinutes(idx, supaId, emailArg, minArg){
 let list=getMinPending();
 let r = list[idx] || {email:emailArg, minutes:minArg};
 if(!r) return;
 let email = (r.email||emailArg).toLowerCase().trim();
 let minutes = parseInt(r.minutes||minArg);

 let cur=parseInt(localStorage.getItem(KEY_TOTAL_PREFIX+email)||'0');
 if(cur===0){ cur=parseInt(localStorage.getItem(KEY_LEGACY_PREFIX+email)||'0')||0; }
 let newTotal=cur + minutes;
 localStorage.setItem(KEY_TOTAL_PREFIX+email, String(newTotal));
 localStorage.setItem(KEY_LEGACY_PREFIX+email, String(newTotal));

 // Save to Supabase user_minutes table for all-gadget sync
 if(supabaseClient){
  try{
   await supabaseClient.from('user_minutes').upsert({email:email, total:newTotal, used:getUserUsed(email), available:newTotal-getUserUsed(email), updated_at:new Date().toISOString()}, {onConflict:'email'});
   if(supaId) await supabaseClient.from('minutes_requests').update({status:'approved'}).eq('id',supaId);
  }catch(e){ console.log(e); }
 }

 if(!supaId){ list.splice(idx,1); setMinPending(list); }
 toast(`Approved ${minutes} min to ${email} - TOTAL now ${newTotal}`);
 render();
}

async function rejectMinutes(idx, supaId){
 if(supabaseClient && supaId){
  try{ await supabaseClient.from('minutes_requests').update({status:'rejected'}).eq('id',supaId); }catch(e){}
 }else{
  let list=getMinPending(); list.splice(idx,1); setMinPending(list);
 }
 toast('Rejected');
 render();
}

async function setUserMinutes(){
 let email=document.getElementById('editEmail').value.trim().toLowerCase();
 let total=parseInt(document.getElementById('editTotal').value);
 let avail=parseInt(document.getElementById('editAvailable').value);
 let used=parseInt(document.getElementById('editUsed').value);
 if(!email){ alert('Enter email'); return; }
 if(isNaN(total)) total=getUserTotal(email);
 if(isNaN(used)) used=Math.max(0, total-(isNaN(avail)?getUserAvail(email):avail));
 if(isNaN(avail)) avail=Math.max(0, total-used);
 // Ensure consistency: total = avail + used
 if(total!== avail+used){ avail = Math.max(0, total-used); }

 localStorage.setItem(KEY_TOTAL_PREFIX+email, String(total));
 localStorage.setItem(KEY_LEGACY_PREFIX+email, String(total));
 localStorage.setItem(KEY_USED_PREFIX+email, String(used));

 if(supabaseClient){
  try{
   await supabaseClient.from('user_minutes').upsert({email:email, total:total, available:avail, used:used, updated_at:new Date().toISOString()}, {onConflict:'email'});
   toast(`Saved ${email} to ALL gadgets - T:${total} A:${avail} U:${used}`);
  }catch(e){ toast(`Saved locally - Supabase error: ${e.message}`); }
 }else{
  toast(`Saved locally for ${email} - T:${total} A:${avail} U:${used} (Add Supabase for sync)`);
 }
 loadUserMinutes(); renderUsers();
}

async function loadUserMinutes(){
 let email=document.getElementById('editEmail').value.trim().toLowerCase();
 if(!email){ alert('Enter email'); return; }
 let total=getUserTotal(email);
 let used=getUserUsed(email);
 let avail=getUserAvail(email);

 if(supabaseClient){
  try{
   let {data} = await supabaseClient.from('user_minutes').select('*').eq('email',email).single();
   if(data){ total=data.total; used=data.used; avail=data.available;
    localStorage.setItem(KEY_TOTAL_PREFIX+email, String(total));
    localStorage.setItem(KEY_USED_PREFIX+email, String(used));
   }
  }catch(e){}
 }

 document.getElementById('editTotal').value=total;
 document.getElementById('editAvailable').value=avail;
 document.getElementById('editUsed').value=used;
 document.getElementById('userBalanceInfo').innerHTML=`
  <b style="font-size:12px;color:#fff">${email}</b>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;text-align:center">
   <div style="background:rgba(255,255,255,0.05);padding:8px;border-radius:10px"><small style="color:#888;font-size:8px">TOTAL</small><b style="display:block;color:#fff;font-size:16px">${total} min</b></div>
   <div style="background:rgba(34,197,94,0.08);padding:8px;border-radius:10px;border:1px solid rgba(34,197,94,0.2)"><small style="color:#4ade80;font-size:8px">AVAILABLE</small><b style="display:block;color:#4ade80;font-size:16px">${avail} min</b></div>
   <div style="background:rgba(239,68,68,0.08);padding:8px;border-radius:10px;border:1px solid rgba(239,68,68,0.2)"><small style="color:#f87171;font-size:8px">USED</small><b style="display:block;color:#f87171;font-size:16px">${used} min</b></div>
  </div>
  <div style="font-size:9px;color:#6b7280;margin-top:8px;text-align:center">TOTAL = AVAILABLE + USED • Now editable all 3 fields</div>`;
}

async function addMinutesToUser(min){
 let email=document.getElementById('editEmail').value.trim().toLowerCase();
 if(!email){ alert('Enter email first'); return; }
 let cur=getUserTotal(email);
 let newTotal=cur+min;
 localStorage.setItem(KEY_TOTAL_PREFIX+email, String(newTotal));
 localStorage.setItem(KEY_LEGACY_PREFIX+email, String(newTotal));
 if(supabaseClient){
  try{ await supabaseClient.from('user_minutes').upsert({email:email, total:newTotal, used:getUserUsed(email), available:newTotal-getUserUsed(email), updated_at:new Date().toISOString()}, {onConflict:'email'}); }catch(e){}
 }
 toast(`Added ${min} min to ${email} - synced`);
 loadUserMinutes(); renderUsers();
}

async function renderUsers(){
 let html=''; let seen={};
 // Get from Supabase first if available
 let supaUsers = [];
 if(supabaseClient){
  try{ let {data} = await supabaseClient.from('user_minutes').select('*').order('updated_at',{ascending:false}); if(data) supaUsers=data; }catch(e){}
 }
 if(supaUsers.length>0){
  supaUsers.forEach(u=>{
   html+=`<div class="item">
    <div style="display:flex;justify-content:space-between"><b style="font-size:11px">${u.email}</b><span class="badge b-green">${u.available} avail</span></div>
    <div class="stat-grid">
     <div class="stat"><small style="font-size:7px">TOTAL</small><b style="display:block;font-size:11px">${u.total} min</b></div>
     <div class="stat"><small style="font-size:7px;color:#4ade80">AVAIL</small><b style="display:block;font-size:11px;color:#4ade80">${u.available} min</b></div>
     <div class="stat"><small style="font-size:7px;color:#f87171">USED</small><b style="display:block;font-size:11px;color:#f87171">${u.used} min</b></div>
    </div>
    <div style="display:flex;gap:6px;margin-top:8px">
     <button class="btn btn-gray" style="padding:6px 10px;font-size:9px" onclick="document.getElementById('editEmail').value='${u.email}';loadUserMinutes();">👁️ VIEW / EDIT</button>
     <button class="btn btn-red" style="padding:6px 10px;font-size:9px" onclick="resetUser('${u.email}')">Reset</button>
    </div>
   </div>`;
  });
 }else{
  for(let i=0;i<localStorage.length;i++){
   let k=localStorage.key(i); if(!k) continue;
   let email='';
   if(k.startsWith(KEY_TOTAL_PREFIX)) email=k.replace(KEY_TOTAL_PREFIX,'');
   else if(k.startsWith(KEY_USED_PREFIX)) email=k.replace(KEY_USED_PREFIX,'');
   else if(k.startsWith(KEY_LEGACY_PREFIX)) email=k.replace(KEY_LEGACY_PREFIX,'');
   else continue;
   if(seen[email]) continue; seen[email]=true;
   let total=getUserTotal(email); let used=getUserUsed(email); let avail=getUserAvail(email);
   if(total===0 && used===0) continue;
   html+=`<div class="item">
    <div style="display:flex;justify-content:space-between"><b style="font-size:11px">${email}</b><span class="badge b-green">${avail} avail</span></div>
    <div class="stat-grid">
     <div class="stat"><small style="font-size:7px">TOTAL</small><b style="display:block;font-size:11px">${total} min</b></div>
     <div class="stat"><small style="font-size:7px;color:#4ade80">AVAIL</small><b style="display:block;font-size:11px;color:#4ade80">${avail} min</b></div>
     <div class="stat"><small style="font-size:7px;color:#f87171">USED</small><b style="display:block;font-size:11px;color:#f87171">${used} min</b></div>
    </div>
    <div style="display:flex;gap:6px;margin-top:8px">
     <button class="btn btn-gray" style="padding:6px 10px;font-size:9px" onclick="document.getElementById('editEmail').value='${email}';loadUserMinutes();setTab('users')">👁️ VIEW / EDIT</button>
     <button class="btn btn-red" style="padding:6px 10px;font-size:9px" onclick="resetUser('${email}')">Reset</button>
    </div>
   </div>`;
  }
  if(!html) html='<div style="color:#666;font-size:11px;padding:10px">No users yet - Add Supabase to see all users from all gadgets</div>';
 }
 document.getElementById('allUsersList').innerHTML=html;
}

async function resetUser(email){
 if(!confirm('Reset '+email+' to 0?')) return;
 localStorage.removeItem(KEY_TOTAL_PREFIX+email);
 localStorage.removeItem(KEY_USED_PREFIX+email);
 localStorage.removeItem(KEY_LEGACY_PREFIX+email);
 if(supabaseClient){ try{ await supabaseClient.from('user_minutes').delete().eq('email',email); }catch(e){} }
 renderUsers(); toast('Reset done');
}

function render(){ renderMinutes(); renderUsers(); }
render();
setInterval(render, 5000);
</script>
</body>
                                                                      </html>
