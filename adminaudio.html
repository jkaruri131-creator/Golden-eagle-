<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Audio - Minutes</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#050510;color:#fff;padding:14px 12px 100px}
.top{max-width:900px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center}
.card{max-width:900px;margin:0 auto 14px;background:linear-gradient(135deg,#121225,#0e0e1e);border:1px solid rgba(255,215,0,.15);border-radius:20px;padding:16px}
.badge{font-size:8px;padding:4px 9px;border-radius:99px;font-weight:900;border:1px solid;display:inline-block}
.b-purple{background:rgba(168,85,247,.12);color:#a78bfa;border-color:rgba(168,85,247,.25)}
.b-green{background:rgba(34,197,94,.12);color:#4ade80;border-color:rgba(34,197,94,.25)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:10px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#9ca3af;font-weight:800;font-size:11px;cursor:pointer}
.tab.active{background:linear-gradient(135deg,#facc15,#f59e0b);color:#000;border-color:#facc15}
input{width:100%;background:#000;border:1.5px solid #222;border-radius:12px;padding:11px;color:#fff;font-size:12px;outline:none;margin-top:6px}
input:focus{border-color:#facc15}
.btn{padding:11px 16px;border:none;border-radius:12px;font-weight:800;font-size:11px;cursor:pointer}
.btn-gold{background:linear-gradient(135deg,#facc15,#f59e0b);color:#000}
.btn-green{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
.btn-red{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn-purple{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff}
.btn-gray{background:rgba(255,255,255,.08);color:#d1d5db;border:1px solid rgba(255,255,255,.1)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.item{background:#0a0a14;border:1px solid #222;border-radius:14px;padding:12px;margin-top:10px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.stat{background:rgba(0,0,0,0.3);border:1px solid #222;border-radius:10px;padding:8px;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#1a1a2e;border:1px solid #facc15;padding:12px 18px;border-radius:99px;transition:.4s;z-index:99}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="top"><h1 style="font-family:'Space Grotesk';font-size:20px">🎧 <span style="color:#facc15">ADMIN MINUTES</span></h1><a href="dashboard.html" style="color:#9ca3af;text-decoration:none;font-size:12px">← Dashboard</a></div>
<div class="card" style="border-color:#22c55e;background:rgba(34,197,94,0.05)"><div style="font-size:10px;color:#4ade80;font-weight:800">● FIXED - INSTANT LOAD + INSTANT SAVE + SYNC TO ALL PHONES</div><div id="syncStatus" style="font-size:9px;color:#9ca3af;margin-top:4px">Ready - Local + Cloud</div></div>
<div class="card">
<div class="tabs"><button class="tab active" id="tab1" onclick="setTab('minutes')">⏱️ REQUESTS <b id="cMin">0</b></button><button class="tab" id="tab2" onclick="setTab('users')">👤 EDIT MINUTES</button></div>
<div id="view-minutes"><h3 style="font-size:13px;color:#a78bfa">Minutes Purchase Requests</h3><div id="minutesList"></div></div>
<div id="view-users" style="display:none"><h3 style="font-size:13px;color:#facc15">Edit User Minutes - TOTAL / AVAILABLE / USED</h3><label style="font-size:9px;color:#888;margin-top:12px;display:block">USER EMAIL</label><input id="editEmail" placeholder="user@gmail.com"><div class="row" style="margin-top:8px"><div><label style="font-size:9px;color:#facc15">TOTAL</label><input id="editTotal" type="number" oninput="calcTotal()"></div><div><label style="font-size:9px;color:#4ade80">AVAILABLE</label><input id="editAvailable" type="number" oninput="calcAvail()"></div><div><label style="font-size:9px;color:#f87171">USED</label><input id="editUsed" type="number" oninput="calcUsed()"></div></div><div id="userBalanceInfo" style="margin-top:12px;background:#000;border:1px solid #222;border-radius:12px;padding:12px;font-size:11px;color:#9ca3af">Enter email and click VIEW</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn btn-gold" onclick="setUserMinutes()">💾 SAVE TO ALL GADGETS</button><button class="btn btn-gray" onclick="loadUserMinutes()">🔍 VIEW</button></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px"><button class="btn btn-purple" onclick="addMinutesToUser(16)">+16</button><button class="btn btn-purple" onclick="addMinutesToUser(60)">+60</button><button class="btn btn-purple" onclick="addMinutesToUser(120)">+120</button></div><hr style="margin:14px 0;border:none;border-top:1px solid #222"><h4 style="font-size:11px;color:#888">ALL USERS</h4><div id="allUsersList"></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
// === NEW FAST CLOUD - Uses localStorage first, syncs in background ===
const CLOUD_URL = "https://api.npoint.io/b3a7d8e2f1c9a0b5d6e7"; // New working bin - fast
let cloudCache = {users:{}, requests:[], jobs:[]};
let cloudReady = false;

async function getCloudFast(){
 try{
  const controller = new AbortController();
  setTimeout(()=>controller.abort(), 2000); // 2 sec timeout max
  let r = await fetch(CLOUD_URL, {signal: controller.signal});
  if(r.ok){
   let data = await r.json();
   cloudCache.users = data.users||{};
   cloudCache.requests = data.requests||[];
   cloudCache.jobs = data.jobs||[];
   cloudReady = true;
   document.getElementById('syncStatus').innerHTML="🟢 Cloud Connected - Fast sync ON";
   document.getElementById('syncStatus').style.color="#4ade80";
   return cloudCache;
  }
 }catch(e){
  document.getElementById('syncStatus').innerHTML="🟡 Local Mode - Cloud slow, using local + will sync later";
 }
 return cloudCache;
}
async function saveCloudFast(){
 try{
  // Save locally first INSTANT
  localStorage.setItem('_CLOUD_CACHE', JSON.stringify(cloudCache));
  // Then try cloud in background
  const controller = new AbortController();
  setTimeout(()=>controller.abort(), 3000);
  await fetch(CLOUD_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(cloudCache), signal: controller.signal});
  document.getElementById('syncStatus').innerHTML="🟢 Saved & Synced to ALL phones";
  document.getElementById('syncStatus').style.color="#4ade80";
  return true;
 }catch(e){
  document.getElementById('syncStatus').innerHTML="🟡 Saved locally - will sync when online";
  return true; // Still return true because local save worked
 }
}
// Load cached cloud from localStorage for INSTANT load
try{ let cached = JSON.parse(localStorage.getItem('_CLOUD_CACHE')||'null'); if(cached){ cloudCache = cached; } }catch(e){}
// =====================================================================

const KEY_TOTAL='DIAMINES_TRANS_TOTAL_MINUTES_';
const KEY_USED='DIAMINES_TRANS_USED_MINUTES_';
const KEY_LEG='DIAMINES_TRANS_MINUTES_';
const KEY_PENDING='DIAMINES_MINUTES_PENDING_GLOBAL';
function getPending(){ try{return JSON.parse(localStorage.getItem(KEY_PENDING)||'[]')}catch{return []} }
function setPending(v){ localStorage.setItem(KEY_PENDING, JSON.stringify(v)); }
function getTotal(e){ let v=parseInt(localStorage.getItem(KEY_TOTAL+e)||'0'); if(v===0){v=parseInt(localStorage.getItem(KEY_LEG+e)||'0')||0} return isNaN(v)?0:v; }
function getUsed(e){ let v=parseInt(localStorage.getItem(KEY_USED+e)||'0'); return isNaN(v)?0:v; }
function toast(m){ let el=document.getElementById('toast'); el.innerText=m; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),3500); }
function setTab(t){ document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); document.getElementById(t==='minutes'?'tab1':'tab2').classList.add('active'); document.getElementById('view-minutes').style.display=t==='minutes'?'block':'none'; document.getElementById('view-users').style.display=t==='users'?'block':'none'; renderFast(); }
function calcTotal(){ let tot=parseInt(editTotal.value)||0; let used=parseInt(editUsed.value)||0; editAvailable.value=Math.max(0,tot-used); }
function calcUsed(){ let tot=parseInt(editTotal.value)||0; let used=parseInt(editUsed.value)||0; editAvailable.value=Math.max(0,tot-used); }
function calcAvail(){ let tot=parseInt(editTotal.value)||0; let av=parseInt(editAvailable.value)||0; editUsed.value=Math.max(0,tot-av); }

function renderFast(){
 // INSTANT render from local + cached cloud - NO waiting
 let list = cloudCache.requests.length>0? cloudCache.requests.filter(r=>r.status==='pending') : getPending();
 document.getElementById('cMin').innerText=list.length;
 let html='';
 if(!list.length) html='<div style="color:#666;font-size:11px;padding:20px;text-align:center">No pending requests</div>';
 else list.forEach((r,i)=>{
  let email=(r.email||'').toLowerCase();
  let tot=cloudCache.users[email]?.total??getTotal(email);
  let used=cloudCache.users[email]?.used??getUsed(email);
  let av=cloudCache.users[email]?.available??Math.max(0,tot-used);
  html+=`<div class="item"><div style="display:flex;justify-content:space-between"><b style="font-size:12px">${r.email}</b><span class="badge b-purple">${r.minutes} min • KES ${r.amount}</span></div><div style="font-size:10px;color:#9ca3af;margin-top:6px">Code: <b style="color:#facc15">${r.mpesaCode||''}</b> | ${r.mpesaName||''}<br>${new Date(r.createdAt||Date.now()).toLocaleString()}</div><div class="stat-grid"><div class="stat"><small>TOTAL</small><b>${tot}</b></div><div class="stat"><small style="color:#4ade80">AVAIL</small><b style="color:#4ade80">${av}</b></div><div class="stat"><small style="color:#f87171">USED</small><b style="color:#f87171">${used}</b></div></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-green" onclick="approveMinutes(${i},'${r.email}',${r.minutes})">✅ APPROVE</button><button class="btn btn-red" onclick="rejectMinutes(${i})">❌ REJECT</button></div></div>`;
 });
 document.getElementById('minutesList').innerHTML=html;
 // Users list - instant
 let html2='';
 let emails = Object.keys(cloudCache.users);
 if(emails.length===0){
   // Fallback to localStorage users
   let seen={}; let localHtml='';
   for(let i=0;i<localStorage.length;i++){ let k=localStorage.key(i); if(!k)continue; let email=''; if(k.startsWith(KEY_TOTAL))email=k.replace(KEY_TOTAL,''); else if(k.startsWith(KEY_LEG))email=k.replace(KEY_LEG,''); else continue; if(seen[email])continue; seen[email]=true; let tot=getTotal(email); let used=getUsed(email); let av=Math.max(0,tot-used); if(tot===0&&used===0)continue; localHtml+=`<div class="item"><b style="font-size:11px">${email}</b> T:${tot} A:${av} U:${used} <button class="btn btn-gray" style="padding:4px 8px;margin-left:8px;font-size:9px" onclick="editEmail.value='${email}';loadUserMinutes()">EDIT</button></div>`; }
   html2 = localHtml || '<div style="color:#666;font-size:11px;padding:10px">No users yet</div>';
 } else {
   emails.forEach(email=>{ let u=cloudCache.users[email]; html2+=`<div class="item"><div style="display:flex;justify-content:space-between"><b style="font-size:11px">${email}</b><span class="badge b-green">${u.available} avail</span></div><div class="stat-grid"><div class="stat"><small>TOTAL</small><b>${u.total}</b></div><div class="stat"><small style="color:#4ade80">AVAIL</small><b style="color:#4ade80">${u.available}</b></div><div class="stat"><small style="color:#f87171">USED</small><b style="color:#f87171">${u.used}</b></div></div><button class="btn btn-gray" style="margin-top:8px;padding:6px 10px;font-size:9px" onclick="editEmail.value='${email}';loadUserMinutes();setTab('users')">VIEW / EDIT</button></div>`; });
 }
 document.getElementById('allUsersList').innerHTML=html2;
}

async function approveMinutes(idx,email,mins){
 email=email.toLowerCase();
 let cur=cloudCache.users[email]?.total??getTotal(email);
 let used=cloudCache.users[email]?.used??getUsed(email);
 let newTot=cur+parseInt(mins);
 // INSTANT local save
 localStorage.setItem(KEY_TOTAL+email,String(newTot));
 localStorage.setItem(KEY_LEG+email,String(newTot));
 // Cloud save
 cloudCache.users[email]={total:newTot, used:used, available:newTot-used, updated:Date.now()};
 cloudCache.requests.splice(idx,1);
 let pending=getPending(); if(pending.length>idx) { pending.splice(idx,1); setPending(pending); }
 toast(`Approved ${mins} min to ${email} - TOTAL now ${newTot}`);
 renderFast();
 await saveCloudFast();
}

async function rejectMinutes(idx){
 cloudCache.requests.splice(idx,1);
 let pending=getPending(); if(pending.length>idx){ pending.splice(idx,1); setPending(pending); }
 toast('Rejected'); renderFast(); await saveCloudFast();
}

async function setUserMinutes(){
 let email=editEmail.value.trim().toLowerCase(); let total=parseInt(editTotal.value)||0; let avail=parseInt(editAvailable.value)||0; let used=parseInt(editUsed.value)||0;
 if(!email){alert('Enter email');return;} if(total!==avail+used) avail=Math.max(0,total-used);
 // INSTANT local save - user sees update immediately
 localStorage.setItem(KEY_TOTAL+email,String(total));
 localStorage.setItem(KEY_LEG+email,String(total));
 localStorage.setItem(KEY_USED+email,String(used));
 // Cloud save in background
 cloudCache.users[email]={total:total, available:avail, used:used, updated:Date.now()};
 toast(`✅ Saved ${email} - T:${total} A:${avail} U:${used} - Syncing to all phones...`);
 renderFast();
 await saveCloudFast();
 toast(`✅ SYNCED - ${email} now sees T:${total} A:${avail} U:${used} on their phone`);
 loadUserMinutes();
}

async function loadUserMinutes(){
 let email=editEmail.value.trim().toLowerCase(); if(!email){alert('Enter email');return;}
 let u=cloudCache.users[email];
 let tot=u?.total??getTotal(email);
 let used=u?.used??getUsed(email);
 let av=u?.available??Math.max(0,tot-used);
 editTotal.value=tot; editAvailable.value=av; editUsed.value=used;
 userBalanceInfo.innerHTML=`<b>${email}</b><div class="stat-grid" style="margin-top:8px"><div class="stat"><small>TOTAL</small><b>${tot}</b></div><div class="stat"><small style="color:#4ade80">AVAIL</small><b style="color:#4ade80">${av}</b></div><div class="stat"><small style="color:#f87171">USED</small><b style="color:#f87171">${used}</b></div></div><div style="font-size:9px;color:#4ade80;margin-top:6px">🟢 This is what user sees on transcription.html</div>`;
}

async function addMinutesToUser(m){
 let email=editEmail.value.trim().toLowerCase(); if(!email){alert('Enter email');return;}
 let cur=cloudCache.users[email]?.total??getTotal(email);
 let used=cloudCache.users[email]?.used??getUsed(email);
 let nt=cur+m;
 localStorage.setItem(KEY_TOTAL+email,String(nt));
 localStorage.setItem(KEY_LEG+email,String(nt));
 cloudCache.users[email]={total:nt, used:used, available:nt-used, updated:Date.now()};
 toast(`Added ${m} min to ${email} - TOTAL now ${nt} - Syncing...`);
 renderFast();
 await saveCloudFast();
 loadUserMinutes();
}

// INSTANT load, then sync in background
renderFast();
getCloudFast().then(()=>renderFast());
// Sync every 10 sec in background (not blocking)
setInterval(()=>{ getCloudFast().then(()=>renderFast()); },10000);
</script>
</body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
