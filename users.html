<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIAMINES - LOGIN AS USER - ADMIN ONLY</title>
<style>*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0}body{background:#070711;color:#fff;padding:12px}.card{background:#15152d;border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:12px}.input{width:100%;padding:12px;background:#1e1e3a;border:1px solid #333;border-radius:8px;color:#fff;margin-bottom:8px}.btn{padding:12px;border:none;border-radius:8px;font-weight:800;cursor:pointer}.btn-p{background:linear-gradient(135deg,#ff0055,#ff4d8d);color:#fff;width:100%}.btn-b{background:#2962ff;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}}.badge{padding:3px 8px;border-radius:99px;font-size:10px}</style>
</head><body>
<div style="background:#0f0f23;padding:12px;border-radius:12px;border-bottom:2px solid #00e676;margin-bottom:12px"><b style="color:#00e676">👑 ADMIN ONLY - LOGIN AS USER BY EMAIL</b><br><small style="color:#666">Enter any user email - see full account without password</small></div>

<div class="card" style="border-color:#00e676">
<h3 style="color:#00e676">🔐 Impersonate User</h3>
<input id="emailInput" class="input" placeholder="Enter user email e.g. otienovillicent234@gmail.com">
<button class="btn btn-p" onclick="loginAsUser()">ENTER ACCOUNT →</button>
<div id="msg" style="margin-top:8px;font-size:11px"></div>
</div>

<div id="userPanel" style="display:none">
<div class="grid">
<div class="card"><h3 id="uName">User</h3><p id="uEmail" style="color:#888;font-size:11px"></p><br>
<p>Balance: <b id="uBal" style="color:#00e676">KES 0</b></p>
<p>Upline: <b id="uUpline" style="color:#00b8d4">Official</b></p>
<p>Package: <b id="uPack">lion</b></p>
<p>Status: <b id="uStatus"></b></p>
</div>
<div class="card"><h3 style="color:#00b8d4">Team: <b id="teamCount">0</b></h3><div id="teamList" style="font-size:11px;max-height:200px;overflow:auto;background:#000;padding:8px;border-radius:8px;margin-top:8px"></div></div>
</div>
<div class="card"><h3 style="color:#ffb700">📝 Field Review / WritingApproved - All Tasks for this Email</h3><div id="tasks" style="margin-top:8px"></div></div>
<div class="card"><h3>🔧 Admin Actions on This Account</h3>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
<button class="btn btn-b" onclick="addBalance()">+ Add KES 100</button>
<button class="btn" style="background:#ffb700;color:#000" onclick="changeUplinePrompt()">Change Upline</button>
<button class="btn" style="background:#00e676;color:#000" onclick="approveAll()">Approve Tasks</button>
</div>
</div>
</div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, query, where, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6QxDFhIIHwt6TTZla6g4m-FaJdMol6M",
  authDomain: "diamines-agencies.firebaseapp.com",
  projectId: "diamines-agencies",
  storageBucket: "diamines-agencies.firebasestorage.app",
  messagingSenderId: "438413306857",
  appId: "1:438413306857:web:3c7f736794be6a49b0f978"
};
let app = getApps().length? getApps()[0] : initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentEmail = '';
let currentDocId = '';

window.loginAsUser = async()=>{
 let e = document.getElementById('emailInput').value.trim().toLowerCase();
 if(!e){ msg.innerHTML='<span style="color:#ff1744">Enter email</span>'; return; }
 document.getElementById('msg').innerHTML='<span style="color:#00b8d4">Loading account for '+e+'...</span>';
 try{
   // 1. Try direct doc ID = email (your system)
   let snap = await getDoc(doc(db,"users", e));
   let data = null;
   let docId = e;
   if(snap.exists()){
     data = snap.data();
   } else {
     // 2. Search where email field == e (if doc ID is UID)
     const q = query(collection(db,"users"), where("email","==", e));
     const qs = await getDocs(q);
     if(!qs.empty){
       data = qs.docs[0].data();
       docId = qs.docs[0].id;
     }
   }
   if(!data){
     msg.innerHTML='<span style="color:#ff1744">❌ User not found: '+e+'</span>';
     return;
   }
   currentEmail = e;
   currentDocId = docId;
   document.getElementById('userPanel').style.display='block';
   document.getElementById('uName').innerText = data.username || data.displayName || e.split('@')[0];
   document.getElementById('uEmail').innerText = data.email + ' | DocID: '+docId;
   document.getElementById('uBal').innerText = 'KES '+(data.balance??0);
   document.getElementById('uUpline').innerText = data.upline || data.referrer || 'Official';
   document.getElementById('uPack').innerText = data.package || 'lion';
   document.getElementById('uStatus').innerHTML = data.banned? '<span style="color:#ff1744">BANNED</span>' : '<span style="color:#00e676">ACTIVE</span>';
   msg.innerHTML='<span style="color:#00e676">✅ Logged in as '+e+' - Full access</span>';

   // Load team
   const all = await getDocs(collection(db,"users"));
   let team = [];
   all.forEach(d=>{
     let u = d.data();
     let up = (u.upline||u.referrer||'').toLowerCase();
     if(up === e) team.push(u.email || d.id);
   });
   document.getElementById('teamCount').innerText = team.length;
   document.getElementById('teamList').innerHTML = team.length? team.join('<br>') : 'No team members';

   // Load writingApproved / tasks
   document.getElementById('tasks').innerHTML='Loading tasks...';
   try{
     // Try different collection names - writingApproved, tasks, submissions
     const collections = ['writingApproved','writings','tasks','fieldReviews'];
     let found = false;
     for(let colName of collections){
       try{
         const tq = query(collection(db,colName), where("email","==", e));
         const tSnap = await getDocs(tq);
         if(!tSnap.empty){
           let html = `<small style="color:#888">Found in ${colName}: ${tSnap.size} tasks</small><br><br>`;
           tSnap.forEach(td=>{
             let t = td.data();
             html+=`<div style="background:#000;padding:8px;border-radius:8px;margin-bottom:6px;border:1px solid #222">
               <b>${t.title||t.taskTitle||'Task'}</b> - <span class="badge" style="background:${t.status==='approved'?'rgba(0,230,118,0.2)':'rgba(255,183,0,0.2)'};color:${t.status==='approved'?'#00e676':'#ffb700'}">${t.status||'pending'}</span><br>
               <small style="color:#666">ID: ${td.id} | ${t.createdAt||''}</small>
               <div style="font-size:10px;margin-top:4px;color:#aaa">${(t.content||t.description||'').substring(0,150)}...</div>
             </div>`;
           });
           document.getElementById('tasks').innerHTML = html;
           found = true;
           break;
         }
       }catch{}
     }
     if(!found) document.getElementById('tasks').innerHTML='<span style="color:#666">No tasks found for this email in writingApproved/tasks. But writings are still safe if email matches.</span>';
   }catch(err){
     document.getElementById('tasks').innerHTML='Error loading tasks: '+err.message;
   }

 }catch(err){
   document.getElementById('msg').innerHTML='<span style="color:#ff1744">❌ '+err.message+'</span>';
 }
}

window.addBalance = async()=>{
 let amt = prompt('How much to add? (e.g. 100)');
 if(!amt) return;
 try{
   let cur = await getDoc(doc(db,"users", currentDocId));
   let bal = (cur.data().balance||0) + parseInt(amt);
   await updateDoc(doc(db,"users", currentDocId), {balance: bal});
   document.getElementById('uBal').innerText='KES '+bal;
   alert('Added! New balance: '+bal);
 }catch(e){ alert(e.message); }
}
window.changeUplinePrompt = async()=>{
 let nu = prompt('New upline email for '+currentEmail);
 if(!nu) return;
 try{
   await updateDoc(doc(db,"users", currentDocId), {upline: nu.toLowerCase(), referrer: nu.toLowerCase()});
   document.getElementById('uUpline').innerText=nu;
   alert('Upline changed to '+nu);
 }catch(e){ alert(e.message); }
}
window.approveAll = ()=>{ alert('Go to your main admin to approve - this view is read + quick actions'); }
</script>
</body></html>
