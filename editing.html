<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIAMINES - Editing Jobs</title>
<style>
*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0}
body{background:#070711;color:#fff;padding:10px}
.top{background:#111126;border:1px solid #222;border-radius:16px;padding:14px;margin-bottom:10px;position:sticky;top:10px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.top h1{font-size:20px;font-weight:900;letter-spacing:2px;color:#facc15;text-shadow:0 0 20px rgba(250,204,21,0.4);text-align:center}
.top h1 span{color:#00b8d4}
.top p{font-size:8px;color:#8b8ba7;letter-spacing:3px;text-align:center;margin-top:3px;font-weight:800}
.tab{display:inline-block;padding:10px 14px;border-radius:99px;cursor:pointer;font-weight:800;font-size:11px;margin:3px;background:#222;color:#888}
.tab.active{background:#facc15;color:#000}
.btn{padding:14px;border:none;border-radius:10px;font-weight:900;cursor:pointer;width:100%;margin-top:8px;font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;transition:0.2s}
.btn:disabled{opacity:0.4;pointer-events:none}
.btn-b{background:linear-gradient(135deg,#2962ff,#304ffe);color:#fff}
.btn-o{background:linear-gradient(135deg,#ff6d00,#ff9100);color:#fff}
.btn-y{background:linear-gradient(135deg,#facc15,#ffb700);color:#000}
.btn-d{background:#333;color:#fff}
.btn-lock{background:#1a1a1a;color:#666;border:1px dashed #444;pointer-events:none}
.btn-submitted{background:#002a12;color:#00e676;border:1px solid #00e676;pointer-events:none}
.job{background:#0f0f23;border:1px solid #333;border-radius:12px;padding:14px;margin-bottom:12px;border-left:5px solid #facc15}
.job.locked{border-left-color:#555;opacity:0.7;background:#0a0a14}
.popup{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:9999;padding:15px}
.popup.show{display:flex}.box{background:#15152d;border:2px solid #facc15;border-radius:16px;padding:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.success-box{background:linear-gradient(135deg,#0a2a12,#0f4a1a);border:2px solid #00e676}
.card-approved{background:linear-gradient(135deg,#001a0a,#0a3d1a);border:2px solid #00e676;border-radius:20px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden;animation:pop 0.5s}
@keyframes pop{from{transform:scale(0.92);opacity:0}to{transform:scale(1);opacity:1}}
.badge-approved{background:linear-gradient(135deg,#00e676,#00c853);color:#000;padding:7px 14px;border-radius:99px;font-weight:900;font-size:12px;box-shadow:0 4px 15px rgba(0,230,118,0.4)}
.confetti{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.confetti span{position:absolute;animation:fall 3s linear infinite}
@keyframes fall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(220px) rotate(720deg);opacity:0}}
.card-rejected{background:linear-gradient(135deg,#1a0005,#2d0a12);border:2px solid #ff1744;border-radius:20px;padding:16px;margin-bottom:12px;animation:shake 0.4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.badge-rejected{background:linear-gradient(135deg,#ff1744,#d50000);color:#fff;padding:7px 14px;border-radius:99px;font-weight:900;font-size:12px}
</style></head><body>
<div class="top">
<h1>DIAMINES <span>EDITING JOBS</span></h1>
<p>PROFESSIONAL EDITING PLATFORM</p>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;background:rgba(0,0,0,0.3);padding:8px 10px;border-radius:8px">
<small id="email" style="font-size:10px;color:#8b8ba7"></small>
<div style="display:flex;gap:8px;align-items:center">
<small style="font-size:10px;color:#facc15">KES <span id="bal">0</span></small>
<button onclick="location.reload()" style="padding:5px 10px;background:#facc15;color:#000;border:none;border-radius:6px;font-weight:900;font-size:10px">🔄 SYNC</button>
</div>
</div>
</div>
<div style="background:#15152d;padding:10px;border-radius:12px;margin-bottom:10px">
<span class="tab active" id="tAvail" onclick="setTab('avail')">Available (<span id="cAvail">0</span>)</span>
<span class="tab" id="tDoing" onclick="setTab('doing')">My Tasks (<span id="cDoing">0</span>)</span>
<span class="tab" id="tPending" onclick="setTab('pending')">Awaiting (<span id="cPending">0</span>)</span>
<span class="tab" id="tApproved" onclick="setTab('approved')">Approved (<span id="cApproved">0</span>)</span>
<span class="tab" id="tRejected" onclick="setTab('rejected')">Rejected (<span id="cRejected">0</span>)</span>
</div>
<div id="list"></div>

<div id="pView" class="popup"><div class="box"><h3 style="color:#facc15">📄 TEXT TO EDIT</h3><div id="vTitle" style="background:#000;padding:8px;border-radius:8px;margin:10px 0"></div><div id="vText" style="background:#000;padding:12px;border-radius:10px;white-space:pre-wrap;font-size:13px;max-height:350px;overflow:auto"></div><button class="btn btn-d" onclick="document.getElementById('pView').classList.remove('show')">Close</button></div></div>

<div id="pSubmit" class="popup"><div class="box" style="border-color:#00e676"><h3 style="color:#00e676">📤 SUBMIT FOR APPROVAL</h3><div id="sTitle" style="background:#000;padding:8px;border-radius:8px;margin:10px 0"></div><textarea id="sEdit" rows="8" style="width:100%;padding:10px;background:#1e1e3a;border:2px solid #00e676;border-radius:8px;color:#fff"></textarea>
<button id="btnDoSubmit" class="btn btn-y" onclick="doSubmit()">📤 SUBMIT FOR APPROVAL</button>
<button class="btn btn-d" onclick="document.getElementById('pSubmit').classList.remove('show')">Cancel</button></div></div>

<div id="pSuccess" class="popup"><div class="box success-box" style="text-align:center"><div style="font-size:50px">🎉</div><h2 style="color:#00e676;margin:10px 0">Task Awarded Successfully!</h2><p id="successMsg" style="color:#fff;font-size:13px;line-height:1.5"></p><button class="btn btn-b" onclick="closeSuccess()">✅ Go to My Tasks</button></div></div>

<div id="pLocked" class="popup"><div class="box" style="border-color:#facc15;text-align:center"><div style="font-size:50px">🔒</div><h2 style="color:#facc15">Already Submitted!</h2><p id="lockedMsg" style="color:#fff;font-size:13px;margin:12px 0;line-height:1.5"></p><button class="btn btn-d" onclick="document.getElementById('pLocked').classList.remove('show'); setTab('pending')">Go to Awaiting</button><button class="btn btn-b" style="margin-top:6px;background:#222" onclick="document.getElementById('pLocked').classList.remove('show')">OK</button></div></div>

<script>
let tab='avail', email='', selIdx=0;
const KEY='DIAMINES_EDITING_AVAILABLE_JOBS';
function getEmail(){let e='';try{let u=JSON.parse(localStorage.getItem('DIAMINES_CURRENT_USER')||localStorage.getItem('DIAMINES_CURRENT')||localStorage.getItem('currentUser')||'{}');e=u.email||''}catch{}if(!e) e=localStorage.getItem('DIAMINES_CURRENT_EMAIL')||localStorage.getItem('LAST_EMAIL')||'jkaruri136@gmail.com';return e.toLowerCase().trim();}
function init(){email=getEmail();localStorage.setItem('LAST_EMAIL',email);document.getElementById('email').innerText='👤 '+email;render();}
function getA(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}
function getD(){try{return JSON.parse(localStorage.getItem('DOING_'+email)||'[]')}catch{return []}}
function getP(){try{return JSON.parse(localStorage.getItem('PENDING_'+email)||'[]')}catch{return []}}
function getH(){try{return JSON.parse(localStorage.getItem('HISTORY_'+email)||'[]')}catch{return []}}
function setTab(t){tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('t'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active');render();}

function isJobLockedAnywhere(jobId){
  if(getD().some(x=>x.id===jobId)) return {locked:true, where:'My Tasks'};
  if(getP().some(x=>x.id===jobId)) return {locked:true, where:'Awaiting Approval'};
  if(getH().some(x=>x.id===jobId)) {let h=getH().find(x=>x.id===jobId);return {locked:true, where: h.status==='approved'?'Already Approved':'Already Rejected'};}
  try{let gp=JSON.parse(localStorage.getItem('GLOBAL_PENDING')||'[]'); if(gp.some(x=>x.id===jobId && x.userEmail===email)) return {locked:true, where:'Awaiting Approval'};}catch{}
  return {locked:false};
}

function getUpdatedBalance(){
  let history = getH();
  let approvedTotal = history.filter(x=>x.status==='approved').reduce((s,j)=>s+parseFloat(j.earn||0),0);
  let balStored = parseFloat(localStorage.getItem('BAL_'+email)||'0');
  let totalEarnedStored = parseFloat(localStorage.getItem('TOTAL_EARNED_'+email)||'0');
  let finalBal = Math.max(balStored, approvedTotal, totalEarnedStored);
  if(finalBal > balStored){
    localStorage.setItem('BAL_'+email, finalBal.toString());
    localStorage.setItem('TOTAL_EARNED_'+email, finalBal.toString());
  }
  return finalBal;
}

function render(){
  let A=getA(), D=getD(), P=getP(), H=getH();
  let ap=H.filter(x=>x.status==='approved'), re=H.filter(x=>x.status==='rejected');
  document.getElementById('cAvail').innerText=A.length;document.getElementById('cDoing').innerText=D.length;
  document.getElementById('cPending').innerText=P.length;document.getElementById('cApproved').innerText=ap.length;document.getElementById('cRejected').innerText=re.length;
  document.getElementById('bal').innerText = getUpdatedBalance();
  let html='';
  if(tab==='avail'){
    A.forEach(j=>{
      let lock=isJobLockedAnywhere(j.id);
      if(lock.locked){
        html+=`<div class="job locked"><div style="display:flex;gap:6px"><span>🔒</span><b>${j.title} - KES ${j.earn}</b></div><small style="color:#facc15">⚠️ Already in ${lock.where} - Locked</small><div style="background:#332a00;padding:8px;border-radius:8px;margin-top:8px;border:1px dashed #facc15;text-align:center"><b style="color:#facc15">🔒 ALREADY SUBMITTED - LOCKED</b><br><small style="color:#888">Check ${lock.where} tab</small></div><button class="btn btn-lock" disabled>🔒 SUBMIT DISABLED - ALREADY SUBMITTED</button></div>`;
      } else {
        html+=`<div class="job"><div style="display:flex;gap:6px;margin-bottom:8px"><span>✍️</span><b>${j.title} - KES ${j.earn}</b></div><small style="color:#888">${j.desc||'Edit grammar & spelling'}</small><button class="btn btn-b" onclick="acceptJob('${j.id}')">✅ ACCEPT TASK</button><button class="btn btn-o" onclick="viewAvail('${j.id}')">👁️ VIEW TEXT</button><button class="btn btn-y" onclick="uploadFromAvail('${j.id}')">📤 UPLOAD & SUBMIT</button></div>`;
      }
    });
    if(!html) html='<div style="text-align:center;color:#666;padding:20px">No jobs</div>';
  }
  if(tab==='doing'){
    D.forEach((j,i)=>{
      let alreadyPending = getP().some(x=>x.id===j.id);
      if(alreadyPending){
        html+=`<div class="job locked"><b>${j.title} - KES ${j.earn}</b><br><small style="color:#facc15">🔒 Already submitted - awaiting</small><button class="btn btn-submitted" disabled>✅ SUBMITTED - LOCKED - AWAITING REVIEW</button></div>`;
      } else {
        html+=`<div class="job"><div style="display:flex;gap:6px;margin-bottom:8px"><span>✍️</span><b>${j.title} - KES ${j.earn}</b></div><button class="btn btn-o" onclick="viewDoing(${i})">👁️ VIEW TEXT</button><button class="btn btn-y" onclick="openSubmit(${i})">📤 UPLOAD & SUBMIT FOR APPROVAL</button></div>`;
      }
    });
    if(!html) html='<div style="text-align:center;color:#666;padding:20px">No My Tasks</div>';
  }
  if(tab==='pending'){
    if(!P.length) html='<div style="text-align:center;color:#666;padding:20px">No awaiting</div>';
    P.forEach(j=>{
      html+=`<div class="job" style="border-left-color:#facc15;background:#1a1a00"><b>${j.title}</b> <span style="float:right;background:#facc15;color:#000;padding:3px 8px;border-radius:99px;font-size:10px;font-weight:900">⏳ AWAITING</span><br><small style="color:#facc15">🔒 LOCKED - SUBMIT DISABLED</small><div style="background:#000;padding:8px;border-radius:8px;margin-top:8px;max-height:100px;overflow:auto"><small>${escapeHtml((j.proof||'').substring(0,200))}...</small></div><button class="btn btn-submitted" disabled>🔒 SUBMITTED - LOCKED - CANNOT SUBMIT AGAIN</button></div>`;
    });
  }
  if(tab==='approved'){
    if(!ap.length) html='<div style="text-align:center;color:#666;padding:40px">No approved yet<br><small>Balance: KES '+getUpdatedBalance()+'</small></div>';
    ap.forEach(j=>{
      html+=`<div class="card-approved"><div class="confetti"><span style="left:10%">🎉</span><span style="left:30%">💰</span><span style="left:50%">✨</span><span style="left:70%">🎊</span><span style="left:90%">💸</span></div><div style="display:flex;justify-content:space-between"><span class="badge-approved">✅ APPROVED! 🎉</span><span style="background:#000;padding:5px 10px;border-radius:99px;border:1px solid #00e676;color:#00e676;font-weight:900">+ KES ${j.earn}</span></div><div style="margin-top:10px"><b>${j.title}</b><br><small style="color:#7bffa3">Approved: ${new Date(j.reviewedAt).toLocaleString()}</small></div><div style="background:rgba(0,0,0,0.5);padding:10px;border-radius:10px;margin-top:10px"><small style="color:#00e676;font-weight:900">💬 Admin:</small><br>${escapeHtml(j.feedback||'Excellent!')}</div><div style="margin-top:10px;background:linear-gradient(135deg,#00e676,#00c853);color:#000;padding:12px;border-radius:12px;text-align:center;font-weight:900">💰 KES ${j.earn} ADDED! 🎉 | Total: KES ${getUpdatedBalance()}</div></div>`;
    });
  }
  if(tab==='rejected'){
    if(!re.length) html='<div style="text-align:center;color:#666;padding:40px">No rejected</div>';
    re.forEach(j=>{
      html+=`<div class="card-rejected"><div style="display:flex;justify-content:space-between"><span class="badge-rejected">❌ REJECTED</span><span style="background:#000;padding:5px 10px;border-radius:99px;border:1px solid #ff1744;color:#ff7b7b;font-size:10px">KES ${j.earn}</span></div><div style="margin-top:10px"><b>${j.title}</b><br><small style="color:#ff7b7b">Reviewed: ${new Date(j.reviewedAt).toLocaleString()}</small></div><div style="background:rgba(0,0,0,0.5);padding:10px;border-radius:10px;margin-top:10px"><small style="color:#ff1744;font-weight:900">📝 Feedback:</small><br>${escapeHtml(j.feedback||'Improve')}</div></div>`;
    });
  }
  document.getElementById('list').innerHTML=html;
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function acceptJob(id){
  let lock=isJobLockedAnywhere(id);
  if(lock.locked){document.getElementById('lockedMsg').innerHTML=`Task is already in <b>${lock.where}</b><br><br>🔒 Already submitted. You cannot submit again.`;document.getElementById('pLocked').classList.add('show');return;}
  if(!confirm('Accept this task?')) return;
  let A=getA(); let idx=A.findIndex(x=>x.id===id); if(idx===-1) return;
  let job=A.splice(idx,1)[0]; localStorage.setItem(KEY, JSON.stringify(A));
  let D=getD(); if(!D.find(x=>x.id===job.id)) D.unshift(job); localStorage.setItem('DOING_'+email, JSON.stringify(D));
  document.getElementById('successMsg').innerHTML=`<b>${job.title}</b><br>KES ${job.earn} awarded!`;document.getElementById('pSuccess').classList.add('show');render();
}
function closeSuccess(){document.getElementById('pSuccess').classList.remove('show');setTab('doing');}
function viewAvail(id){let job=getA().find(x=>x.id===id); if(!job){let lock=isJobLockedAnywhere(id); if(lock.locked){document.getElementById('lockedMsg').innerHTML=`Already in <b>${lock.where}</b> - Locked`;document.getElementById('pLocked').classList.add('show');}return;}document.getElementById('vTitle').innerText=job.title+' - KES '+job.earn;document.getElementById('vText').innerText=job.original;document.getElementById('pView').classList.add('show');}
function uploadFromAvail(id){let lock=isJobLockedAnywhere(id); if(lock.locked){document.getElementById('lockedMsg').innerHTML=`Already <b>${lock.where}</b><br>🔒 Cannot submit twice`;document.getElementById('pLocked').classList.add('show');return;}let job=getA().find(x=>x.id===id); if(!job) return; if(!confirm('Accept "'+job.title+'" first?')) return; acceptJob(id);}
function viewDoing(i){let j=getD()[i];document.getElementById('vTitle').innerText=j.title;document.getElementById('vText').innerText=j.original;document.getElementById('pView').classList.add('show');}
function openSubmit(i){
  let j=getD()[i]; if(!j) return;
  if(getP().some(x=>x.id===j.id) || getH().some(x=>x.id===j.id)){
    document.getElementById('lockedMsg').innerHTML=`<b>${j.title}</b> is already submitted<br>🔒 Task has been already submitted - Cannot submit twice!`;document.getElementById('pLocked').classList.add('show');return;
  }
  selIdx=i; document.getElementById('sTitle').innerText=j.title; document.getElementById('sEdit').value=j.original;
  document.getElementById('btnDoSubmit').disabled=false; document.getElementById('btnDoSubmit').innerText='📤 SUBMIT FOR APPROVAL';
  document.getElementById('pSubmit').classList.add('show');
}
function doSubmit(){
  let btn=document.getElementById('btnDoSubmit');
  btn.disabled=true; btn.innerText='⏳ SUBMITTING... LOCKING...';
  let D=getD(); let job=D[selIdx];
  let txt=document.getElementById('sEdit').value.trim();
  if(!job || txt.length<10){ btn.disabled=false; btn.innerText='📤 SUBMIT FOR APPROVAL'; return alert('Edit properly'); }
  if(getP().some(x=>x.id===job.id)){ btn.disabled=false; document.getElementById('pSubmit').classList.remove('show'); document.getElementById('lockedMsg').innerHTML=`🔒 <b>Task has been already submitted!</b><br><br>This job is already in Awaiting. You cannot submit again.`;document.getElementById('pLocked').classList.add('show'); return; }
  if(getH().some(x=>x.id===job.id)){ btn.disabled=false; document.getElementById('pSubmit').classList.remove('show'); document.getElementById('lockedMsg').innerHTML=`🔒 <b>Already reviewed!</b><br>Check Approved/Rejected`;document.getElementById('pLocked').classList.add('show'); return; }
  let sub={id:job.id,title:job.title,desc:job.desc,original:job.original,proof:txt,earn:job.earn,userEmail:email,submittedAt:new Date().toISOString()};
  let P=getP(); P.unshift(sub); localStorage.setItem('PENDING_'+email, JSON.stringify(P));
  let GP=JSON.parse(localStorage.getItem('GLOBAL_PENDING')||'[]'); GP.unshift(sub); localStorage.setItem('GLOBAL_PENDING', JSON.stringify(GP));
  D.splice(selIdx,1); localStorage.setItem('DOING_'+email, JSON.stringify(D));
  document.getElementById('pSubmit').classList.remove('show');
  btn.disabled=false; btn.innerText='📤 SUBMIT FOR APPROVAL';
  document.getElementById('lockedMsg').innerHTML=`<b style="color:#00e676">${job.title} Submitted!</b><br><br>🔒 <b>Task has been already submitted</b> and is now LOCKED<br><br>⏳ Status: Awaiting Admin Approval<br>🚫 Submit button disabled - Cannot submit again`;
  document.getElementById('pLocked').classList.add('show');
  render();
}
init();
setInterval(()=>{ document.getElementById('bal').innerText = getUpdatedBalance(); }, 2000);
</script></body></html>
