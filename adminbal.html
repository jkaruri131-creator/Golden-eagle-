<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN - Edit User Balances</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',system-ui}
body{background:#070711;color:#fff;min-height:100vh;padding:16px}
h1{font-size:18px;text-align:center;margin:12px 0}
.search-box{max-width:700px;margin:0 auto;background:#111126;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:14px;display:flex;gap:8px}
.search-box input{flex:1;background:#070711;border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:12px;color:#fff;outline:none}
.search-box button{padding:12px 18px;border-radius:10px;border:none;background:linear-gradient(135deg,#2962ff,#448aff);color:#fff;font-weight:800;cursor:pointer}
.list{max-width:700px;margin:16px auto;display:flex;flex-direction:column;gap:12px}
.user-card{background:linear-gradient(135deg,#1a1a35,#12122a);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:16px}
.user-card h3{font-size:13px;color:#facc15}
.user-card small{color:#8b8ba7;font-size:10px;word-break:break-all}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.field{background:#070711;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px}
.field label{font-size:8px;letter-spacing:1px;color:#5a5a78;font-weight:800;display:block;margin-bottom:4px}
.field input{width:100%;background:transparent;border:none;color:#fff;font-size:14px;font-weight:800;outline:none}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{flex:1;padding:12px;border-radius:10px;border:none;font-weight:800;cursor:pointer}
.btn-save{background:linear-gradient(135deg,#00c853,#00e676);color:#042e16}
.btn-reset{background:rgba(255,255,255,0.06);color:#8b8ba7;border:1px solid rgba(255,255,255,0.1)!important}
.ok{color:#4ade80;font-size:11px;margin-top:8px;display:none}
</style>
</head>
<body>
<h1>💎 ADMIN - EDIT USER WALLET 💎</h1>
<div class="search-box">
<input id="searchEmail" placeholder="Search user email e.g. user@gmail.com">
<button onclick="searchUser()">Search</button>
<button onclick="loadAll()" style="background:linear-gradient(135deg,#ff8c00,#ffb700);color:#111">All Users</button>
</div>
<div class="list" id="list"><div style="text-align:center;color:#5a5a78;padding:40px">Loading users...</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, setDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyB6QxzDFhIIHwt6TTZla6g4m-FaJdMol6M",
  authDomain: "diamines-agencies.firebaseapp.com",
  projectId: "diamines-agencies",
  storageBucket: "diamines-agencies.firebasestorage.app",
  messagingSenderId: "438413306857",
  appId: "1:438413306857:web:3c7f736794be6a49b0f978"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allUsers = [];
let renderedUsers = []; // ✅ FIX: stores exactly what you see on screen

async function loadAll(){
  document.getElementById('list').innerHTML = '<div style="text-align:center;color:#5a5a78;padding:20px">Loading...</div>';
  let snap = await getDocs(collection(db, "users"));
  allUsers = [];
  snap.forEach(d=>{ allUsers.push({id:d.id, ...d.data()}); });
  render(allUsers);
}
window.loadAll = loadAll;

function render(users){
  renderedUsers = users; // ✅ CRITICAL: save the visible list
  if(!users.length){ document.getElementById('list').innerHTML='<div style="text-align:center;color:#8b8ba7;padding:30px">No users found</div>'; return; }
  let html='';
  users.forEach((u, idx)=>{
    let email = (u.email||u.id||'').toLowerCase();
    html+=`<div class="user-card" id="card-${idx}">
      <h3>👤 ${email}</h3>
      <small>UID: ${u.id} | Username: ${u.username||u.userName||''}</small>
      <div class="grid">
        <div class="field"><label>💳 TOTAL DEPOSIT</label><input id="dep-${idx}" type="number" value="${Number(u.totalDeposit||0)}"></div>
        <div class="field"><label>💎 ACCOUNT BALANCE</label><input id="bal-${idx}" type="number" value="${Number(u.balance||u.accountBalance||u.wallet||0)}"></div>
        <div class="field"><label>🏦 TOTAL WITHDRAWALS</label><input id="wit-${idx}" type="number" value="${Number(u.totalWithdraw||u.totalWithdrawn||0)}"></div>
        <div class="field"><label>👥 REFERRAL COMMISSION</label><input id="ref-${idx}" type="number" value="${Number(u.refCommission||u.referralCommission||0)}"></div>
      </div>
      <div class="btns">
        <button class="btn-save" onclick="saveUser(${idx})">💾 SAVE CHANGES</button>
        <button class="btn-reset" onclick="resetZero(${idx})">Reset to 0</button>
      </div>
      <div class="ok" id="ok-${idx}">✅ Saved successfully! User sees instantly.</div>
    </div>`;
  });
  document.getElementById('list').innerHTML = html;
}

window.searchUser = async ()=>{
  let q = document.getElementById('searchEmail').value.trim().toLowerCase();
  if(!q){ loadAll(); return; }
  let filtered = allUsers.filter(u=> (u.email||u.id||'').toLowerCase().includes(q));
  if(filtered.length){ render(filtered); return; }
  try{
    let snap = await getDoc(doc(db, "users", q));
    if(snap.exists()){ render([{id:snap.id, ...snap.data()}]); return; }
  }catch{}
  try{
    let qsnap = await getDocs(query(collection(db,"users"), where("email","==",q)));
    let arr=[]; qsnap.forEach(d=>arr.push({id:d.id, ...d.data()}));
    render(arr);
  }catch{ render([]); }
};

window.saveUser = async (idx)=>{
  let dep = Number(document.getElementById(`dep-${idx}`).value||0);
  let bal = Number(document.getElementById(`bal-${idx}`).value||0);
  let wit = Number(document.getElementById(`wit-${idx}`).value||0);
  let ref = Number(document.getElementById(`ref-${idx}`).value||0);
  
  // ✅ FIXED: use renderedUsers not allUsers
  let rawUser = renderedUsers[idx];
  if(!rawUser){ alert("User not found, reload"); return; }
  let email = String(rawUser.email||rawUser.id||"").toLowerCase().trim();
  let docId = String(rawUser.id||email).trim();

  if(!email){ alert("No email found"); return; }
  if(bal < 0) bal = 0;

  try{
    let payload = {
      totalDeposit: dep,
      balance: bal,
      accountBalance: bal,
      wallet: bal,
      totalWithdraw: wit,
      totalWithdrawn: wit,
      refCommission: ref,
      referralCommission: ref,
      email: email,
      updatedAt: new Date().toISOString(),
      updatedByAdmin: true
    };

    await setDoc(doc(db, "users", docId), payload, { merge: true });
    if(docId !== email){
      await setDoc(doc(db, "users", email), payload, { merge: true });
    }
    await setDoc(doc(db, "wallets", email), { balance: bal, totalDeposit: dep, updatedAt: new Date().toISOString() }, { merge: true });

    // keep allUsers in sync
    let allIdx = allUsers.findIndex(u => (u.id===rawUser.id) || ((u.email||"").toLowerCase()===email));
    if(allIdx>=0){
      allUsers[allIdx].balance = bal;
      allUsers[allIdx].totalDeposit = dep;
      allUsers[allIdx].totalWithdraw = wit;
      allUsers[allIdx].refCommission = ref;
    }

    let ok = document.getElementById(`ok-${idx}`);
    ok.style.display='block';
    ok.innerText = `✅ Saved! ${email} now has KES ${bal.toLocaleString()} - Dashboard updates instantly`;
    setTimeout(()=>ok.style.display='none', 4000);
    
  }catch(e){
    alert("Error: "+e.message);
    console.error(e);
  }
};

window.resetZero = (idx)=>{
  document.getElementById(`dep-${idx}`).value=0;
  document.getElementById(`bal-${idx}`).value=0;
  document.getElementById(`wit-${idx}`).value=0;
  document.getElementById(`ref-${idx}`).value=0;
};

loadAll();
</script>
</body>
  </html>
