<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Withdrawals</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#070711;color:#fff;padding:14px;max-width:800px;margin:0 auto}
.input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin-bottom:12px}
.card{background:linear-gradient(135deg,#1a1a35,#12122a);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.btn{padding:8px 14px;border-radius:8px;border:none;font-weight:700;cursor:pointer;margin-left:6px;font-size:12px}
.approve{background:linear-gradient(135deg,#00e676,#00c853);color:#000}
.reject{background:linear-gradient(135deg,#ff1744,#ff4d8d);color:#fff}
.badge{font-size:9px;padding:4px 8px;border-radius:6px;font-weight:800}
.pending{background:#7a4a00;color:#facc15}
.approved{background:#064e3b;color:#22c55e}
.rejected{background:#4a0a0a;color:#ff4d8d}
/* DECORATED MODAL */
.stk{position:fixed;inset:0;background:rgba(0,0,0,0.88);backdrop-filter:blur(12px);z-index:99;display:none;align-items:center;justify-content:center;padding:20px}
.stk.show{display:flex}
.stk-card{background:linear-gradient(180deg,#1e1e3f,#12122a);border-radius:20px;padding:22px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
</style>
</head>
<body>
<h2>💎 DIAMINES - Withdraw Approvals</h2>
<p style="font-size:11px;color:#8b8ba7;margin-bottom:10px">Balance deducted on request. Approve to pay, Reject to refund.</p>
<input id="search" class="input" placeholder="Search email, phone, ID, amount..." oninput="render()">
<div style="display:flex;gap:8px;margin-bottom:12px">
<button onclick="filter='all';render()" style="padding:6px 12px;border-radius:20px;border:1px solid #333;background:#1a1a35;color:#fff;font-size:11px">All</button>
<button onclick="filter='pending';render()" style="padding:6px 12px;border-radius:20px;border:1px solid #facc15;background:#1a1600;color:#facc15;font-size:11px">Pending</button>
<button onclick="filter='approved';render()" style="padding:6px 12px;border-radius:20px;border:1px solid #22c55e;background:#002a12;color:#22c55e;font-size:11px">Approved</button>
</div>
<div id="list"></div>

<div class="stk" id="modal"><div class="stk-card" id="modalCard"></div></div>

<script>
let filter='all';
function render(){
 let q=document.getElementById("search").value.toLowerCase();
 let all=JSON.parse(localStorage.getItem("DIAMINES_WITHDRAW_ALL")||"[]").reverse();
 let html="";
 all.filter(w=>{
  if(filter!=='all'&&w.status!==filter) return false;
  let s=(w.email+" "+w.phone+" "+w.id+" "+w.amount+" "+w.status).toLowerCase();
  return s.includes(q);
 }).forEach(w=>{
  html+=`<div class="card">
   <div><b style="font-size:14px">KES ${w.amount}</b> <span class="badge ${w.status}">${w.status.toUpperCase()}</span><br>
   <small style="color:#8b8ba7">${w.email}<br>📱 ${w.phone} via ${w.method.toUpperCase()} | <b style="color:#facc15">${w.id}</b><br>${w.date}</small></div>
   <div>${w.status==='pending'?`<button class="btn approve" onclick="approve('${w.id}')">✓ PAY</button><button class="btn reject" onclick="reject('${w.id}')">✕ REJECT</button>`:'✓ DONE'}</div>
  </div>`;
 });
 document.getElementById("list").innerHTML=html||"<p style='text-align:center;color:#555;margin-top:20px'>No withdrawals</p>";
}
function approve(id){
 let all=JSON.parse(localStorage.getItem("DIAMINES_WITHDRAW_ALL")||"[]");
 let w=all.find(x=>x.id===id); if(!w) return;
 if(!confirm("Approve withdrawal?\n"+w.email+"\nKES "+w.amount+" to "+w.phone+"\n\nMake sure you have sent M-Pesa!")) return;
 w.status="approved";
 localStorage.setItem("DIAMINES_WITHDRAW_ALL", JSON.stringify(all));
 // ADD TO TOTAL WITHDRAWN (balance already deducted)
 let tot=Number(localStorage.getItem("DIAMINES_TOTAL_WITHDRAW_"+w.email)||0)+w.amount;
 localStorage.setItem("DIAMINES_TOTAL_WITHDRAW_"+w.email, String(tot));
 showModal(`<div style="width:60px;height:60px;margin:0 auto 10px;border-radius:16px;background:linear-gradient(135deg,#00e676,#00c853);display:flex;align-items:center;justify-content:center;font-size:28px">✅</div><h3 style="color:#00e676">Withdrawal Approved!</h3><p style="font-size:12px;color:#8b8ba7;margin-top:6px">KES ${w.amount} paid to ${w.phone}<br>ID ${w.id}</p>`, "#00e676");
 render();
}
function reject(id){
 let all=JSON.parse(localStorage.getItem("DIAMINES_WITHDRAW_ALL")||"[]");
 let w=all.find(x=>x.id===id); if(!w) return;
 if(!confirm("Reject and REFUND balance?\nKES "+w.amount+" to "+w.email)) return;
 w.status="rejected";
 localStorage.setItem("DIAMINES_WITHDRAW_ALL", JSON.stringify(all));
 // REFUND BALANCE
 let bal=Number(localStorage.getItem("DIAMINES_BAL_"+w.email)||0)+w.amount;
 localStorage.setItem("DIAMINES_BAL_"+w.email, String(bal));
 showModal(`<div style="width:60px;height:60px;margin:0 auto 10px;border-radius:16px;background:linear-gradient(135deg,#ff4d8d,#ff1744);display:flex;align-items:center;justify-content:center;font-size:28px">↩️</div><h3 style="color:#ff4d8d">Rejected & Refunded</h3><p style="font-size:12px;color:#8b8ba7;margin-top:6px">KES ${w.amount} refunded to ${w.email}</p>`, "#ff4d8d");
 render();
}
function showModal(html,color){
 document.getElementById("modalCard").innerHTML=html+`<button onclick="document.getElementById('modal').classList.remove('show')" style="margin-top:14px;width:100%;padding:10px;border-radius:10px;border:none;background:${color};color:#000;font-weight:800">CLOSE</button>`;
 document.getElementById("modalCard").style.border="1px solid "+color;
 document.getElementById("modal").classList.add("show");
}
render();
</script>
</body>
</html>
