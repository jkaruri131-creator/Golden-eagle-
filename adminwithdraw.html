<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Withdrawals - FIXED 1x NO API</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#070711;color:#fff;padding:14px;max-width:800px;margin:0 auto}
.input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin-bottom:12px}
.card{background:linear-gradient(135deg,#1a1a35,#12122a);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.btn{padding:8px 14px;border-radius:8px;border:none;font-weight:700;cursor:pointer;margin-left:6px;font-size:12px}
.approve{background:linear-gradient(135deg,#00e676,#00c853);color:#000}
.reject{background:linear-gradient(135deg,#ff1744,#ff4d8d);color:#fff}
.badge{font-size:9px;padding:4px 8px;border-radius:6px;font-weight:800}
.pending{background:#7a4a00;color:#facc15}
.approved{background:#064e3b;color:#22c55e}
.rejected{background:#4a0a0a;color:#ff4d8d}
.stk{position:fixed;inset:0;background:rgba(0,0,0,0.88);backdrop-filter:blur(12px);z-index:99;display:none;align-items:center;justify-content:center;padding:20px}
.stk.show{display:flex}
.stk-card{background:linear-gradient(180deg,#1e1e3f,#12122a);border-radius:20px;padding:22px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
</style>
</head>
<body>
<h2>💎 DIAMINES - Withdraw Approvals - OLD FLOW</h2>
<p style="font-size:11px;color:#8b8ba7;margin-bottom:6px">✅ No API - Manual M-Pesa - Approve adds to user's totalWithdrawals</p>
<div style="background:rgba(0,230,118,0.08);border:1px solid rgba(0,230,118,0.2);border-radius:10px;padding:8px;font-size:11px;color:#22c55e;margin-bottom:10px">💰 Profit (10%): <b id="totalProfit">KES 0</b> • Pending: <b id="totalPending" style="color:#facc15">KES 0</b> • Mode: <b style="color:#facc15">MANUAL - No Paystack</b></div>
<input id="search" class="input" placeholder="Search email, phone, ID, amount..." oninput="render()">
<div style="display:flex;gap:8px;margin-bottom:12px">
<button onclick="filter='all';render()" style="padding:6px 12px;border-radius:20px;border:1px solid #333;background:#1a1a35;color:#fff;font-size:11px">All</button>
<button onclick="filter='pending';render()" style="padding:6px 12px;border-radius:20px;border:1px solid #facc15;background:#1a1600;color:#facc15;font-size:11px">Pending</button>
<button onclick="filter='approved';render()" style="padding:6px 12px;border-radius:20px;border:1px solid #22c55e;background:#002a12;color:#22c55e;font-size:11px">Approved</button>
</div>
<div id="list"></div>
<div class="stk" id="modal"><div class="stk-card" id="modalCard"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, getDoc, increment, query, where, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyB6QxDFhIIHwt6TTZla6g4m-FaJdMol6M",
  authDomain: "diamines-agencies.firebaseapp.com",
  projectId: "diamines-agencies",
  storageBucket: "diamines-agencies.firebasestorage.app",
  messagingSenderId: "438413306857",
  appId: "1:438413306857:web:3c7f736794be6a49b0f978"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let filter='all';
let allWithdrawals = [];

async function loadFirebase(){
  try{
    let snap = await getDocs(collection(db, "withdrawals"));
    let map = new Map();
    snap.forEach(d=>{
      let data = d.data();
      let uniqueId = (data.id || d.id || '').toString();
      // DEDUPE: 1 transaction = 1 row only
      if(!map.has(uniqueId)){
        map.set(uniqueId, {firestoreId:d.id, ...data});
      }
    });
    allWithdrawals = Array.from(map.values());
    allWithdrawals.sort((a,b)=> new Date(b.date||b.createdAt||0) - new Date(a.date||a.createdAt||0));
  }catch(e){ console.log(e); }
}

window.render = async ()=>{
 if(allWithdrawals.length===0) await loadFirebase();
 let q=document.getElementById("search").value.toLowerCase();
 let profit = 0; let pendingPayout = 0;
 allWithdrawals.forEach(w=>{ 
   let req = Number(w.requestedAmount||w.amount||0);
   let fee = w.fee!==undefined ? Number(w.fee) : Math.floor(req*0.10);
   if(w.status==='approved') profit += fee; 
   if(w.status==='pending') pendingPayout += (w.receiveAmount|| (req-fee)); 
 });
 document.getElementById("totalProfit").innerText = "KES "+profit.toLocaleString();
 document.getElementById("totalPending").innerText = "KES "+pendingPayout.toLocaleString();

 let html="";
 allWithdrawals.filter(w=>{
  if(filter!=='all'&&w.status!==filter) return false;
  let s=(w.email+" "+w.phone+" "+(w.id||"")+" "+(w.requestedAmount||w.amount)+" "+w.status).toLowerCase();
  return s.includes(q);
 }).forEach(w=>{
  let req = Number(w.requestedAmount||w.amount||0);
  let fee = w.fee!==undefined ? Number(w.fee) : Math.floor(req*0.10);
  let rec = w.receiveAmount!==undefined ? Number(w.receiveAmount) : req - fee;
  html+=`<div class="card">
   <div><b style="font-size:14px">KES ${req}</b> <span class="badge ${w.status}">${(w.status||'pending').toUpperCase()}</span><br>
   <small style="color:#8b8ba7">${w.email}<br>📱 ${w.phone||'No phone'} | <b style="color:#facc15">${w.id||w.firestoreId?.slice(0,8)}</b><br>${w.date||w.createdAt||''}</small>
   <div style="margin-top:6px;background:rgba(0,0,0,0.4);border-radius:8px;padding:6px;font-size:10px;line-height:1.4">
   <span style="color:#8b8ba7">Requested:</span> <b>KES ${req}</b><br>
   <span style="color:#ff4d8d">Fee 10%:</span> <b style="color:#ff4d8d">KES ${fee}</b><br>
   <span style="color:#22c55e">User Receives:</span> <b style="color:#22c55e">KES ${rec}</b>
   </div>
   </div>
   <div>${w.status==='pending'?`<button class="btn approve" onclick="approve('${w.firestoreId}')">✓ APPROVE</button><button class="btn reject" onclick="reject('${w.firestoreId}')">✕ REJECT</button>`:'✓ DONE'}</div>
  </div>`;
 });
 document.getElementById("list").innerHTML=html||"<p style='text-align:center;color:#555;margin-top:20px'>No withdrawals</p>";
}

// OLD FLOW: Approve = add to user's totalWithdrawals, user dashboard shows it
window.approve = async (fid)=>{
 let w = allWithdrawals.find(x=>x.firestoreId===fid);
 if(!w) return;
 let req = Number(w.requestedAmount||w.amount||0);
 let email = String(w.email||"").toLowerCase().trim();
 if(!confirm(`APPROVE WITHDRAWAL?\n\nUser: ${w.email}\nAmount: KES ${req}\n\nThis will add KES ${req} to his Total Withdrawals in dashboard.\nYou will pay him manually via M-Pesa.\n\nContinue?`)) return;
 
 try{
   // 1. Update withdrawal status
   await updateDoc(doc(db, "withdrawals", fid), {
     status:"approved", 
     approvedAt: new Date().toISOString(),
     approvedByAdmin: true
   });
   
   // 2. OLD FLOW: Increment user's totalWithdraw / totalWithdrawn
   // This is what user sees in dashboard as "Total Withdrawals"
   let userDocId = w.uid || email;
   try{
     // Try direct doc ID = email (your system)
     let uSnap = await getDoc(doc(db, "users", email));
     if(uSnap.exists()){
       await updateDoc(doc(db, "users", email), { 
         totalWithdraw: increment(req), 
         totalWithdrawn: increment(req),
         totalWithdrawals: increment(req)
       });
     } else {
       // Search by email field
       let qy = query(collection(db,"users"), where("email","==", email));
       let qsnap = await getDocs(qy);
       for(let u of qsnap.docs){
         await updateDoc(doc(db, "users", u.id), { 
           totalWithdraw: increment(req), 
           totalWithdrawn: increment(req),
           totalWithdrawals: increment(req)
         });
       }
     }
   }catch(e){ console.log("User update error", e); }

   // 3. Also update wallet doc if exists
   try{
     await setDoc(doc(db, "wallets", email), { 
       totalWithdraw: increment(req),
       lastWithdrawAt: new Date().toISOString()
     }, {merge:true});
   }catch{}

   w.status="approved";
   showModal(`<div style="width:60px;height:60px;margin:0 auto 10px;border-radius:16px;background:linear-gradient(135deg,#00e676,#00c853);display:flex;align-items:center;justify-content:center;font-size:28px">✅</div><h3 style="color:#00e676">APPROVED!</h3><p style="font-size:12px;color:#fff">KES ${req} added to ${email}<br>Total Withdrawals updated<br>Now pay manually via M-Pesa</p>`, "#00e676");

 }catch(err){
   showModal(`<div style="width:60px;height:60px;margin:0 auto 10px;border-radius:16px;background:#4a0a0a;display:flex;align-items:center;justify-content:center;font-size:28px">❌</div><h3 style="color:#ff4d8d">Error</h3><p style="font-size:11px;color:#fff">${err.message}</p>`, "#ff4d8d");
 }
 render();
}

window.reject = async (fid)=>{
 let w = allWithdrawals.find(x=>x.firestoreId===fid);
 if(!w) return;
 let req = Number(w.requestedAmount||w.amount||0);
 let email = String(w.email||"").toLowerCase().trim();
 if(!confirm("REJECT & REFUND?\n\nRefund KES "+req+" to "+email+" balance?")) return;

 try{
   await updateDoc(doc(db, "withdrawals", fid), {status:"rejected", rejectedAt: new Date().toISOString()});
   
   // Refund balance to user (since you deducted on request)
   try{
     let uSnap = await getDoc(doc(db, "users", email));
     if(uSnap.exists()){
       await updateDoc(doc(db, "users", email), { balance: increment(req), accountBalance: increment(req), wallet: increment(req) });
     } else {
       let qy = query(collection(db,"users"), where("email","==", email));
       let qsnap = await getDocs(qy);
       for(let u of qsnap.docs){
         await updateDoc(doc(db, "users", u.id), { balance: increment(req), accountBalance: increment(req), wallet: increment(req) });
       }
     }
   }catch(e){}

   w.status="rejected";
   showModal(`<div style="width:60px;height:60px;margin:0 auto 10px;border-radius:16px;background:linear-gradient(135deg,#ff4d8d,#ff1744);display:flex;align-items:center;justify-content:center;font-size:28px">↩️</div><h3 style="color:#ff4d8d">Rejected & Refunded</h3><p style="font-size:12px;color:#8b8ba7">KES ${req} refunded to balance</p>`, "#ff4d8d");
 }catch(err){
   showModal(`❌ ${err.message}`, "#ff4d8d");
 }
 render();
}

function showModal(html,color){
 document.getElementById("modalCard").innerHTML=html+`<button onclick="document.getElementById('modal').classList.remove('show')" style="margin-top:14px;width:100%;padding:10px;border-radius:10px;border:none;background:${color};color:#000;font-weight:800">CLOSE</button>`;
 document.getElementById("modalCard").style.border="1px solid "+color;
 document.getElementById("modal").classList.add("show");
}
render();
</script>
</body>
                                                                                                                                                                                                                            </html>
