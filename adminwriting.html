<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, deleteDoc, collection, getDocs, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB6QxzDFhIIHwt6TTZla6g4m-FaJdMol6M",authDomain:"diamines-agencies.firebaseapp.com",projectId:"diamines-agencies",storageBucket:"diamines-agencies.firebasestorage.app",messagingSenderId:"438413306857",appId:"1:438413306857:web:3c7f736794be6a49b0f978"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.db = db; window.fbSetDoc = setDoc; window.fbDeleteDoc = deleteDoc; window.fbDoc = doc; window.fbGetDoc = getDoc; window.fbCollection = collection; window.fbGetDocs = getDocs; window.fbOnSnapshot = onSnapshot;
window.fbOnSnapshot(window.fbCollection(window.db, "writingPending"), ()=>{ loadListLive(); });
window.fbOnSnapshot(window.fbCollection(window.db, "writingTaken"), ()=>{ loadListLive(); });
</script>

<script>
let pending=[],cur=null, pendingAction=null, pendingWithFb=false;
const KEY_GLOBAL='DIAMINES_WRITING_PENDING_GLOBAL';
const CACHE_PENDING='DIAMINES_WRITING_PENDING_CACHE';
function getPending(){try{return JSON.parse(localStorage.getItem(KEY_GLOBAL)||'[]')}catch{return[]}}
function getCachedPending(){try{return JSON.parse(localStorage.getItem(CACHE_PENDING)||'[]')}catch{return[]}}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='pageList')loadList()}
function toggleBox(id){document.getElementById(id).classList.toggle('show')}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function closePopups(){document.querySelectorAll('.popup-bg').forEach(p=>p.classList.remove('show'))}
async function loadListLive(){ await loadList(); }
async function loadList(){
  let cached = getCachedPending();
  if(cached.length){ pending=cached; renderPending(cached, true); }
  else { pending=getPending(); renderPending(pending, true); }
  try{
    document.getElementById('syncStatus').innerText="⏳ Syncing ALL users from Firebase...";
    let snapPending = await window.fbGetDocs(window.fbCollection(window.db, "writingPending"));
    let fbPending=[]; snapPending.forEach(d=>{ let v=d.data(); if(v.written||v.proof) fbPending.push({...v, _id:d.id, _src:'pending'}); });
    let snapTaken = await window.fbGetDocs(window.fbCollection(window.db, "writingTaken"));
    let fbTaken=[]; snapTaken.forEach(d=>{ let v=d.data(); if(v.status==='submitted' && (v.written||v.proof)) fbTaken.push({...v, _id:d.id, _src:'taken', submittedAt: v.submittedAt || v.takenAt, earn: v.price||v.earn }); });
    let merged = [...fbPending];
    fbTaken.forEach(t=>{ if(!merged.find(m=> (m.jobId===t.jobId && m.userEmail===t.userEmail) || String(m.submittedAt)===String(t.submittedAt) )){ merged.push(t); } });
    let local = getPending().filter(l=> l.written || l.proof);
    local.forEach(l=>{ if(!merged.find(m=> String(m.submittedAt)===String(l.submittedAt) )){ merged.push(l); } });
    merged.sort((a,b)=> new Date(b.submittedAt||b.takenAt) - new Date(a.submittedAt||a.takenAt));
    if(merged.length>0){
      localStorage.setItem(CACHE_PENDING, JSON.stringify(merged));
      localStorage.setItem(KEY_GLOBAL, JSON.stringify(merged));
      pending=merged; renderPending(merged, false);
      document.getElementById('syncStatus').innerText="✅ LIVE: "+merged.length+" pending from ALL users 🌍";
    } else {
      document.getElementById('syncStatus').innerText="✅ Synced - "+pending.length+" pending";
      if(pending.length===0) renderPending([], false);
    }
  }catch(e){ document.getElementById('syncStatus').innerText="❌ Firebase error: "+e.message; }
}
function renderPending(list, isCache){
  document.getElementById('cnt').innerText=list.length;
  let html='';list.forEach((j,i)=>{html+=`<div class="job"><div style="display:flex;justify-content:space-between"><b>✍️ ${esc(j.title)}</b><b style="color:#4ade80;background:rgba(34,197,94,0.15);border:1px solid #22c55e;padding:4px 10px;border-radius:99px">KES ${j.earn||j.price}</b></div><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><span class="badge">👤 ${esc(j.userEmail||j.takenBy)}</span><span class="badge" style="background:rgba(255,255,255,0.06)">ID:${esc((j.submittedAt||'').toString().substring(0,13))}</span><span class="badge">${esc(j.words||'')}</span><span class="badge" style="background:rgba(34,197,94,0.1)">${j._src==='taken'?'LIVE':'PENDING'}</span></div><small style="color:#666;font-size:9px">${j.submittedAt?new Date(j.submittedAt).toLocaleString():''}</small><div style="margin-top:8px;display:flex;gap:6px"><button class="btn" style="width:48%;background:#1a102a;color:#c084fc;border:1px solid #a855f7;padding:9px" onclick="toggleBox('o_${i}')">📋 BRIEF</button><button class="btn" style="width:48%;background:#001a0a;color:#7bffa3;border:1px solid #22c55e;padding:9px" onclick="toggleBox('e_${i}')">📄 ARTICLE</button></div><div id="o_${i}" class="box">${esc(j.original||j.topic||j.brief||'')}</div><div id="e_${i}" class="box">${esc(j.proof||j.written||'')}</div><button class="btn btn-y" onclick="openReview(${i})">✍️ REVIEW → PAY EXACT KES ${j.earn||j.price}</button></div>`});
  if(!html)html=`<div style="text-align:center;padding:60px 20px;color:#4b5563"><div style="font-size:50px">🎉</div><b>No pending writing jobs</b><br><small style="color:#666">When users submit from writing.html, they appear here instantly 🌍</small>${isCache?'<br><small>Syncing...</small>':''}</div>`;
  document.getElementById('list').innerHTML=html;
}
function openReview(i){cur=pending[i];document.getElementById('reviewDetails').innerHTML=`<div class="job"><div style="display:flex;justify-content:space-between"><b>${esc(cur.title)}</b><b style="color:#4ade80">EXACT KES ${cur.earn||cur.price}</b></div><div style="margin-top:6px"><span class="badge">👤 ${esc(cur.userEmail||cur.takenBy)}</span> <small style="color:#666">ID:${esc((cur.submittedAt||'').toString())}</small></div><div style="margin-top:4px"><span class="badge">${esc(cur.words||'')} • ${esc(cur.level||'')}</span></div><div style="margin-top:8px;display:flex;gap:6px"><button class="btn" style="width:48%;background:#1a102a;color:#c084fc;border:1px solid #a855f7;padding:9px" onclick="toggleBox('ro')">📋 BRIEF</button><button class="btn" style="width:48%;background:#001a0a;color:#7bffa3;border:1px solid #22c55e;padding:9px" onclick="toggleBox('re')">📄 ARTICLE</button></div><div id="ro" class="box">${esc(cur.original||cur.topic||'')}</div><div id="re" class="box show" style="border-color:#22c55e">${esc(cur.proof||cur.written||'')}</div><div style="background:rgba(168,85,247,0.08);border:1px dashed rgba(168,85,247,0.3);border-radius:12px;padding:10px;margin-top:10px;text-align:center"><small style="color:#a855f7;font-weight:800">💰 EXACT PAYMENT - WILL PAY THIS EXACT</small><br><b style="font-size:22px;color:#4ade80">KES ${cur.earn||cur.price}</b><br><small style="color:#9ca3af">Extracted: KES <b id="exactShow">${Number(String(cur.earn||cur.price||0).replace(/[^0-9]/g,''))||0}</b></small></div></div>`;document.getElementById('fbBox').value=cur.adminFeedback||'';showPage('pageReview');}
async function removeCur(){
  let all=getPending().filter(x=>String(x.submittedAt)!==String(cur.submittedAt));
  localStorage.setItem(KEY_GLOBAL,JSON.stringify(all)); localStorage.setItem(CACHE_PENDING,JSON.stringify(all));
  try{
    if(cur._id) await window.fbDeleteDoc(window.fbDoc(window.db, "writingPending", String(cur._id)));
    try{ await window.fbDeleteDoc(window.fbDoc(window.db, "writingPending", String(cur.submittedAt))); }catch{}
    try{ await window.fbDeleteDoc(window.fbDoc(window.db, "writingPending", String(cur.jobId))); }catch{}
    try{ await window.fbDeleteDoc(window.fbDoc(window.db, "writingPending", String(cur.jobId)+"_"+(cur.userEmail||cur.takenBy||''))); }catch{}
    if(cur.jobId){
      try{ await window.fbDeleteDoc(window.fbDoc(window.db, "writingTaken", String(cur.jobId))); }catch{}
      try{ await window.fbDeleteDoc(window.fbDoc(window.db, "writingTaken", String(cur.jobId)+"_"+(cur.userEmail||cur.takenBy||''))); }catch{}
      try{ await window.fbDeleteDoc(window.fbDoc(window.db, "writingTaken", String(cur._id))); }catch{}
    }
  }catch(e){}
}
async function payExact(email,earn,submittedAt){
 email=email.toLowerCase().trim();
 earn = Number(String(earn).replace(/[^0-9.]/g,''))||0;
 if(earn<=0){ alert("❌ Invalid amount! Raw: "+(cur.earn||cur.price)); return null; }
 submittedAt=String(submittedAt);
 const BAL_KEY='DIAMINES_BAL_'+email;
 const PAID_KEY='DIAMINES_PAID_WRITING_'+email;
 let paidList=JSON.parse(localStorage.getItem(PAID_KEY)||'[]');
 if(paidList.includes(submittedAt)){alert('⚠️ Already paid ID '+submittedAt);return null;}
 let currentBal=0;
 try{
   let snap = await window.fbGetDoc(window.fbDoc(window.db, "users", email));
   if(snap.exists()) currentBal = Number(String(snap.data().balance||0).replace(/[^0-9.]/g,''))||0;
   let snapW = await window.fbGetDoc(window.fbDoc(window.db, "wallets", email));
   if(snapW.exists()){ let wb=Number(String(snapW.data().balance||0).replace(/[^0-9.]/g,''))||0; if(wb>currentBal) currentBal=wb; }
   let loc = Number(localStorage.getItem(BAL_KEY)||0)||0;
   if(loc>currentBal) currentBal=loc;
 }catch{ currentBal = Number(localStorage.getItem(BAL_KEY)||0)||0; }
 let newBal = currentBal + earn;
 localStorage.setItem(BAL_KEY,String(newBal));
 localStorage.setItem('BAL_'+email,String(newBal));
 localStorage.setItem('DIAMINES_BAL',String(newBal));
 localStorage.setItem('BAL',String(newBal));
 localStorage.setItem('DIAMINES_WALLET_'+email,String(newBal));
 localStorage.setItem('DIAMINES_BALANCE_'+email,String(newBal));
 localStorage.setItem('TOTAL_EARNED_'+email,String(newBal));
 localStorage.setItem('DIAMINES_TOTAL_EARNED_'+email,String(newBal));
 try{let sess=JSON.parse(localStorage.getItem('DIAMINES_CURRENT')||'null');if(sess&&sess.email&&sess.email.toLowerCase()===email){sess.balance=newBal;sess.wallet=newBal;localStorage.setItem('DIAMINES_CURRENT',JSON.stringify(sess));}}catch(e){}
 try{
   await window.fbSetDoc(window.fbDoc(window.db, "users", email), { balance: newBal, wallet: newBal, email: email, lastEarn: earn, lastEarnAt: new Date().toISOString() }, {merge:true});
   await window.fbSetDoc(window.fbDoc(window.db, "wallets", email), { balance: newBal, email: email, updatedAt: new Date().toISOString() }, {merge:true});
   await window.fbSetDoc(window.fbDoc(window.db, "balances", email), { balance: newBal, email: email }, {merge:true});
   await window.fbSetDoc(window.fbDoc(window.db, "transactions", email+"_"+Date.now()), { email: email, amount: earn, type: "writing_approved", title: cur.title, exactAmount: earn, balance: newBal, createdAt: new Date().toISOString() });
 }catch(err){}
 paidList.push(submittedAt);localStorage.setItem(PAID_KEY,JSON.stringify(paidList));
 localStorage.setItem('DIAMINES_LAST_PAYMENT',JSON.stringify({email,earn,newBal,type:'writing',time:Date.now()}));
 return newBal;
}

// ===== CONFIRM POPUP LOGIC - 100% EXCELLENT =====
window.confirmApprove=function(withFb){
  pendingWithFb=withFb;
  let fb=document.getElementById('fbBox').value.trim();
  if(withFb&&!fb){alert('Type feedback first for WITH feedback');return;}
  document.getElementById('approveText').innerHTML=`Do you really want to <b style="color:#4ade80">APPROVE</b> this job?<br><b>"${esc(cur.title)}"</b><br>It will move to <b>APPROVED</b> in your page AND writer's page instantly.`;
  document.getElementById('approvePrice').innerText=`KES ${cur.earn||cur.price}`;
  document.getElementById('approveUser').innerText=`👤 ${cur.userEmail||cur.takenBy}`;
  document.getElementById('pop-approve').classList.add('show');
}
window.confirmReject=function(withFb){
  pendingWithFb=withFb;
  let fb=document.getElementById('fbBox').value.trim();
  if(withFb&&!fb){alert('Type feedback first for WITH feedback');return;}
  document.getElementById('rejectText').innerHTML=`Do you really want to <b style="color:#f87171">REJECT</b> this job?<br><b>"${esc(cur.title)}"</b><br>It will move to <b>REJECTED</b> in your page AND writer's page instantly.`;
  document.getElementById('rejectUser').innerText=`👤 ${cur.userEmail||cur.takenBy}`;
  document.getElementById('pop-reject').classList.add('show');
}

window.doApprove=async function(){
  closePopups();
  let withFb=pendingWithFb;
  let fb=document.getElementById('fbBox').value.trim();
  if(withFb&&!fb)fb='Excellent writing! Approved KES '+(cur.earn||cur.price);
  if(!withFb)fb='Approved by admin. Great article! ✍️';
  let email=(cur.userEmail||cur.takenBy||'').toLowerCase();
  let rawEarn = cur.earn?? cur.price?? 0;
  let earn = Number(String(rawEarn).replace(/[^0-9.]/g,''))||0;
  let submittedAt=cur.submittedAt;
  if(earn<=0){ alert("❌ Invalid amount: "+rawEarn); return; }
  let curCopy={...cur};
  pending=pending.filter(x=>String(x.submittedAt)!==String(curCopy.submittedAt));
  renderPending(pending,false);
  showPage('pageList');
  let newBal=await payExact(email,earn,submittedAt);if(newBal===null){return;}
  let histKey='DIAMINES_WRITING_HISTORY_'+email;
  let hist=JSON.parse(localStorage.getItem(histKey)||'[]');
  hist.unshift({...curCopy,status:'approved',feedback:fb,reviewedAt:new Date().toISOString(),price:earn,earn:earn});
  localStorage.setItem(histKey,JSON.stringify(hist));
  try{
    let base={...curCopy, status:'approved', feedback:fb, reviewedAt:new Date().toISOString(), takenBy:email, userEmail:email, email:email, price:earn, earn:earn, updatedAt:new Date().toISOString()};
    await window.fbSetDoc(window.fbDoc(window.db,"writingTaken", String(curCopy.jobId||curCopy._id)), base, {merge:true});
    await window.fbSetDoc(window.fbDoc(window.db,"writingTaken", String(curCopy.jobId+"_"+email)), base, {merge:true});
    await window.fbSetDoc(window.fbDoc(window.db,"writingApproved", String(curCopy.submittedAt)), {...base, id:String(curCopy.submittedAt)}, {merge:true});
    await window.fbSetDoc(window.fbDoc(window.db,"writingApproved", String(curCopy.jobId+"_"+email)), base, {merge:true});
    await window.fbSetDoc(window.fbDoc(window.db,"writingSubmissions", String(curCopy.submittedAt)), {status:'approved', feedback:fb}, {merge:true});
  }catch(e){}
  await removeCur();
}
window.doReject=async function(){
  closePopups();
  let withFb=pendingWithFb;
  let fb=document.getElementById('fbBox').value.trim();
  if(withFb&&!fb){alert('Type feedback');return;}
  if(!withFb)fb='Rejected by admin. Please improve and resubmit.';
  let curCopy={...cur};
  pending=pending.filter(x=>String(x.submittedAt)!==String(curCopy.submittedAt));
  renderPending(pending,false);
  showPage('pageList');
  let email=(curCopy.userEmail||curCopy.takenBy||'').toLowerCase();
  let histKey='DIAMINES_WRITING_HISTORY_'+email;
  let hist=JSON.parse(localStorage.getItem(histKey)||'[]');
  hist.unshift({...curCopy,status:'rejected',feedback:fb,reviewedAt:new Date().toISOString()});
  localStorage.setItem(histKey,JSON.stringify(hist));
  try{
    let base={...curCopy, status:'rejected', feedback:fb, reviewedAt:new Date().toISOString(), takenBy:email, userEmail:email, email:email, updatedAt:new Date().toISOString()};
    await window.fbSetDoc(window.fbDoc(window.db,"writingTaken", String(curCopy.jobId||curCopy._id)), base, {merge:true});
    await window.fbSetDoc(window.fbDoc(window.db,"writingTaken", String(curCopy.jobId+"_"+email)), base, {merge:true});
    await window.fbSetDoc(window.fbDoc(window.db,"writingRejected", String(curCopy.submittedAt)), {...base, id:String(curCopy.submittedAt)}, {merge:true});
    await window.fbSetDoc(window.fbDoc(window.db,"writingRejected", String(curCopy.jobId+"_"+email)), base, {merge:true});
    await window.fbSetDoc(window.fbDoc(window.db,"writingSubmissions", String(curCopy.submittedAt)), {status:'rejected', feedback:fb}, {merge:true});
  }catch(e){}
  await removeCur();
}
async function feedbackOnly(){
 let fb=document.getElementById('fbBox').value.trim();if(!fb){alert('Type feedback');return;}
 let all=getPending();let idx=all.findIndex(x=>String(x.submittedAt)===String(cur.submittedAt));if(idx>-1){all[idx].adminFeedback=fb;localStorage.setItem(KEY_GLOBAL,JSON.stringify(all));localStorage.setItem(CACHE_PENDING,JSON.stringify(all)); try{ await window.fbSetDoc(window.fbDoc(window.db,"writingPending",String(cur._id||cur.submittedAt)), all[idx]); }catch{}}
 alert('💬 Feedback saved');showPage('pageList');
}
loadList();
</script>
