<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Writing Review - EXACT PAY</title>
<style>
*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0}
body{background:#07070a;color:#fff;padding:12px}
.header{background:#1a102a;border:2px solid #a855f7;padding:12px;border-radius:16px;position:sticky;top:6px;z-index:10;overflow:hidden}
.badge{background:rgba(168,85,247,0.15);color:#c084fc;border:1px solid rgba(168,85,247,0.3);padding:4px 8px;border-radius:99px;font-size:9px;font-weight:900}
.job{background:linear-gradient(135deg,#1a1a2e,#151528);border-left:5px solid #a855f7;border-radius:14px;padding:12px;margin-bottom:12px;position:relative}
.btn{width:100%;padding:12px;border:none;border-radius:12px;font-weight:900;font-size:11px;margin-top:8px;cursor:pointer;display:flex;justify-content:center}
.btn-g{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
.btn-g2{background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid #22c55e}
.btn-r{background:#ef4444;color:#fff}
.btn-r2{background:rgba(239,68,68,0.12);color:#f87171;border:1px solid #ef4444}
.btn-y{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff}
.btn-b{background:#222;color:#fff;border:1px solid #444}
.box{background:#000;padding:10px;border-radius:10px;margin-top:8px;font-size:11px;white-space:pre-wrap;display:none;max-height:260px;overflow:auto;border:1px solid #333}
.box.show{display:block}
textarea{width:100%;background:#0a0a14;color:#fff;border:2px solid #a855f7;border-radius:12px;padding:10px;min-height:90px;outline:none}
.page{display:none}.page.active{display:block}
.confetti{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#a855f7,#22c55e,#60a5fa,#a855f7);background-size:200% 100%;animation:move 2s linear infinite}
@keyframes move{0%{background-position:0%}100%{background-position:200%}}
.top-btn{padding:8px 14px;border-radius:99px;font-weight:900;font-size:10px;text-decoration:none;border:none;cursor:pointer}
</style>
</head>
<body>
<div id="pageList" class="page active"><div class="header"><div style="display:flex;justify-content:space-between"><b style="color:#a855f7">✍️ PENDING WRITING - ALL USERS</b><span style="background:#000;border:1px solid #a855f7;color:#c084fc;padding:5px 12px;border-radius:99px">⏳ <b id="cnt">0</b></span></div><div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button onclick="loadList()" class="top-btn" style="background:#22c55e;color:#fff">🔄 SYNC ALL</button><a href="writing-jobs.html" class="top-btn" style="background:#a855f7;color:#fff">📋 JOBS</a><a href="dashboard.html" class="top-btn" style="background:#222;color:#fff;border:1px solid #444">🏠 DASHBOARD</a><a href="writing.html" class="top-btn" style="background:rgba(255,255,255,0.08);color:#fff">👁️ USER</a></div><div style="font-size:8px;color:#4ade80;margin-top:6px" id="syncStatus">⏳ Connecting Firebase - Loading ALL users...</div><div class="confetti"></div></div><div id="list" style="margin-top:14px"></div></div>
<div id="pageReview" class="page"><div class="header"><button onclick="showPage('pageList')" style="padding:6px 12px;background:#222;color:#fff;border-radius:99px;border:1px solid #444">⬅️ Back</button> <b style="color:#a855f7;margin-left:6px">REVIEW & PAY EXACT</b><div class="confetti"></div></div><div id="reviewDetails" style="margin-top:12px"></div><div style="background:#1e1e32;padding:14px;border-radius:16px;border:2px solid #a855f7;margin-top:12px;position:relative"><div class="confetti"></div><label style="color:#a855f7;font-size:11px;font-weight:800">💬 FEEDBACK (Optional)</label><textarea id="fbBox" placeholder="Leave empty for WITHOUT FEEDBACK"></textarea><button class="btn btn-g" onclick="approve(true)">✅ APPROVE + FEEDBACK - PAY EXACT KES</button><button class="btn btn-g2" onclick="approve(false)">✅ APPROVE WITHOUT - PAY EXACT KES</button><button class="btn btn-r" onclick="reject(true)">❌ REJECT + FEEDBACK</button><button class="btn btn-r2" onclick="reject(false)">❌ REJECT WITHOUT</button><button class="btn btn-y" onclick="feedbackOnly()">💬 FEEDBACK ONLY</button><button class="btn btn-b" onclick="showPage('pageList')">CANCEL</button></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, deleteDoc, collection, getDocs, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB6QxzDFhIIHwt6TTZla6g4m-FaJdMol6M",authDomain:"diamines-agencies.firebaseapp.com",projectId:"diamines-agencies",storageBucket:"diamines-agencies.firebasestorage.app",messagingSenderId:"438413306857",appId:"1:438413306857:web:3c7f736794be6a49b0f978"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.db = db; window.fbSetDoc = setDoc; window.fbDeleteDoc = deleteDoc; window.fbDoc = doc; window.fbGetDoc = getDoc; window.fbCollection = collection; window.fbGetDocs = getDocs; window.fbOnSnapshot = onSnapshot;
window.fbOnSnapshot(window.fbCollection(window.db, "writingPending"), ()=>{ loadListLive(); });
window.fbOnSnapshot(window.fbCollection(window.db, "writingTaken"), ()=>{ loadListLive(); });
</script>

<script>
let pending=[],cur=null;
const KEY_GLOBAL='DIAMINES_WRITING_PENDING_GLOBAL';
const CACHE_PENDING='DIAMINES_WRITING_PENDING_CACHE';
function getPending(){try{return JSON.parse(localStorage.getItem(KEY_GLOBAL)||'[]')}catch{return[]}}
function getCachedPending(){try{return JSON.parse(localStorage.getItem(CACHE_PENDING)||'[]')}catch{return[]}}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='pageList')loadList()}
function toggleBox(id){document.getElementById(id).classList.toggle('show')}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
async function loadListLive(){ await loadList(); }
async function loadList(){
  let cached = getCachedPending();
  if(cached.length){ pending=cached; renderPending(cached, true); }
  else { pending=getPending(); renderPending(pending, true); }
  try{
    document.getElementById('syncStatus').innerText="⏳ Syncing ALL users from Firebase...";
    let snapPending = await window.fbGetDocs(window.fbCollection(window.db, "writingPending"));
    let fbPending=[]; snapPending.forEach(d=>{ let v=d.data(); if(v.written||v.proof) fbPending.push({...v, _id:d.id, _src:'pending'}); });
    let snapTaken = await window.fbGetDocs(window.fbCollection(window.db, "writingTaken"));
    let fbTaken=[]; snapTaken.forEach(d=>{ let v=d.data(); if(v.status==='submitted' && (v.written||v.proof)) fbTaken.push({...v, _id:d.id, _src:'taken', submittedAt: v.submittedAt || v.takenAt, earn: v.price||v.earn }); });
    let merged = [...fbPending];
    fbTaken.forEach(t=>{ if(!merged.find(m=> (m.jobId===t.jobId && m.userEmail===t.userEmail) || String(m.submittedAt)===String(t.submittedAt) )){ merged.push(t); } });
    let local = getPending().filter(l=> l.written || l.proof);
    local.forEach(l=>{ if(!merged.find(m=> String(m.submittedAt)===String(l.submittedAt) )){ merged.push(l); } });
    merged.sort((a,b)=> new Date(b.submittedAt||b.takenAt) - new Date(a.submittedAt||a.takenAt));
    if(merged.length>0){
      localStorage.setItem(CACHE_PENDING, JSON.stringify(merged));
      localStorage.setItem(KEY_GLOBAL, JSON.stringify(merged));
      pending=merged; renderPending(merged, false);
      document.getElementById('syncStatus').innerText="✅ LIVE: "+merged.length+" pending from ALL users 🌍";
    } else {
      document.getElementById('syncStatus').innerText="✅ Synced - "+pending.length+" pending";
      if(pending.length===0) renderPending([], false);
    }
  }catch(e){ document.getElementById('syncStatus').innerText="❌ Firebase error: "+e.message; }
}
function renderPending(list, isCache){
  document.getElementById('cnt').innerText=list.length;
  let html='';list.forEach((j,i)=>{html+=`<div class="job"><div style="display:flex;justify-content:space-between"><b>✍️ ${esc(j.title)}</b><b style="color:#4ade80;background:rgba(34,197,94,0.15);border:1px solid #22c55e;padding:4px 10px;border-radius:99px">KES ${j.earn||j.price}</b></div><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><span class="badge">👤 ${esc(j.userEmail||j.takenBy)}</span><span class="badge" style="background:rgba(255,255,255,0.06)">ID:${esc((j.submittedAt||'').toString().substring(0,13))}</span><span class="badge">${esc(j.words||'')}</span><span class="badge" style="background:rgba(34,197,94,0.1)">${j._src==='taken'?'LIVE':'PENDING'}</span></div><small style="color:#666;font-size:9px">${j.submittedAt?new Date(j.submittedAt).toLocaleString():''}</small><div style="margin-top:8px;display:flex;gap:6px"><button class="btn" style="width:48%;background:#1a102a;color:#c084fc;border:1px solid #a855f7;padding:9px" onclick="toggleBox('o_${i}')">📋 BRIEF</button><button class="btn" style="width:48%;background:#001a0a;color:#7bffa3;border:1px solid #22c55e;padding:9px" onclick="toggleBox('e_${i}')">📄 ARTICLE</button></div><div id="o_${i}" class="box">${esc(j.original||j.topic||j.brief||'')}</div><div id="e_${i}" class="box">${esc(j.proof||j.written||'')}</div><button class="btn btn-y" onclick="openReview(${i})">✍️ REVIEW → PAY EXACT KES ${j.earn||j.price}</button></div>`});
  if(!html)html=`<div style="text-align:center;padding:60px 20px;color:#4b5563"><div style="font-size:50px">🎉</div><b>No pending writing jobs</b><br><small style="color:#666">When users submit from writing.html, they appear here instantly 🌍</small>${isCache?'<br><small>Syncing...</small>':''}</div>`;
  document.getElementById('list').innerHTML=html;
}
function openReview(i){cur=pending[i];document.getElementById('reviewDetails').innerHTML=`<div class="job"><div style="display:flex;justify-content:space-between"><b>${esc(cur.title)}</b><b style="color:#4ade80">EXACT KES ${cur.earn||cur.price}</b></div><div style="margin-top:6px"><span class="badge">👤 ${esc(cur.userEmail||cur.takenBy)}</span> <small style="color:#666">ID:${esc((cur.submittedAt||'').toString())}</small></div><div style="margin-top:4px"><span class="badge">${esc(cur.words||'')} • ${esc(cur.level||'')}</span></div><div style="margin-top:8px;display:flex;gap:6px"><button class="btn" style="width:48%;background:#1a102a;color:#c084fc;border:1px solid #a855f7;padding:9px" onclick="toggleBox('ro')">📋 BRIEF</button><button class="btn" style="width:48%;background:#001a0a;color:#7bffa3;border:1px solid #22c55e;padding:9px" onclick="toggleBox('re')">📄 ARTICLE</button></div><div id="ro" class="box">${esc(cur.original||cur.topic||'')}</div><div id="re" class="box show" style="border-color:#22c55e">${esc(cur.proof||cur.written||'')}</div><div style="background:rgba(168,85,247,0.08);border:1px dashed rgba(168,85,247,0.3);border-radius:12px;padding:10px;margin-top:10px;text-align:center"><small style="color:#a855f7;font-weight:800">💰 EXACT PAYMENT</small><br><b style="font-size:22px;color:#4ade80">KES ${cur.earn||cur.price}</b><br><small style="color:#9ca3af">Will add EXACTLY this - no more, no less</small></div></div>`;document.getElementById('fbBox').value=cur.adminFeedback||'';showPage('pageReview');}
async function removeCur(){
  let all=getPending().filter(x=>String(x.submittedAt)!==String(cur.submittedAt));
  localStorage.setItem(KEY_GLOBAL,JSON.stringify(all)); localStorage.setItem(CACHE_PENDING,JSON.stringify(all));
  try{
    if(cur._id) await window.fbDeleteDoc(window.fbDoc(window.db, "writingPending", String(cur._id)));
    else await window.fbDeleteDoc(window.fbDoc(window.db, "writingPending", String(cur.submittedAt)));
    if(cur.jobId){ try{ await window.fbDeleteDoc(window.fbDoc(window.db, "writingTaken", String(cur.jobId))); }catch{} }
  }catch(e){ console.log("Firebase delete error", e); }
  let emailKey = (cur.userEmail||cur.takenBy||'').toLowerCase();
  if(emailKey){
    let userKey='DIAMINES_WRITING_PD_'+emailKey;
    try{let arr=JSON.parse(localStorage.getItem(userKey)||'[]');localStorage.setItem(userKey,JSON.stringify(arr.filter(x=>String(x.submittedAt)!==String(cur.submittedAt))));}catch{}
  }
}
// FIXED PAY FUNCTION - NOW WRITES TO FIREBASE SO DASHBOARD SEES IT!
async function payExact(email,earn,submittedAt){
 email=email.toLowerCase().trim();earn=parseFloat(earn)||0;submittedAt=String(submittedAt);
 const BAL_KEY='DIAMINES_BAL_'+email;
 const PAID_KEY='DIAMINES_PAID_WRITING_'+email;
 let paidList=JSON.parse(localStorage.getItem(PAID_KEY)||'[]');
 if(paidList.includes(submittedAt)){alert('⚠️ Already paid ID '+submittedAt);return null;}
 let currentBal=parseFloat(localStorage.getItem(BAL_KEY)||'0');
 // GET REAL BALANCE FROM FIREBASE FIRST
 try{
   let snap = await window.fbGetDoc(window.fbDoc(window.db, "users", email));
   if(snap.exists()){ let fbB=parseFloat(snap.data().balance||0); if(fbB>currentBal) currentBal=fbB; }
   let snapW = await window.fbGetDoc(window.fbDoc(window.db, "wallets", email));
   if(snapW.exists()){ let fbB=parseFloat(snapW.data().balance||0); if(fbB>currentBal) currentBal=fbB; }
 }catch{}
 if(isNaN(currentBal))currentBal=0;
 let newBal=currentBal+earn;
 // LOCAL STORAGE - ALL KEYS
 localStorage.setItem(BAL_KEY,newBal.toString());
 localStorage.setItem('BAL_'+email,newBal.toString());
 localStorage.setItem('DIAMINES_BAL',newBal.toString());
 localStorage.setItem('BAL',newBal.toString());
 localStorage.setItem('DIAMINES_WALLET_'+email,newBal.toString());
 localStorage.setItem('DIAMINES_BALANCE_'+email,newBal.toString());
 localStorage.setItem('TOTAL_EARNED_'+email,newBal.toString());
 localStorage.setItem('DIAMINES_TOTAL_EARNED_'+email,newBal.toString());
 localStorage.setItem('DIAMINES_BAL_'+email.toUpperCase(),newBal.toString());
 try{let sess=JSON.parse(localStorage.getItem('DIAMINES_CURRENT')||'null');if(sess&&sess.email&&sess.email.toLowerCase()===email){sess.balance=newBal;sess.wallet=newBal;localStorage.setItem('DIAMINES_CURRENT',JSON.stringify(sess));}}catch(e){}
 // FIREBASE - THIS MAKES DASHBOARD REFLECT!
 try{
   await window.fbSetDoc(window.fbDoc(window.db, "users", email), { balance: newBal, wallet: newBal, email: email, lastEarn: earn, lastEarnAt: new Date().toISOString() }, {merge:true});
   await window.fbSetDoc(window.fbDoc(window.db, "wallets", email), { balance: newBal, email: email, updatedAt: new Date().toISOString() }, {merge:true});
   await window.fbSetDoc(window.fbDoc(window.db, "balances", email), { balance: newBal, email: email }, {merge:true});
   await window.fbSetDoc(window.fbDoc(window.db, "transactions", email+"_"+Date.now()), { email: email, amount: earn, type: "writing_approved", title: cur.title, balance: newBal, createdAt: new Date().toISOString() });
 }catch(err){ console.log("Firebase sync error but local saved", err); }
 paidList.push(submittedAt);localStorage.setItem(PAID_KEY,JSON.stringify(paidList));
 localStorage.setItem('DIAMINES_LAST_PAYMENT',JSON.stringify({email,earn,newBal,type:'writing',time:Date.now()}));
 return newBal;
}
async function approve(withFb){
 let fb=document.getElementById('fbBox').value.trim();
 if(withFb&&!fb)fb='Excellent writing! Approved KES '+(cur.earn||cur.price);
 if(!withFb)fb='Approved by admin. Great article! ✍️';
 let email=(cur.userEmail||cur.takenBy||'').toLowerCase();let earn=parseFloat(cur.earn||cur.price||0);let submittedAt=cur.submittedAt;
 let newBal=await payExact(email,earn,submittedAt);if(newBal===null){showPage('pageList');return;}
 let histKey='DIAMINES_WRITING_HISTORY_'+email;
 let hist=JSON.parse(localStorage.getItem(histKey)||'[]');
 hist.unshift({...cur,status:'approved',feedback:fb,reviewedAt:new Date().toISOString(),price:earn,earn:earn});
 localStorage.setItem(histKey,JSON.stringify(hist));
 try{ await window.fbSetDoc(window.fbDoc(window.db,"writingTaken", String(cur.jobId||cur._id||Date.now())), {...cur, status:'approved', feedback:fb, reviewedAt:new Date().toISOString(), takenBy:email, userEmail:email}); }catch{}
 await removeCur();
 alert('✅ WRITING APPROVED - EXACT PAY\n\n💰 Paid: KES '+earn+' exact\n👤 '+email+'\n💳 New: KES '+newBal+'\n\n✅ Now shows on dashboard LIVE!');
 showPage('pageList');
}
async function reject(withFb){
 let fb=document.getElementById('fbBox').value.trim();
 if(withFb&&!fb){alert('Type feedback');return;}
 if(!withFb)fb='Rejected by admin.';
 let email=(cur.userEmail||cur.takenBy||'').toLowerCase();
 let histKey='DIAMINES_WRITING_HISTORY_'+email;
 let hist=JSON.parse(localStorage.getItem(histKey)||'[]');
 hist.unshift({...cur,status:'rejected',feedback:fb,reviewedAt:new Date().toISOString()});
 localStorage.setItem(histKey,JSON.stringify(hist));
 try{ await window.fbSetDoc(window.fbDoc(window.db,"writingTaken", String(cur.jobId||cur._id||Date.now())), {...cur, status:'rejected', feedback:fb, reviewedAt:new Date().toISOString(), takenBy:email, userEmail:email}); }catch{}
 await removeCur();alert('❌ REJECTED');showPage('pageList');
}
async function feedbackOnly(){
 let fb=document.getElementById('fbBox').value.trim();if(!fb){alert('Type feedback');return;}
 let all=getPending();let idx=all.findIndex(x=>String(x.submittedAt)===String(cur.submittedAt));if(idx>-1){all[idx].adminFeedback=fb;localStorage.setItem(KEY_GLOBAL,JSON.stringify(all));localStorage.setItem(CACHE_PENDING,JSON.stringify(all)); try{ await window.fbSetDoc(window.fbDoc(window.db,"writingPending",String(cur._id||cur.submittedAt)), all[idx]); }catch{}}
 alert('💬 Feedback saved');showPage('pageList');
}
loadList();
</script>
</body>
</html>
