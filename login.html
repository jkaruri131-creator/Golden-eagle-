<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - DIAMINES</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#070711;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}.box{width:100%;max-width:380px;background:#111126;border:1px solid #222;border-radius:16px;padding:20px}.input{width:100%;background:#1e1e3a;border:1px solid #333;border-radius:8px;padding:12px;color:#fff;margin-bottom:10px;outline:none}.input:focus{border-color:#ff4d8d}.btn{width:100%;padding:12px;border-radius:8px;border:none;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#ff0055,#ff4d8d);color:#fff}.msg{display:none;padding:10px;border-radius:8px;font-size:11px;margin-bottom:10px}.msg.err{background:rgba(255,23,68,0.15);border:1px solid #ff1744;color:#ff8da1}.msg.ok{background:rgba(0,230,118,0.15);border:1px solid #00e676;color:#00e676}.popup{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;z-index:9999}.popupBox{background:#111126;border:2px solid #ffb700;border-radius:16px;padding:20px;max-width:320px;text-align:center;width:90%}</style>
</head><body>
<div class="box"><h2 style="color:#ff4d8d;text-align:center;margin-bottom:12px">Login</h2><div id="msg" class="msg"></div><input id="user" class="input" placeholder="Username or Email"><input id="password" type="password" class="input" placeholder="Password"><button class="btn" id="loginBtn">LOGIN</button><p style="text-align:center;margin-top:12px;font-size:11px"><a href="register.html" style="color:#ff4d8d">Create Account</a></p></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6QxzDFhIIHwt6TTZla6g4m-FaJdMol6M",
  authDomain: "diamines-agencies.firebaseapp.com",
  projectId: "diamines-agencies",
  storageBucket: "diamines-agencies.firebasestorage.app",
  messagingSenderId: "438413306857",
  appId: "1:438413306857:web:3c7f736794be6a49b0f978",
  measurementId: "G-4PBTTCZ1YK"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

function showMsg(t,ok){let m=document.getElementById('msg');m.innerHTML=t;m.className=ok?'msg ok':'msg err';m.style.display='block';}
function showPopup(title,msg,color){let d=document.createElement('div');d.className='popup';d.innerHTML=`<div class="popupBox" style="border-color:${color}"><h2 style="color:${color}">${title}</h2><p style="color:#fff;margin:12px 0;font-weight:700;font-size:13px">${msg}</p><button onclick="this.closest('.popup').remove()" style="background:${color};color:#000;border:none;padding:10px 20px;border-radius:8px;font-weight:800">OK</button></div>`;document.body.appendChild(d);}

document.getElementById('loginBtn').onclick = async ()=>{
  let u=document.getElementById('user').value.trim();
  let p=document.getElementById('password').value;
  if(!u||!p) return showMsg('Enter username & password');

  // If username given, find email from localStorage first (for backward compat)
  let emailToLogin = u.toLowerCase();
  if(!u.includes('@')){
    let all=JSON.parse(localStorage.getItem('DIAMINES_ALL_USERS')||'[]');
    let foundLocal = all.find(x=>String(x.username||'').toLowerCase()===u.toLowerCase());
    if(foundLocal) emailToLogin = String(foundLocal.email).toLowerCase();
  }

  showMsg('Logging in...', true);
  try{
    const cred = await signInWithEmailAndPassword(auth, emailToLogin, p);
    const uid = cred.user.uid;
    const snap = await getDoc(doc(db, "users", uid));
    let userData = snap.exists() ? snap.data() : {email: emailToLogin, uid: uid};

    // Check banned/deleted from localStorage (keep your logic)
    let deleted=(JSON.parse(localStorage.getItem('DIAMINES_DELETED_BLACKLIST')||'[]')).map(x=>String(x).toLowerCase());
    let banned=(JSON.parse(localStorage.getItem('DIAMINES_BANNED')||'[]')).map(x=>String(x).toLowerCase());
    if(deleted.includes(emailToLogin)){showPopup('⛔ Account Deleted','Permanently deleted by admin','#ff1744');return;}
    if(banned.includes(emailToLogin)){showPopup('⚠️ On Hold','Account on hold, contact admin','#ffb700');return;}

    // Save session both Firebase + localStorage
    localStorage.setItem('DIAMINES_CURRENT',JSON.stringify(userData));
    localStorage.setItem('DIAMINES_CURRENT_EMAIL', emailToLogin);
    localStorage.setItem('DIAMINES_CURRENT_UID', uid);

    showMsg('✅ Login success - Dashboard',true);
    setTimeout(()=>location.href='dashboard.html',800);
  }catch(err){
    // Fallback to old localStorage login if Firebase fails (for old users)
    try{
      let all=JSON.parse(localStorage.getItem('DIAMINES_ALL_USERS')||'[]');
      let found= all.find(x=> (String(x.username||'').toLowerCase()===u.toLowerCase() || String(x.email||'').toLowerCase()===u.toLowerCase()) && x.password===p);
      if(found){
        localStorage.setItem('DIAMINES_CURRENT',JSON.stringify(found));
        localStorage.setItem('DIAMINES_CURRENT_EMAIL',String(found.email).toLowerCase());
        showMsg('✅ Login success (local) - Dashboard',true);
        setTimeout(()=>location.href='dashboard.html',800);
        return;
      }
    }catch(e){}
    showMsg('❌ '+err.message);
  }
};
</script>
</body></html>
