<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - DIAMINES</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#070711;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}.box{width:100%;max-width:380px;background:#111126;border:1px solid #222;border-radius:16px;padding:20px}.input{width:100%;background:#1e1e3a;border:1px solid #333;border-radius:8px;padding:12px;color:#fff;margin-bottom:10px;outline:none}.input:focus{border-color:#ff4d8d}.btn{width:100%;padding:12px;border-radius:8px;border:none;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#ff0055,#ff4d8d);color:#fff}.msg{display:none;padding:10px;border-radius:8px;font-size:11px;margin-bottom:10px}.msg.err{background:rgba(255,23,68,0.15);border:1px solid #ff1744;color:#ff8da1}.msg.ok{background:rgba(0,230,118,0.15);border:1px solid #00e676;color:#00e676}.popup{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;z-index:9999}.popupBox{background:#111126;border:2px solid #ffb700;border-radius:16px;padding:20px;max-width:320px;text-align:center;width:90%}</style>
</head><body>
<div class="box"><h2 style="color:#ff4d8d;text-align:center;margin-bottom:12px">Login</h2><div id="msg" class="msg"></div><input id="user" class="input" placeholder="Username or Email"><input id="password" type="password" class="input" placeholder="Password"><button class="btn" onclick="doLogin()">LOGIN</button><p style="text-align:center;margin-top:12px;font-size:11px"><a href="register.html" style="color:#ff4d8d">Create Account</a></p></div>
<script>
function showMsg(t,ok){let m=document.getElementById('msg');m.innerHTML=t;m.className=ok?'msg ok':'msg err';m.style.display='flex';}
function showPopup(title,msg,color){let d=document.createElement('div');d.className='popup';d.innerHTML=`<div class="popupBox" style="border-color:${color}"><h2 style="color:${color}">${title}</h2><p style="color:#fff;margin:12px 0;font-weight:700;font-size:13px">${msg}</p><button onclick="this.closest('.popup').remove()" style="background:${color};color:#000;border:none;padding:10px 20px;border-radius:8px;font-weight:800">OK</button></div>`;document.body.appendChild(d);}
function doLogin(){
  let u=document.getElementById('user').value.trim();
  let p=document.getElementById('password').value;
  if(!u||!p) return showMsg('Enter username & password');
  let all=JSON.parse(localStorage.getItem('DIAMINES_ALL_USERS')||'[]');
  let users=JSON.parse(localStorage.getItem('DIAMINES_USERS')||'[]');
  let merged=[...all,...users]; let uniq=[]; merged.forEach(x=>{if(x.email &&!uniq.find(y=>String(y.email).toLowerCase()===String(x.email).toLowerCase())) uniq.push(x)}); merged=uniq;
  let emailToCheck=u.toLowerCase();
  let byUser=merged.find(x=>String(x.username||'').toLowerCase()===u.toLowerCase());
  if(byUser) emailToCheck=String(byUser.email).toLowerCase();
  if(u.includes('@')) emailToCheck=u.toLowerCase();

  let deleted=(JSON.parse(localStorage.getItem('DIAMINES_DELETED_BLACKLIST')||'[]')).map(x=>String(x).toLowerCase());
  let banned=(JSON.parse(localStorage.getItem('DIAMINES_BANNED')||'[]')).map(x=>String(x).toLowerCase());
  if(deleted.includes(emailToCheck)){showPopup('⛔ Account Deleted','Permanently deleted by admin','#ff1744');return;}
  if(banned.includes(emailToCheck)){showPopup('⚠️ On Hold','Account on hold, contact admin','#ffb700');return;}

  let found=merged.find(x=> (String(x.username||'').toLowerCase()===u.toLowerCase() || String(x.email||'').toLowerCase()===u.toLowerCase()) && x.password===p);
  if(!found) return showMsg('Invalid credentials');

  localStorage.setItem('DIAMINES_CURRENT',JSON.stringify(found));
  localStorage.setItem('DIAMINES_CURRENT_EMAIL',String(found.email).toLowerCase());

  // CHECK IF ACTIVE
  let email=String(found.email).toLowerCase();
  let pkg=localStorage.getItem('DIAMINES_PACKAGE_'+email) || found.package || 'none';
  let totalDep=Number(localStorage.getItem('DIAMINES_TOTAL_DEPOSIT_'+email)||0);

  // Not active if package = none/lion AND no deposit
  if(pkg==='none' || pkg==='lion' || pkg==='' || totalDep===0){
    let full=JSON.parse(localStorage.getItem('DIAMINES_ALL_USERS')||'[]').find(x=>String(x.email).toLowerCase()===email);
    let isActive = full && full.activated;
    if(!isActive && totalDep<500){
      showMsg('🔒 Not active - Go to membership',true);
      setTimeout(()=>location.href='membership.html',800);
      return;
    }
  }
  showMsg('✅ Login success - Dashboard',true);
  setTimeout(()=>location.href='dashboard.html',800);
}
</script></body></html>
